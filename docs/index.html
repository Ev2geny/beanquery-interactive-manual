\u0026#x27;6b634369dafa012b83e63be8be0c18bb\u0026#x27;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;PRINT specific entry by id\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "c8ad9277c2f1138dff67c5cba0b30ee8", "console": [], "id": "SQfX", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E\n2023-01-05 * \u0026quot;Fancy Anniversary Dinner\u0026quot; \u0026quot;paid for entire extended family for parent\u0026#x27;s 50th wedding anniversary\u0026quot;\n  Expenses:Food   2000 USD\n  Assets:Cash    -2000 USD\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "0f8017204f33e3978b0ea6258176c53d", "console": [], "id": "HRKw", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EAnother reported use of the \u003Ccode\u003Eid\u003C/code\u003E field is to filter specific entries during queries, especially outlier entries that may throw off aggregate functions (aggregate functions discussed later). While this can also often be accomplished by having the foresight to put those entries in specific categories that can then be filtered on, it is occasionally inconvenient to do so.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "bca8405c074ab9c1f1c92436b55f74d7", "console": [], "id": "MYoQ", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='MYoQ-0' random-id='7ddb1c3e-c96f-1a11-a13e-f96913a97454'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT sum(position) WHERE account = \u0026#x27;Expenses:Food\u0026#x27; AND id != \u0026#x27;6b634369dafa012b83e63be8be0c18bb\u0026#x27;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Exclude a specific entry by id from an aggregate function\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "5a51db7060085fdfe4b44b84f1b6f410", "console": [], "id": "BzwM", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003Esum(position)\n-------------\n30 USD       \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "629e6aec4c87d7f9a70318c9a4bb3c21", "console": [], "id": "nSRe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"11-practical-conclusions-on-using-the-select-query\"\u003E11 Practical conclusions on using the SELECT Query\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "cd4524d310964fe79bbdd3ae2a11292d", "console": [], "id": "TmyF", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EFrom everything mentioned above one can probably make the following practical conclusions on usage of the SELECT query in Beancount.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003Euse the traditional form of the beanquery query on postings\u003C/li\u003E\n\u003Cli\u003Euse the #table form for all other tables\u003C/li\u003E\n\u003Cli\u003Ethere is no particular need to use the \u003Cstrong\u003EFROM\u003C/strong\u003E-clause filtering in the SELECT query, as all the fields are also available for the \u003Cstrong\u003EWHERE\u003C/strong\u003E clause\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E?? Are these conclusions correct?\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7a9d02e6db36449a7a770904634a3106", "console": [], "id": "tbSj", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"12-functions\"\u003E12 Functions\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b4c7335fceca4185de156e3c6179361e", "console": [], "id": "lPrT", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe shell provides a list of simple functions that operate on a single data column and return a new value. These functions operate on particular types. The shell implements rudimentary type verification and should be able to warn you about incompatible types.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EA list of functions, available to be used in the expression of the \u003Ccode\u003EFROM\u003C/code\u003E and \u003Ccode\u003EWHERE\u003C/code\u003E clause can be obtained using the \u003Ccode\u003E.help from\u003C/code\u003E and \u003Ccode\u003E.help where\u003C/code\u003E respectively. E.g.:\u003C/span\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Ebeanquery\u0026gt; .help targets\n\n\nThe list of comma-separated target expressions may consist of columns,\nsimple functions and aggregate functions. If you use any aggregate\nfunction, you must also provide a GROUP-BY clause.\n\nColumns\n-------\n...\n\nFunctions\n---------\n\nabs(decimal)\n...\n\nAggregate functions\n-------------------\n\n...\n\nsum(amount)\n  Calculate the sum of the amount. The result is an Inventory.\n\nsum(inventory)\n  Calculate the sum of the inventories. The result is an Inventory.\n\nsum(decimal)\nsum(int)\n  Calculate the sum of the numerical argument.\n\nsum(position)\n  Calculate the sum of the position. The result is an Inventory.\n\n...\n\nbeanquery\u0026gt;\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "dd2795dae4ed63d32b6d761bea62ff42", "console": [], "id": "KoaX", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"121-aggregate-functions-and-aggregate-queries\"\u003E12.1 Aggregate functions and Aggregate Queries\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "6146ade3157d16feccc074398c6c1318", "console": [], "id": "eLzN", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe \u003Ccode\u003ESELECT\u003C/code\u003E clause (and only the \u003Ccode\u003ESELECT\u003C/code\u003E clause) allows the usage of so-called \u003Cstrong\u003EAggregate functions\u003C/strong\u003E, in addition to ordinary functions.\n\u003Cstrong\u003EAggregate functions\u003C/strong\u003E operate on more than a single row. These functions aggregate and summarize multiple values for the data column that they operate on.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EExamples of aggregate functions include:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003ECOUNT(...)\u003C/code\u003E: Computes the number of postings selected (an integer).\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EFIRST(...)\u003C/code\u003E, \u003Ccode\u003ELAST(...)\u003C/code\u003E: Returns first or last value seen.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EMIN(...)\u003C/code\u003E, \u003Ccode\u003EMAX(...)\u003C/code\u003E: Computes the minimum or maximum value seen.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003ESUM(...)\u003C/code\u003E: Sums up the values of each set. This works on amounts, positions, inventories, numbers, etc.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EUsage of at least one of aggregate function turns a query into an \u003Cstrong\u003EAggregate Query\u003C/strong\u003E. An \u003Cstrong\u003EAggregate query\u003C/strong\u003E is a query, that produces a row of results for each group of postings that match the restrictions in the \u003Ccode\u003EWHERE\u003C/code\u003E clause.  In order to identify the aggregation keys in \u003Cstrong\u003Eclassical SQL\u003C/strong\u003E all the non-aggregate columns have to be flagged using the GROUP BY clause:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EExample:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "6e9d46c42bcf7e674aff43af1a431deb", "console": [], "id": "JHzP", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='JHzP-0' random-id='9f2444dd-2cd6-fc0d-eb0e-6e0244a66f6c'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Assets:Cash USD\u0026#92;n2023-01-01 open Income:Salary USD\u0026#92;n2023-01-01 open Expenses:Food USD\u0026#92;n2023-01-01 open Expenses:Misc USD\u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Salary\u0026#92;\u0026quot;\u0026#92;n  Income:Salary   -500 USD\u0026#92;n  Assets:Cash      500 USD\u0026#92;n\u0026#92;n2023-01-02 * \u0026#92;\u0026quot;Alice\u0026#92;\u0026quot; \u0026#92;\u0026quot;Shopping 1\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   10 USD\u0026#92;n  Assets:Cash    -10 USD\u0026#92;n\u0026#92;n2023-01-03 * \u0026#92;\u0026quot;Bob\u0026#92;\u0026quot; \u0026#92;\u0026quot;Shopping 2\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc   20 USD\u0026#92;n  Assets:Cash    -20 USD\u0026#92;n\u0026#92;n2023-01-04 * \u0026#92;\u0026quot;Alice\u0026#92;\u0026quot; \u0026#92;\u0026quot;Shopping 3\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   30 USD\u0026#92;n  Assets:Cash    -30 USD\u0026#92;n\u0026#92;n2023-01-05 * \u0026#92;\u0026quot;Bob\u0026#92;\u0026quot; \u0026#92;\u0026quot;Shopping 4\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc   40 USD\u0026#92;n  Assets:Cash    -40 USD\u0026#92;n\u0026#92;n2023-01-06 * \u0026#92;\u0026quot;Alice\u0026#92;\u0026quot; \u0026#92;\u0026quot;Shopping 5\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc   50 USD\u0026#92;n  Assets:Cash    -50 USD\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for an aggregate functions demo\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "8a718f20f6c1a91d883d90640c9dda35", "console": [], "id": "elJp", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='elJp-0' random-id='53a08888-39b1-7dfb-c7bf-5b00a8b8c158'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT \u0026#92;n    payee, account, sum(position), last(date)\u0026#92;nWHERE \u0026#92;n    account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;nGROUP BY payee, account\u0026#92;n\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Aggregate query example\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "ac315d6cbba9ec167f9a4714006a08d8", "console": [], "id": "EyBw", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003Epayee     account     sum(position)  last(date)\n-----  -------------  -------------  ----------\nAlice  Expenses:Food  40 USD         2023-01-04\nBob    Expenses:Misc  60 USD         2023-01-05\nAlice  Expenses:Misc  50 USD         2023-01-06\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "fbfd395e72b9f19b49c7ef99256dee8f", "console": [], "id": "MrKo", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='MrKo-0' random-id='84485c28-5f77-1e34-77b3-b2eefe3a51fa'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT \u0026#92;n    payee, account, sum(position), last(date)\u0026#92;nWHERE \u0026#92;n    account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;nGROUP BY 1, 2\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;You may also use the positional order of the targets to declare the group key, like this\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "ac315d6cbba9ec167f9a4714006a08d8", "console": [], "id": "ngkg", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003Epayee     account     sum(position)  last(date)\n-----  -------------  -------------  ----------\nAlice  Expenses:Food  40 USD         2023-01-04\nBob    Expenses:Misc  60 USD         2023-01-05\nAlice  Expenses:Misc  50 USD         2023-01-06\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "f1e7d65d362296c74297bd76b2560419", "console": [], "id": "BNjl", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='BNjl-0' random-id='38db736e-745f-617b-283f-c53169ae7faa'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT \u0026#92;n    payee, account as acc, sum(position), last(date)\u0026#92;nWHERE \u0026#92;n    account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;nGROUP BY 1, acc\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Furthermore, if you name your targets, you can use the explicit target names:\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "340a8cd2da6f7ab21c49aa13597feeec", "console": [], "id": "zLYB", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003Epayee       acc       sum(position)  last(date)\n-----  -------------  -------------  ----------\nAlice  Expenses:Food  40 USD         2023-01-04\nBob    Expenses:Misc  60 USD         2023-01-05\nAlice  Expenses:Misc  50 USD         2023-01-06\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "c93c18086b3b9e8a3c2175e1d4780d50", "console": [], "id": "ofkl", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EUnlike the classical SQL, the beanquery engine however is smart enough to understand what are the grouping keys, without them being explicitly specified. So, it is possible to omit the \u003Ccode\u003EGROUP BY\u003C/code\u003E clause at all:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "dfd3d242a01127893f58044866bdb099", "console": [], "id": "jaBo", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='jaBo-0' random-id='568ed037-55ca-9092-9c1e-46664a329786'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT \u0026#92;n    payee, account, sum(position), last(date)\u0026#92;nWHERE \u0026#92;n    account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;n\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Aggregate query example\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "4a08f094ec40ef2ccf30415e2a81e11e", "console": [], "id": "YCKg", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003Epayee     account     sum(position)  last(date)\n-----  -------------  -------------  ----------\nAlice  Expenses:Food  40 USD         2023-01-04\nBob    Expenses:Misc  60 USD         2023-01-05\nAlice  Expenses:Misc  50 USD         2023-01-06\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "5eea0ca4ec2d22e62773559a73e99751", "console": [], "id": "TzTD", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"122-notable-functions\"\u003E12.2 Notable functions\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "0902eb697051ab3f1f4f487b91cfbaee", "console": [], "id": "ywjc", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThis section discusses some of the notable functions, available in beanquery\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "97b56b5a5c74d16532d504e669a1d852", "console": [], "id": "WyQu", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"1221-sum\"\u003E12.2.1 SUM()\u003C/h4\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "fb2732b6b411ec1ac6433a324b65d479", "console": [], "id": "dGch", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe \u003Ccode\u003ESUM()\u003C/code\u003E function is probably the most widely used aggregate function in beanquery.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Esum(amount)\n  Calculate the sum of the amount. The result is an Inventory.\n\nsum(inventory)\n  Calculate the sum of the inventories. The result is an Inventory.\n\nsum(decimal)\nsum(int)\n  Calculate the sum of the numerical argument.\n\nsum(position)\n  Calculate the sum of the position. The result is an Inventory.\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\nUsage of the \u003Ccode\u003ESUM()\u003C/code\u003E function for a simple case is already demonstrated in the \u003Cstrong\u003EAggregate Functions\u003C/strong\u003E section.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us apply the \u003Ccode\u003Esum()\u003C/code\u003E function to a more complex ledger with lots, tracked at cost and with different commodities.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ENote: for illustrative purposes on the right side the same ledger is printed using the PRINT query command to show the full internal representation of the lot cost (with the cost date and the cost label. E.g. 1 IVV {10 USD, \u003Cstrong\u003E2023-01-11}\u003C/strong\u003E`)\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b896548f7b7f7ba6ba9d29b95c8ba2fe", "console": [], "id": "DpZg", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "051d317e54cd417f12923ef9cb4edccc", "console": [], "id": "NFPl", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='DpZg-0' random-id='03822684-91c6-a813-9fce-0f22e7bb699a'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Assets:Bank\u0026#92;n2023-01-01 open Income:Salary\u0026#92;n2023-01-01 open Assets:Investment\u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Salary\u0026#92;\u0026quot;\u0026#92;n  Income:Salary   -100000 USD\u0026#92;n  Assets:Bank      100000 USD\u0026#92;n\u0026#92;n2023-01-11 * \u0026#92;\u0026quot;Invest in IVV 1\u0026#92;\u0026quot;\u0026#92;n  Assets:Investment   1  IVV {10 USD} \u0026#92;n  Assets:Bank        -10 USD\u0026#92;n\u0026#92;n2023-01-12 * \u0026#92;\u0026quot;Invest in IVV 2a\u0026#92;\u0026quot;\u0026#92;n  Assets:Investment   10 IVV {20 USD} \u0026#92;n  Assets:Bank        -200 USD\u0026#92;n\u0026#92;n2023-01-12 * \u0026#92;\u0026quot;Invest in IVV 2b. The same cost as 2a\u0026#92;\u0026quot;\u0026#92;n  Assets:Investment   20 IVV {20 USD} \u0026#92;n  Assets:Bank        -400 USD\u0026#92;n\u0026#92;n2023-01-12 * \u0026#92;\u0026quot;Invest in IVV 2c. The same cost as 2a, but with label\u0026#92;\u0026quot;\u0026#92;n  Assets:Investment   40 IVV {20 USD, \u0026#92;\u0026quot;lot-label\u0026#92;\u0026quot;} \u0026#92;n  Assets:Bank        -800 USD\u0026#92;n\u0026#92;n2023-01-13 * \u0026#92;\u0026quot;Invest in IVV 3. The same cost as 2a, but different date\u0026#92;\u0026quot;\u0026#92;n  Assets:Investment   100 IVV {20 USD} \u0026#92;n  Assets:Bank        -2000 USD\u0026#92;n\u0026#92;n2023-01-14 * \u0026#92;\u0026quot;Invest in IVV 4. Not at cost with USD\u0026#92;\u0026quot;\u0026#92;n  Assets:Investment   1000  IVV @ 40 USD \u0026#92;n  Assets:Bank        -40000 USD\u0026#92;n\u0026#92;n2023-01-15 * \u0026#92;\u0026quot;Invest in IPP. Not at cost\u0026#92;\u0026quot;\u0026#92;n  Assets:Investment   10 IPP @ 4 USD\u0026#92;n  Assets:Bank        -40 USD\u0026#92;n\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for SUM() function demo at costs\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E2023-01-01 open Assets:Bank\n2023-01-01 open Income:Salary\n2023-01-01 open Assets:Investment\n\n2023-01-01 * \u0026quot;Salary\u0026quot;\n  Income:Salary  -100000 USD\n  Assets:Bank     100000 USD\n\n2023-01-11 * \u0026quot;Invest in IVV 1\u0026quot;\n  Assets:Investment    1 IVV {10 USD, 2023-01-11}\n  Assets:Bank        -10 USD\n\n2023-01-12 * \u0026quot;Invest in IVV 2a\u0026quot;\n  Assets:Investment    10 IVV {20 USD, 2023-01-12}\n  Assets:Bank        -200 USD\n\n2023-01-12 * \u0026quot;Invest in IVV 2b. The same cost as 2a\u0026quot;\n  Assets:Investment    20 IVV {20 USD, 2023-01-12}\n  Assets:Bank        -400 USD\n\n2023-01-12 * \u0026quot;Invest in IVV 2c. The same cost as 2a, but with label\u0026quot;\n  Assets:Investment    40 IVV {20 USD, 2023-01-12, \u0026quot;lot-label\u0026quot;}\n  Assets:Bank        -800 USD\n\n2023-01-13 * \u0026quot;Invest in IVV 3. The same cost as 2a, but different date\u0026quot;\n  Assets:Investment    100 IVV {20 USD, 2023-01-13}\n  Assets:Bank        -2000 USD\n\n2023-01-14 * \u0026quot;Invest in IVV 4. Not at cost with USD\u0026quot;\n  Assets:Investment    1000 IVV @ 40 USD\n  Assets:Bank        -40000 USD\n\n2023-01-15 * \u0026quot;Invest in IPP. Not at cost\u0026quot;\n  Assets:Investment   10 IPP @ 4 USD\n  Assets:Bank        -40 USD\n\u003C/pre\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "e39979b6693f5fa6d9a9533f4180da42", "console": [], "id": "BxxS", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='BxxS-0' random-id='18691c7d-f55e-d241-f501-6f3cad52e1da'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT sum(position)\u0026#92;nWHERE account = \u0026#92;\u0026quot;Assets:Investment\u0026#92;\u0026quot;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Aggregate query to sum positions\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "80b16f5300d855c6608f73602ce3a70b", "console": [], "id": "ZpGF", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E                                            sum(position)                                            \n-----------------------------------------------------------------------------------------------------\n10 IPP  1000 IVV            100 IVV {20 USD}    40 IVV {20 USD}    30 IVV {20 USD}     1 IVV {10 USD}\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "11ed50db1337026cd51a9c5066a10d7f", "console": [], "id": "MXkk", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EObserve that:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003Ethe sum of positions is an inventory\u003Cbr\u003E\n  note, that the way the resulting inventory (the sum of positions) is displayed in beanquery may be a bit confusing, as the cost date cost and label are not displayed (see \u003Ca href=\"https://groups.google.com/g/beancount/c/jdNCyhyq3Ug\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Ethis\u003C/a\u003E discussion).\n  The more complete representation would be :\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E            sum(position)\n-------------------------------------------\n10   IPP\n1000 IVV\n100  IVV {20 USD, 2023-01-13}\n40   IVV {20 USD, 2023-01-12, \u0026quot;lot-label\u0026quot;}\n30   IVV {20 USD, 2023-01-12}\n1    IVV {10 USD, 2023-01-11}\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cul\u003E\n\u003Cli\u003Ethe \u003Ccode\u003Esum()\u003C/code\u003E function joins different lots together, following the rules, which beancount uses to build inventories (see more in the document \u003Ca href=\"https://docs.google.com/document/d/11a9bIoNuxpSOth3fmfuIFzlZtpTJbvw-bPaQCnezQJs\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EHow Inventories Work\u003C/a\u003E):\u003Cul\u003E\n\u003Cli\u003Edifferent commodities are not summed together (\u003Ccode\u003E10 IPP\u003C/code\u003E and \u003Ccode\u003E1000 IVV\u003C/code\u003E are not added together).\u003C/li\u003E\n\u003Cli\u003Eeven when commodities are the same, lots are added together only when all elements of the cost are also the same: the same cost commodity, the same cost date, the same cost label (if available). E.g. in the above example only the following 2 lots are added together:\u003Cbr\u003E \u003Ccode\u003E10 IVV {20 USD, 2023-01-12} + 20 IVV {20 USD, 2023-01-12} = 30 IVV {20 USD, 2023-01-12}\u003C/code\u003E\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e181efcf155eef21719f37511de1f32f", "console": [], "id": "Iijd", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "0875224e750c93bcae48d1956b58754e", "console": [], "id": "axEp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"1222-units-cost\"\u003E12.2.2 UNITS(), COST()\u003C/h4\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b3aa3773ad86536f0e5aaf7edf63f1fc", "console": [], "id": "mKKx", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Ecost(position)\n  Get the cost of a position.\n\ncost(inventory)\n  Get the cost of an inventory.\n\n\nunits(position)\n  Get the number of units of a position (stripping cost).\n\nunits(inventory)\n  Get the number of units of an inventory (stripping cost).\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us see the results of these functions on the same ledger, that was used to demonstrate the \u003Ccode\u003ESUM()\u003C/code\u003E function.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "731ba232ba7e852e410bdfc1ddd67fe8", "console": [], "id": "JWOG", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='JWOG-0' random-id='d8037af9-2e0f-baa1-06fc-777c04dc02f1'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date, narration, account, position, cost(position), units(position)\u0026#92;nWHERE narration ~ \u0026#92;\u0026quot;Invest\u0026#92;\u0026quot;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;UNITS and COST query\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "05c129d114c33c55b3638944fa869f26", "console": [], "id": "IWwC", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date                            narration                               account             position       cost(position)  units(position)\n----------  --------------------------------------------------------  -----------------  -------------------  --------------  ---------------\n2023-01-11  Invest in IVV 1                                           Assets:Investment       1 IVV {10 USD}      10 USD           1 IVV     \n2023-01-11  Invest in IVV 1                                           Assets:Bank           -10 USD              -10 USD         -10 USD     \n2023-01-12  Invest in IVV 2a                                          Assets:Investment      10 IVV {20 USD}     200 USD          10 IVV     \n2023-01-12  Invest in IVV 2a                                          Assets:Bank          -200 USD             -200 USD        -200 USD     \n2023-01-12  Invest in IVV 2b. The same cost as 2a                     Assets:Investment      20 IVV {20 USD}     400 USD          20 IVV     \n2023-01-12  Invest in IVV 2b. The same cost as 2a                     Assets:Bank          -400 USD             -400 USD        -400 USD     \n2023-01-12  Invest in IVV 2c. The same cost as 2a, but with label     Assets:Investment      40 IVV {20 USD}     800 USD          40 IVV     \n2023-01-12  Invest in IVV 2c. The same cost as 2a, but with label     Assets:Bank          -800 USD             -800 USD        -800 USD     \n2023-01-13  Invest in IVV 3. The same cost as 2a, but different date  Assets:Investment     100 IVV {20 USD}    2000 USD         100 IVV     \n2023-01-13  Invest in IVV 3. The same cost as 2a, but different date  Assets:Bank         -2000 USD            -2000 USD       -2000 USD     \n2023-01-14  Invest in IVV 4. Not at cost with USD                     Assets:Investment    1000 IVV             1000 IVV        1000 IVV     \n2023-01-14  Invest in IVV 4. Not at cost with USD                     Assets:Bank        -40000 USD           -40000 USD      -40000 USD     \n2023-01-15  Invest in IPP. Not at cost                                Assets:Investment      10 IPP               10 IPP          10 IPP     \n2023-01-15  Invest in IPP. Not at cost                                Assets:Bank           -40 USD              -40 USD         -40 USD     \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "b975384e847b0ce66b09a630bb23b34e", "console": [], "id": "HVQd", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EObserve that:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003Ethe \u003Ccode\u003Ecost()\u003C/code\u003E function always returns some result, even in cases where the position is not \"held at cost\".  In cases where is no cost, the cost function returns units.\u003C/li\u003E\n\u003Cli\u003Ethe \u003Ccode\u003Ecost()\u003C/code\u003E function only returns a cost amount (decimal number and commodity), without the cost date and label\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EBoth the \u003Ccode\u003Ecost()\u003C/code\u003E and \u003Ccode\u003Eunits()\u003C/code\u003E functions can operate on positions as well as on inventories. That means one can apply these functions either to columns or to the output of the \u003Ccode\u003Esum()\u003C/code\u003E function in an aggregate query.  Let us demonstrate this on the same ledger, that was used for the \u003Ccode\u003ESUM()\u003C/code\u003E function demo:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "aaf4cee1af54d9be276ec0b0211b0183", "console": [], "id": "ipMD", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='ipMD-0' random-id='8609c142-2d0a-009c-df86-eda2bf3a5d42'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT cost(sum(position)), sum(cost(position)), units(sum(position)),  sum(units(position))\u0026#92;nWHERE account = \u0026#92;\u0026quot;Assets:Investment\u0026#92;\u0026quot;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;COST() and UNITS() of inventories\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "bc3742deddaebae2f3550cc4e51519d9", "console": [], "id": "pgJK", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   cost(sum(position))         sum(cost(position))      units(sum(position))  sum(units(position))\n--------------------------  --------------------------  --------------------  --------------------\n10 IPP  1000 IVV  3410 USD  10 IPP  1000 IVV  3410 USD  10 IPP  1171 IVV      10 IPP  1171 IVV    \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "3742d55763d92e5e04955ffb5e9c9d14", "console": [], "id": "XAze", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EObserve, that:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003Ecost(sum(position))\u003C/code\u003E produces the same result as the \u003Ccode\u003Esum(cost(position))\u003C/code\u003E. In another words, the \u003Ccode\u003Ecost()\u003C/code\u003E function, does some internal summing. when applied to an inventory. The same is applicable to the \u003Ccode\u003Eunits()\u003C/code\u003E.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "745d201864379fac4428fb672278f3eb", "console": [], "id": "cwqn", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"1223-convert\"\u003E12.2.3 CONVERT()\u003C/h4\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "873e5159e0adacd4e54b670a030839f7", "console": [], "id": "eYRD", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EBeancount offers first-class support for multi-currency accounting. The \u003Ccode\u003ECONVERT()\u003C/code\u003E function is a key element of it.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003ECONVERT(amount | position | inventory, currency [, date])\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\nConverts a value to a target currency that you specify. Works on an Amount, a Position, or a whole Inventory. It looks up a direct rate first; if none exists, it tries to synthesize one via the position's cost currency. If no conversion is possible, it silently returns the value unchanged rather than erroring.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EThe first argument is the amount, position, or inventory to be converted.\u003C/li\u003E\n\u003Cli\u003EThe second argument is the target commodity to convert to.\u003C/li\u003E\n\u003Cli\u003EThe third (optional) argument is the date at which the exchange rate is looked up. Note that:\u003Cul\u003E\n\u003Cli\u003Ethe function picks the latest price available on or before (but not after) the specified date\u003C/li\u003E\n\u003Cli\u003Eif the date is omitted, the latest available price is used (?? this may have limited practical financial meaning)\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003EEven though not mentioned explicitly, \u003Ccode\u003ECONVERT()\u003C/code\u003E internally uses the \u003Cstrong\u003Eprices\u003C/strong\u003E table, which is populated by \u003Ccode\u003Eprice\u003C/code\u003E directives. Beanquery hides this complexity from users.\u003C/li\u003E\n\u003Cli\u003EPrice specifications are reciprocal. In other words, the following two entries are equivalent:\n  \u003Cdiv class=\"language-cbmbas codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"mf\"\u003E2024\u003C/span\u003E\u003Cspan class=\"o\"\u003E-\u003C/span\u003E\u003Cspan class=\"mf\"\u003E01\u003C/span\u003E\u003Cspan class=\"o\"\u003E-\u003C/span\u003E\u003Cspan class=\"mf\"\u003E01\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Eprice\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003EXXX\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"mf\"\u003E2.0\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003EYYY\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n  \u003Cdiv class=\"language-cbmbas codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"mf\"\u003E2024\u003C/span\u003E\u003Cspan class=\"o\"\u003E-\u003C/span\u003E\u003Cspan class=\"mf\"\u003E01\u003C/span\u003E\u003Cspan class=\"o\"\u003E-\u003C/span\u003E\u003Cspan class=\"mf\"\u003E01\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Eprice\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003EYYY\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"mf\"\u003E0.5\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003EXXX\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EIn practice, there are several ways to use the \u003Ccode\u003Edate\u003C/code\u003E parameter:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003ESpecify a fixed date (e.g. \u003Ccode\u003E2023-01-02\u003C/code\u003E). This is typically used in queries that convert \u003Cstrong\u003EAssets\u003C/strong\u003E and \u003Cstrong\u003ELiabilities\u003C/strong\u003E to a target currency, since under accepted accounting practices these are translated using the exchange rate in effect on the date of the \u003Cstrong\u003ENet Worth report\u003C/strong\u003E.\u003C/li\u003E\n\u003Cli\u003EPass the \u003Ccode\u003Edate\u003C/code\u003E column as the date parameter. In this case \u003Ccode\u003ECONVERT()\u003C/code\u003E uses the posting date to look up the exchange rate, so each posting may use a different rate. This is typically used to convert \u003Cstrong\u003EIncome\u003C/strong\u003E and \u003Cstrong\u003EExpenses\u003C/strong\u003E, since under accepted accounting practices these are translated using the exchange rate in effect on the transaction date.\u003C/li\u003E\n\u003Cli\u003EOmit the date parameter entirely. In this case \u003Ccode\u003ECONVERT()\u003C/code\u003E uses the latest available exchange rate (?? does this have any practical meaning from accounting prospective?).\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us demonstrate this with a simple example:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7f56fdfd00cf9332e56a2efaf2a52b31", "console": [], "id": "XZIo", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='XZIo-0' random-id='a8df30a9-0d1a-2fa3-6fce-c923dd853f25'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;\u0026#92;n2023-01-01 open Assets:Bank \u0026#92;n2023-01-01 open Expenses:Misc\u0026#92;n\u0026#92;n2023-01-01 price USD 1 TUG\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Shopping 1 USD\u0026#92;\u0026quot; \u0026#92;n    Assets:Bank  -1 USD\u0026#92;n    Expenses:Misc 1 USD\u0026#92;n\u0026#92;n2023-01-02 price USD 10 TUG\u0026#92;n2023-01-02 * \u0026#92;\u0026quot;Shopping 2 USD\u0026#92;\u0026quot; \u0026#92;n    Assets:Bank  -1 USD\u0026#92;n    Expenses:Misc 1 USD\u0026#92;n\u0026#92;n2023-01-03 price USD 100 TUG\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for convert function demo\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "c5a6ab3be2a40f15d33ce92490237a6f", "console": [], "id": "cNyH", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='cNyH-0' random-id='c06c4e04-10bf-04e0-2344-b1df7ae8714f'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date, narration, account, position, \u0026#92;n       convert(position, \u0026#92;\u0026quot;TUG\u0026#92;\u0026quot;, date) as in_TUG_with_date, \u0026#92;n       convert(position, \u0026#92;\u0026quot;TUG\u0026#92;\u0026quot;, 2023-01-02) as in_TUG_with_fixed_date,\u0026#92;n       convert(position, \u0026#92;\u0026quot;TUG\u0026#92;\u0026quot;) as in_TUG_no_date\u0026#92;nWHERE account = \u0026#92;\u0026quot;Expenses:Misc\u0026#92;\u0026quot;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;CONVERT() function demo\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "b7b1e429f73f93efcd147e0b35ef7b75", "console": [], "id": "VjEH", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date       narration        account     position  in_tug_with_date  in_tug_with_fixed_date  in_tug_no_date\n----------  --------------  -------------  --------  ----------------  ----------------------  --------------\n2023-01-01  Shopping 1 USD  Expenses:Misc  1 USD      1 TUG            10 TUG                  100 TUG       \n2023-01-02  Shopping 2 USD  Expenses:Misc  1 USD     10 TUG            10 TUG                  100 TUG       \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "c35e016b72b82fd1b6a6dd6fb7e019b4", "console": [], "id": "zesr", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EIf no exchange rate is available, \u003Ccode\u003ECONVERT()\u003C/code\u003E returns the value in the original currency.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EFor example, let us try to convert the previous ledger to EUR.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "1699093ca864202cb8551f9aa0edca67", "console": [], "id": "ISrK", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='ISrK-0' random-id='ac3351fb-7055-c5d2-c117-6e19d95c3da7'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date, narration, account, position, \u0026#92;n       convert(position, \u0026#92;\u0026quot;EUR\u0026#92;\u0026quot;, date) as in_EUR_with_date\u0026#92;nWHERE account = \u0026#92;\u0026quot;Expenses:Misc\u0026#92;\u0026quot;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;CONVERT() function demo for non-convertible currency\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "430e52a7e7dd9c45a2dc57ce28c415fe", "console": [], "id": "oXQC", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date       narration        account     position  in_eur_with_date\n----------  --------------  -------------  --------  ----------------\n2023-01-01  Shopping 1 USD  Expenses:Misc  1 USD     1 USD           \n2023-01-02  Shopping 2 USD  Expenses:Misc  1 USD     1 USD           \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "f8bba7296ae78818cbcb04485d864a41", "console": [], "id": "xqqY", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EWhen converting a position that has a cost, \u003Ccode\u003ECONVERT()\u003C/code\u003E converts the \u003Ccode\u003EUNITS\u003C/code\u003E amount and ignores the cost.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIn the example below, the purchase price is deliberately set differently from the official exchange rate specified by the \u003Ccode\u003Eprice\u003C/code\u003E directive, to illustrate that \u003Ccode\u003ECONVERT()\u003C/code\u003E uses only the rate from the \u003Ccode\u003Eprice\u003C/code\u003E directive.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a5574d99871543c21a1c211f2fa1d9b7", "console": [], "id": "vAZI", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='vAZI-0' random-id='2f28fa8e-fc57-ef5e-7ffd-861e8ef3d496'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Assets:Bank\u0026#92;n2023-01-01 open Assets:Investment\u0026#92;n2023-01-01 open Income:Salary\u0026#92;n\u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Salary\u0026#92;\u0026quot;\u0026#92;n  Income:Salary   -5000 USD\u0026#92;n  Assets:Bank      5000 USD\u0026#92;n\u0026#92;n2023-01-01 price IVV 10 USD\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Investment 1\u0026#92;\u0026quot;\u0026#92;n  Assets:Investment    1 IVV {15 USD} ; \u0026lt;= purchasing at the price, different from the \u0026#92;\u0026quot;official price\u0026#92;\u0026quot; (10 USD) on the same day\u0026#92;n  Assets:Bank         -15 USD\u0026#92;n\u0026#92;n2023-01-02 price IPP 100 USD\u0026#92;n2023-01-02 * \u0026#92;\u0026quot;Investment 2\u0026#92;\u0026quot;\u0026#92;n   Assets:Investment    1 IPP {150 USD} ; \u0026lt;= purchasing at the price, different from the \u0026#92;\u0026quot;official price\u0026#92;\u0026quot; (100 USD) on the same day\u0026#92;n   Assets:Bank         -150 USD\u0026#92;n  \u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for CONVERT() demo with cost\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "df780b03a2958836f204837fd77e6ea3", "console": [], "id": "Cvjs", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='Cvjs-0' random-id='fedec42e-72f9-eccf-1554-6852cf93c85a'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date, account, narration, position, convert(position, \u0026#92;\u0026quot;USD\u0026#92;\u0026quot;, 2023-01-31) as position_in_usd\u0026#92;nWHERE account = \u0026#92;\u0026quot;Assets:Investment\u0026#92;\u0026quot;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;CONVERT() with cost example\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "b2b6d6fda9583778e862e63441171d03", "console": [], "id": "NGNk", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date          account        narration        position     position_in_usd\n----------  -----------------  ------------  ---------------  ---------------\n2023-01-01  Assets:Investment  Investment 1  1 IVV { 15 USD}   10 USD        \n2023-01-02  Assets:Investment  Investment 2  1 IPP {150 USD}  100 USD        \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "f5c793b7629570d8d9c313eda7e56564", "console": [], "id": "CWwK", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EObserve, that \u003Ccode\u003ECONVERT()\u003C/code\u003E has used an exchange rate from the \u003Ccode\u003Eprice\u003C/code\u003E directive to convert IVV and IPP to USD.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "5c00ac7144d7e0525137724e0ac310a2", "console": [], "id": "gYFm", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EAnother important behavior of the \u003Ccode\u003ECONVERT()\u003C/code\u003E is that if an exchange rate is not available for \u003Cstrong\u003Eunits\u003C/strong\u003E currency it tries to fallback to convert a position to the target currency using the position's \u003Cstrong\u003Ecost\u003C/strong\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us demonstarte this on the below 2 legers. In the example on the right, the direct exchange rate IVV -\u0026gt; EUR was not provided via the \u003Ccode\u003Eprice\u003C/code\u003E notation, so the \u003Ccode\u003ECONVERT()\u003C/code\u003E uses position's \u003Cstrong\u003Ecost\u003C/strong\u003E value (which is expressed in USD) to convert it to the target currency (EUR). Since IVV to USD is available, but with the following caveats:\u003C/span\u003E\n\u003Cdiv class=\"language-teratermmacro highlight\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"o\"\u003E-\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Eit\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Eis\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Eable\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Eto\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003Edo\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Ethis\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Eonly\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003Efor\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Ethe\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Eposition\u003C/span\u003E,\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Ewhere\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Ethere\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Ecost\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Eis\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Eavailable\u003C/span\u003E\n\n\u003Cspan class=\"o\"\u003E-\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003Eif\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Eprices\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Ebetween\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Edifferent\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Ecurrencies\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Eare\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Enot\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Econsistent\u003C/span\u003E,\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Ethe\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nb\"\u003Eresult\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Emay\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Ebe\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Enot\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Ewhat\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Eone\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Eexpected\u003C/span\u003E.\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003EThe\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Ebelow\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Eledger\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Edomonstrates\u003C/span\u003E,\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Ewhat\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Eit\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Emeans\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Eto\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Ehave\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Einconsistent\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Eprices\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "ccfff51e876450dd515a7d7463c96e87", "console": [], "id": "iCCe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "8351687859874aa5e09eaaf46e1b8207", "console": [], "id": "ZVxg", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "e6dc286e1c308c907694633de90ea071", "console": [], "id": "RzLA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "cac3191d4aedb26d620e00763a364b88", "console": [], "id": "oRYm", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "732740a95b370c70c5c60bd60a01e063", "console": [], "id": "CtVA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "8914ea06a2259fb76e0fa65b3ee1cabb", "console": [], "id": "TSoP", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='iCCe-0' random-id='1c697648-f0df-0ba3-545c-00ccadeb2d4d'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Assets:Bank\u0026#92;n2023-01-01 open Assets:Investment\u0026#92;n2023-01-01 open Income:Salary\u0026#92;n\u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Salary\u0026#92;\u0026quot;\u0026#92;n  Income:Salary   -5000 USD\u0026#92;n  Assets:Bank      5000 USD\u0026#92;n\u0026#92;n2023-01-01 price USD 10 EUR\u0026#92;n2023-01-01 price IVV 10 USD\u0026#92;n\u0026#92;n; This price makes no real life sense, since \u0026#92;n; it contradicts the previous price of IVV in USD\u0026#92;n; and the USD to EUR price\u0026#92;n; but it is here to demonstrate the behavior of CONVERT() \u0026#92;n\u0026#92;n2023-01-01 price IVV 20 EUR\u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Invest 1\u0026#92;\u0026quot;\u0026#92;n  Assets:Investment    1 IVV {10 USD} \u0026#92;n  Assets:Bank         -10 USD\u0026#92;n\u0026#92;n2023-01-02 * \u0026#92;\u0026quot;Invest 2, not at cost\u0026#92;\u0026quot;\u0026#92;n  Assets:Investment    1 IVV @@ 10 USD\u0026#92;n  Assets:Bank         -10 USD\u0026#92;n  \u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for CONVERT() demo with cost and no cost\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E   date           narration           position     pos_in_usd  pos_in_eur\n----------  ---------------------  --------------  ----------  ----------\n2023-01-01  Invest 1               1 IVV {10 USD}  10 USD      20 EUR    \n2023-01-02  Invest 2, not at cost  1 IVV           10 USD      20 EUR    \n\u003C/pre\u003E\u003C/div\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='oRYm-0' random-id='5f8fa421-4f4f-d589-1fab-20ad4a51b956'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Assets:Bank\u0026#92;n2023-01-01 open Assets:Investment\u0026#92;n2023-01-01 open Income:Salary\u0026#92;n\u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Salary\u0026#92;\u0026quot;\u0026#92;n  Income:Salary   -5000 USD\u0026#92;n  Assets:Bank      5000 USD\u0026#92;n\u0026#92;n2023-01-01 price USD 10 EUR\u0026#92;n2023-01-01 price IVV 10 USD\u0026#92;n\u0026#92;n; This price makes no real life sense, since \u0026#92;n; it contradicts the previous price of IVV in USD\u0026#92;n; and the USD to EUR price\u0026#92;n; but it is here to demonstrate the behavior of CONVERT() \u0026#92;n\u0026#92;n; 2023-01-01 price IVV 20 EUR ; \u0026lt;= commented out\u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Invest 1\u0026#92;\u0026quot;\u0026#92;n  Assets:Investment    1 IVV {10 USD} \u0026#92;n  Assets:Bank         -10 USD\u0026#92;n\u0026#92;n2023-01-02 * \u0026#92;\u0026quot;Invest 2, not at cost\u0026#92;\u0026quot;\u0026#92;n  Assets:Investment    1 IVV @@ 10 USD\u0026#92;n  Assets:Bank         -10 USD\u0026#92;n  \u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger CONVERT() will fall back to convert position cost, if available\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E   date           narration           position     pos_in_usd  pos_in_eur\n----------  ---------------------  --------------  ----------  ----------\n2023-01-01  Invest 1               1 IVV {10 USD}  10 USD      100 EUR   \n2023-01-02  Invest 2, not at cost  1 IVV           10 USD        1 IVV   \n\u003C/pre\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "a16b5c576f969872c52db0c60bc27cd0", "console": [], "id": "vWAQ", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EFor aggregate queries, you can either convert an inventory created by \u003Ccode\u003ESUM()\u003C/code\u003E, or sum the results of \u003Ccode\u003ECONVERT()\u003C/code\u003E. Note that the former approach is not possible when a different exchange rate must be applied to each posting (i.e., when the \u003Ccode\u003Edate\u003C/code\u003E column is used instead of a fixed date).\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "fceab93ce116c56fd42e32e7b42578f5", "console": [], "id": "opEZ", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='opEZ-0' random-id='b6153799-8079-fce0-62f5-add14245bdcf'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT \u0026#92;n     account, \u0026#92;n     convert(sum(position), \u0026#92;\u0026quot;USD\u0026#92;\u0026quot;, 2023-01-31) as total_converted_to_usd,\u0026#92;n     sum(convert(position, \u0026#92;\u0026quot;USD\u0026#92;\u0026quot;, 2023-01-31)) as sum_of_converted_to_usd\u0026#92;nWHERE \u0026#92;n     account = \u0026#92;\u0026quot;Assets:Investment\u0026#92;\u0026quot;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;CONVERT() with cost example for aggregate query\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "ff2ee7a74c1b290e751b1d3644d749c0", "console": [], "id": "zhCr", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E     account       total_converted_to_usd  sum_of_converted_to_usd\n-----------------  ----------------------  -----------------------\nAssets:Investment  110 USD                 110 USD                \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "895234351ce9a04209bb951e9d4ca9d0", "console": [], "id": "CCxq", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"1224-value\"\u003E12.2.4 VALUE()\u003C/h4\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "19bbf4e21289ba24fc8a5a71f86cb3ed", "console": [], "id": "jKDm", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003EVALUE(position | inventory [, date])\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Ccode\u003EVALUE()\u003C/code\u003E is a close sibling of \u003Ca href=\"#1223-convert\"\u003E\u003Ccode\u003ECONVERT()\u003C/code\u003E\u003C/a\u003E. Whilst \u003Ccode\u003ECONVERT()\u003C/code\u003E expresses a value in a target currency \u003Cstrong\u003Eyou\u003C/strong\u003E specify, \u003Ccode\u003EVALUE()\u003C/code\u003E expresses a value in the position's \u003Cstrong\u003Ecost currency\u003C/strong\u003E. If the cost is not available, the value is returned unchanged\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EThe first argument is the position or inventory to be valued.\u003C/li\u003E\n\u003Cli\u003EThe second (optional) argument is the date at which the price is looked up, with the same semantics as in \u003Ccode\u003ECONVERT()\u003C/code\u003E: the latest price on or before (but not after) that date is used, and if the date is omitted the latest available price is used.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us start with a simple portfolio held at cost:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "76df5a0fe98d9ed16df2c29d2b0e6c0e", "console": [], "id": "OcMK", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='OcMK-0' random-id='103c0d7d-6e65-63d8-e20f-dd6599eb64c5'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Assets:Bank\u0026#92;n2023-01-01 open Assets:Investment\u0026#92;n2023-01-01 open Income:Salary\u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Salary\u0026#92;\u0026quot;\u0026#92;n  Income:Salary   -5000 USD\u0026#92;n  Assets:Bank      5000 USD\u0026#92;n\u0026#92;n2023-01-15 * \u0026#92;\u0026quot;Buy 10 IVV at a cost of 100 USD each\u0026#92;\u0026quot;\u0026#92;n  Assets:Investment   10 IVV {100 USD}\u0026#92;n  Assets:Bank        -1000 USD\u0026#92;n\u0026#92;n; latest market price, higher than the purchase cost\u0026#92;n2023-01-31 price IVV 120 USD\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for VALUE() function demo\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "d8e2bddc135358ac3cb7d12ca297265f", "console": [], "id": "QuIQ", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='QuIQ-0' random-id='4090d010-9d44-4ae3-efc2-49a5a9f4a3b6'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date, account, narration, position,\u0026#92;n       value(position) as market_value\u0026#92;nWHERE account = \u0026#x27;Assets:Investment\u0026#x27;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;VALUE() function demo\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "8375dc411b00c406dd547685aa2ba3c8", "console": [], "id": "ZzbA", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date          account                    narration                    position      market_value\n----------  -----------------  ------------------------------------  ----------------  ------------\n2023-01-15  Assets:Investment  Buy 10 IVV at a cost of 100 USD each  10 IVV {100 USD}  1200 USD    \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "1888b0cccd123bcbe031cc1d72d27da2", "console": [], "id": "ETTw", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ELet us compare in more details \u003Cstrong\u003E\u003Ccode\u003EVALUE()\u003C/code\u003E vs \u003Ccode\u003ECONVERT()\u003C/code\u003E.\u003C/strong\u003E The two functions overlap but are not interchangeable:\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003E\u003C/th\u003E\n\u003Cth\u003E\u003Ccode\u003EVALUE(pos [, date])\u003C/code\u003E\u003C/th\u003E\n\u003Cth\u003E\u003Ccode\u003ECONVERT(pos, currency [, date])\u003C/code\u003E\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003ETarget currency\u003C/td\u003E\n\u003Ctd\u003Einferred (the position's cost currency)\u003C/td\u003E\n\u003Ctd\u003Eyou specify it explicitly\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EPosition \u003Cstrong\u003Enot\u003C/strong\u003E at cost (e.g. cash)\u003C/td\u003E\n\u003Ctd\u003Ereturned \u003Cstrong\u003Eunchanged\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003Econverted to the target currency\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003ETypical use\u003C/td\u003E\n\u003Ctd\u003Emark a portfolio \u003Cstrong\u003Eto market\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003Eexpress balances \u003Cstrong\u003Ein one reporting currency\u003C/strong\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003EThe example below puts them side by side on a ledger that holds both a stock (at cost) and plain cash.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b9c34000cf85f834757a8c15ddd53151", "console": [], "id": "BxLv", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='BxLv-0' random-id='b9234b78-5a3d-aac0-0655-cbbfbf8ad1b3'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Assets:Bank\u0026#92;n2023-01-01 open Assets:Investment\u0026#92;n2023-01-01 open Income:Salary\u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Salary\u0026#92;\u0026quot;\u0026#92;n  Income:Salary   -5000 USD\u0026#92;n  Assets:Bank      5000 USD\u0026#92;n\u0026#92;n2023-01-15 * \u0026#92;\u0026quot;Buy 10 IVV at a cost of 100 USD each\u0026#92;\u0026quot;\u0026#92;n  Assets:Investment   10 IVV {100 USD}\u0026#92;n  Assets:Bank        -1000 USD\u0026#92;n\u0026#92;n2023-01-16 * \u0026#92;\u0026quot;Buy 10 IVV NOT at a cost of 100 USD each\u0026#92;\u0026quot;\u0026#92;n  Assets:Investment   10 IVV @ 100 USD\u0026#92;n  Assets:Bank        -1000 USD\u0026#92;n\u0026#92;n2023-01-31 price IVV 120 USD\u0026#92;n2023-01-31 price USD 0.9 EUR\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger comparing VALUE() and CONVERT()\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "86539aaf94cfdc038f4a02066586a73e", "console": [], "id": "IiyY", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='IiyY-0' random-id='f02a58fd-f141-3527-a0b0-690183a52c94'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date, account, narration, position,\u0026#92;n       value(position) as value_func,\u0026#92;n       convert(position, \u0026#x27;USD\u0026#x27;) as convert_usd,\u0026#92;n       convert(position, \u0026#x27;EUR\u0026#x27;) as convert_eur\u0026#92;nWHERE account = \u0026#x27;Assets:Investment\u0026#x27;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;VALUE() vs CONVERT() side by side\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "226738e04e4ffc83bf09ee6601942be6", "console": [], "id": "rKHS", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date          account                      narration                      position      value_func  convert_usd  convert_eur\n----------  -----------------  ----------------------------------------  ----------------  ----------  -----------  -----------\n2023-01-15  Assets:Investment  Buy 10 IVV at a cost of 100 USD each      10 IVV {100 USD}  1200 USD    1200 USD     1080.0 EUR \n2023-01-16  Assets:Investment  Buy 10 IVV NOT at a cost of 100 USD each  10 IVV              10 IVV    1200 USD       10   IVV \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "0fd2c7e62147ca6d612d6b5417a8d105", "console": [], "id": "SStq", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"1225-root\"\u003E12.2.5 ROOT()\u003C/h4\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "0cbae6ddf6fca17429082994622087ff", "console": [], "id": "LNTb", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe \u003Ccode\u003EROOT(account_name: str, n: int =1)\u003C/code\u003E function returns the first \u003Cstrong\u003En\u003C/strong\u003E parts from the left of the account name. The default value of the \u003Cstrong\u003En\u003C/strong\u003E argument is 1.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EE.g. \u003Ccode\u003Eroot(\"Expenses:Shopping:Misc\", 2)\u003C/code\u003E returns \u003Ccode\u003EExpenses:Shopping\u003C/code\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis is very useful to be used together with an aggregate function to consolidate positions together on a higher level of accounts hierarchy.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EE.g.: in the below example we use this function to show P\u0026amp;L -like information, where we show total Income and total Expenses without breaking these down further.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "0209a0d0099246447720731c2da6bfa0", "console": [], "id": "dGVZ", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='dGVZ-0' random-id='d5ebe619-8613-286a-9d1e-9b1b24058305'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Assets:Bank\u0026#92;n2023-01-01 open Income:Salary\u0026#92;n2023-01-01 open Income:SideJob\u0026#92;n2023-01-01 open Expenses:Food\u0026#92;n2023-01-01 open Expenses:Misc\u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Salary\u0026#92;\u0026quot;\u0026#92;n  Income:Salary   -1000 USD\u0026#92;n  Assets:Bank      1000 USD\u0026#92;n\u0026#92;n2023-01-02 * \u0026#92;\u0026quot;Expenses 1\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   100 USD\u0026#92;n  Assets:Bank    -100 USD\u0026#92;n\u0026#92;n2023-01-03 * \u0026#92;\u0026quot;Side job\u0026#92;\u0026quot;\u0026#92;n  Income:SideJob   -200 USD\u0026#92;n  Assets:Bank      200 USD\u0026#92;n\u0026#92;n2023-01-03 * \u0026#92;\u0026quot;Expenses 2\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc   50 USD\u0026#92;n  Assets:Bank    -50 USD\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for ROOT() function demo\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "de39ed7eeadaeaabcf5c6724b17b2863", "console": [], "id": "MwfG", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='MwfG-0' random-id='42559b6b-7475-ca3e-161b-e42659f4bbe8'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT \u0026#92;n    root(account,1) as acc_shortened,\u0026#92;n    sum(position)\u0026#92;nWHERE account ~ \u0026#x27;^Expenses|Income\u0026#x27;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Using ROOT() function to calculate square\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "652d1a71b1da9449d70bbce0171cf8f3", "console": [], "id": "TxKU", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003Eacc_shortened  sum(position)\n-------------  -------------\nIncome         -1200 USD    \nExpenses         150 USD    \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "e44b82e0f3533fbc056f7ba13af87e0a", "console": [], "id": "cPpt", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"1226-intervalstr\"\u003E12.2.6 INTERVAL(str)\u003C/h4\u003E\n\u003Cspan class=\"paragraph\"\u003EThe BQL function \u003Ccode\u003Einterval('...')\u003C/code\u003E creates an object of type \u003Ccode\u003Erelativedelta\u003C/code\u003E that can be used to modify dates using the \u003Cstrong\u003E\u003Ca href=\"#914-date-operators\"\u003E+/-\u003C/a\u0
