      3200 USD   \nIncome:Salary      -11000 USD   \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "ebec5ac0613338d51739650c174ba08e", "console": [], "id": "zWBP", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ETo generate a balance sheet, you would add the CLEAR option and select the other accounts:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "31620047bf15e241bc7a3d6bd66a7a9d", "console": [], "id": "LeFQ", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='LeFQ-0' random-id='266d3f33-4c27-4e83-2d88-33bd7ed2ad39'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT account, sum(position) \u0026#92;nFROM OPEN ON 2012-01-01 CLOSE ON 2013-01-01 CLEAR\u0026#92;nWHERE not account ~ \u0026#x27;Income|Expenses\u0026#x27;\u0026#92;nGROUP BY 1\u0026#92;nORDER BY 1;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Balance sheet example using OPEN ON, CLOSE ON, CLEAR\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "afb287395434b21ab1e290e786aa6b94", "console": [], "id": "CqeI", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E         account               sum(position)    \n--------------------------  --------------------\nAssets:CA:Checking           9750 CAD           \nAssets:US:Checking                      6200 USD\nEquity:Conversions:Current  -9750 CAD   8000 USD\nEquity:Earnings:Current                -7600 USD\nEquity:Earnings:Previous               -6400 USD\nEquity:Opening-Balances                         \nLiabilities:CreditCard                  -200 USD\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "f180d1e343a2e093165d4889d473e833", "console": [], "id": "pFwJ", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"16-high-level-shortcuts-journal-balance-print\"\u003E16 High-level shortcuts (JOURNAL, BALANCE, PRINT)\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "4d8e1a58b3440237d28e0167f3011599", "console": [], "id": "scTs", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThere are two types of queries that are very common for accounting applications: journals and balances reports. This section describes a few additional selection commands that translate directly into SELECT statements and which are then run with the same query code. These are intended as convenient shortcuts.  ?? It looks like the equivalent SELECT statements are more flexible (see more below).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIn this section we will be using the following ledger for all the examples:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "332baf8687196e45943a294d0aa74906", "console": [], "id": "ZoYX", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='ZoYX-0' random-id='5111c903-44e0-dadc-b08f-e28bd14a22fd'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Income:Salary\u0026#92;n2023-01-01 open Assets:Bank-A\u0026#92;n2023-01-01 open Assets:Bank-B\u0026#92;n2023-01-01 open Expenses:Misc \u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Salary\u0026#92;\u0026quot;\u0026#92;n  Income:Salary   -1000 USD\u0026#92;n  Assets:Bank-A    750 USD\u0026#92;n  Assets:Bank-B    250 USD\u0026#92;n\u0026#92;n2023-01-02 * \u0026#92;\u0026quot;Shopping using Bank-A\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    100 USD\u0026#92;n  Assets:Bank-A   -100 USD\u0026#92;n\u0026#92;n2023-01-03 * \u0026#92;\u0026quot;Shopping using Bank-B\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    110 USD\u0026#92;n  Assets:Bank-B   -110 USD\u0026#92;n\u0026#92;n2023-01-04 * \u0026#92;\u0026quot;Shopping using Bank-A again\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    120 USD\u0026#92;n  Assets:Bank-A   -120 USD\u0026#92;n  \u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for JOURNAL test\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "d844f1905d6238f99b485146d91393c4", "console": [], "id": "dHsP", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"161-selecting-journals-journal-query\"\u003E16.1 Selecting Journals (JOURNAL query)\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "76f5ba720a3f5fc461cbe6f99f338fe5", "console": [], "id": "JXhF", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EA common type of query is one that generates a linear journal of entries (Ledger calls this a \u201cregister\u201d). This roughly corresponds to an account statement, but with our language, such a statement can be generated for any subset of postings.\nYou can generate a journal with the following syntax:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ccode\u003EJOURNAL \u0026lt;account-regexp\u0026gt; [AT \u0026lt;function\u0026gt;] [FROM \u2026]\u003C/code\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe regular expression account-regexp is used to select which subset of accounts to generate a journal for. The optional \u003Ccode\u003EAT \u0026lt;function\u0026gt;\u003C/code\u003E clause is used to specify an aggregation function for the amounts rendered (typically \u003Ccode\u003EUNITS\u003C/code\u003E or \u003Ccode\u003ECOST\u003C/code\u003E). The \u003Ccode\u003EFROM\u003C/code\u003E clause follows the same rules as for the \u003Ccode\u003ESELECT\u003C/code\u003E statement and is optional.\nHere is an example journal-generating query:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "4c0d164e2991a13010dcd69a59135968", "console": [], "id": "ObdO", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='ObdO-0' random-id='bf0d7b62-ff6b-7146-731b-71ee85333281'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;JOURNAL \u0026#92;\u0026quot;Assets:Bank-A\u0026#92;\u0026quot;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;JOURNAL query\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "ee092d8a3be6bb98c818f27be691fa44", "console": [], "id": "ttDF", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date     flag  MAXWIDTH(payee, 48)    MAXWIDTH(narration, 80)       account     position  balance\n----------  ----  -------------------  ---------------------------  -------------  --------  -------\n2023-01-01  *                          Salary                       Assets:Bank-A   750 USD  750 USD\n2023-01-02  *                          Shopping using Bank-A        Assets:Bank-A  -100 USD  650 USD\n2023-01-04  *                          Shopping using Bank-A again  Assets:Bank-A  -120 USD  530 USD\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "52f466a3340eb305d1d1e78a178f740e", "console": [], "id": "JXtN", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='JXtN-0' random-id='0cd00ba3-8543-fa7a-4570-732204c4b5bc'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date, narration, account, position, balance\u0026#92;nWHERE account ~ \u0026#x27;Assets:Bank-A\u0026#x27;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Equivalent to JOURNAL SELECT ... WHERE query\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "2e539e8faf09a4c9f356e215ee27912a", "console": [], "id": "DBuH", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date              narration              account     position  balance\n----------  ---------------------------  -------------  --------  -------\n2023-01-01  Salary                       Assets:Bank-A   750 USD  750 USD\n2023-01-02  Shopping using Bank-A        Assets:Bank-A  -100 USD  650 USD\n2023-01-04  Shopping using Bank-A again  Assets:Bank-A  -120 USD  530 USD\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "0b9c147435598b77725d2ca9f29f2b7d", "console": [], "id": "mfMz", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"162-selecting-balances-balances-query\"\u003E16.2 Selecting Balances (BALANCES query)\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "881af78b6b39fc06e612019723dc38e0", "console": [], "id": "uDnn", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe other most common type of report is a table of the balances of various accounts at a particular date. This can be viewed as a SELECT query aggregating positions grouping by account.\nYou can generate a balances report with the following syntax:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ccode\u003EBALANCES [AT \u0026lt;function\u0026gt;] [FROM \u2026]\u003C/code\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe optional \u003Ccode\u003EAT \u0026lt;function\u0026gt;\u003C/code\u003E clause is used to specify an aggregation function for the balances rendered (usually UNITS or COST). The \u003Ccode\u003EFROM\u003C/code\u003E clause follows the same rules as for the SELECT statement and is optional.\nTo generate your balances at a particular date, close your set of entries using the \u003Ccode\u003EFROM\u2026 CLOSE ON\u003C/code\u003E form described above.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EObserve that typical balance sheets and income statements seen in an accounting context are subsets of tables of balances such as reported by this query. An income statement reports on just the transactions that appears during a period of time, and a balance sheet summarizes transactions before its reporting before and clears the income \u0026amp; expenses accumulated during the period to an equity account. Then some minor reformatting is carried out. Please consult the introduction document on double-entry bookkeeping for more details, and the section above that discusses the \u201copen\u201d, \u201cclose\u201d and \u201cclear\u201d operations.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "5d683ff6532e8807460b35f2e3996293", "console": [], "id": "xZoV", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "280cee5c7dfbf6c3a45a652e347a7bae", "console": [], "id": "zgSx", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "fd350b514cec11895b7bf63d7ffe62f1", "console": [], "id": "UxeJ", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "6ecc96f793aa68162aaff6d55d079531", "console": [], "id": "Rqsd", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "15a73c2bda6e9dc59a43b24f08b6065f", "console": [], "id": "CUSL", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='xZoV-0' random-id='2b3da754-6ef4-0404-9e4c-3a19d321e08a'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;BALANCES \u0026#92;nFROM DATE \u0026lt;=2023-01-03 \u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;BALANCES query\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E   account     SUM((position))\n-------------  ---------------\nAssets:Bank-A    650 USD      \nAssets:Bank-B    140 USD      \nIncome:Salary  -1000 USD      \nExpenses:Misc    210 USD      \n\u003C/pre\u003E\u003C/div\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='UxeJ-0' random-id='692c8fe5-c69f-dd2f-c6e0-117464572659'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT account, SUM(position)\u0026#92;nWHERE date \u0026lt;=2023-01-03 \u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Equivalent to BALANCES SELECT ... WHERE query\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E   account     SUM(position)\n-------------  -------------\nIncome:Salary  -1000 USD    \nAssets:Bank-A    650 USD    \nAssets:Bank-B    140 USD    \nExpenses:Misc    210 USD    \n\u003C/pre\u003E\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "507875ccdb3e6147032e25fefc46381a", "console": [], "id": "WHPA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E?? It seems that the \u003Ccode\u003ESELECT ... WHERE\u003C/code\u003E  offers the same functionality, but with a better flexibility. E.g. it is also possible to filter specific accounts, and / or apply the \u003Ca href=\"#1225-root\"\u003E\u003Ccode\u003Eroot()\u003C/code\u003E\u003C/a\u003E function to accounts.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EE.g.: would it be possible to do the following with the BALANCES query, where we select balances only for assets?\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "364ecf965690f015b7ae887888230b42", "console": [], "id": "gkhP", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='gkhP-0' random-id='b2ecabb5-8db2-3e69-1a64-7f3874814264'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT root(account,1) as account_short, SUM(position)\u0026#92;nWHERE date \u0026lt;=2023-01-03 AND account ~ \u0026#x27;^Assets\u0026#x27;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Balances per set of accounts with WHERE filter\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "9c60a2aebe3cfadf6c7abddd2a5cee6f", "console": [], "id": "bCtP", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003Eaccount_short  SUM(position)\n-------------  -------------\nAssets         790 USD      \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "1a2cf06c4b0f0848984ce0191075e2a1", "console": [], "id": "CFeq", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"163-print-print-query\"\u003E16.3 Print (PRINT query)\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "3f27d659bb688cee020c72f172ce51e3", "console": [], "id": "ZLBN", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EIt can be useful to generate output in Beancount format, so that subsets of transactions can be saved to files, for example. The shell provides that ability via the PRINT command:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ccode\u003EPRINT [FROM \u2026]\u003C/code\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe FROM clause obeys the usual semantics as described elsewhere in this document. The resulting filtered stream of Beancount entries is then printed out on the output in Beancount syntax.\nIn particular, just running the \u003Ccode\u003EPRINT\u003C/code\u003E command will spit out the parsed and loaded contents of a Beancount file. You can use this for troubleshooting if needed, or to expand transactions generated from a plugin you may be in the process of developing.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EExample:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "badf3b038768bec54e96988312c59f9d", "console": [], "id": "QdYH", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='QdYH-0' random-id='4749a9e1-f62c-36e9-33cd-bc7ad453f38e'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;PRINT FROM date \u0026gt;=2023-01-02 \u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Print entries from a specific date\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "5a8e7171febb002956edc981929d1815", "console": [], "id": "xJrT", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E\n2023-01-02 * \u0026quot;Shopping using Bank-A\u0026quot;\n  Expenses:Misc   100 USD\n  Assets:Bank-A  -100 USD\n\n2023-01-03 * \u0026quot;Shopping using Bank-B\u0026quot;\n  Expenses:Misc   110 USD\n  Assets:Bank-B  -110 USD\n\n2023-01-04 * \u0026quot;Shopping using Bank-A again\u0026quot;\n  Expenses:Misc   120 USD\n  Assets:Bank-A  -120 USD\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "feaac33b7d5294c897f11e3f3584072d", "console": [], "id": "OHjY", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ENote, that unlike any other type of query commands, the \u003Ccode\u003EPRINT\u003C/code\u003E does not produce a tabular data, but just a text output.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "661ae631a96c466fdccd2c8a79f1a165", "console": [], "id": "wVcg", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"17-usage-of-beanquery-with-data-frames\"\u003E17 Usage of beanquery with Data Frames\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "4427d2e080c91086c05fd8c71899c04b", "console": [], "id": "hiqK", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003E#TODO: add information\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a3a4613b11a482078c68d962bcc3974d", "console": [], "id": "rWUR", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"18-working-around-beanquery-limitations\"\u003E18 Working around beanquery limitations\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "80b8b1c0b56d6a4fd3c6c350584e2af0", "console": [], "id": "nHCg", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThis section will discuss of the beanquery limitations and how to work around them\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003E#TODO: add information\u003C/em\u003E\u003C/span\u003E\n\u003Ch3 id=\"181-no-table-joining\"\u003E18.1 No table joining\u003C/h3\u003E\n\u003Cul\u003E\n\u003Cli\u003EUse built in functions\u003C/li\u003E\n\u003Cli\u003EUse data frames\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b36fec8b0e30da4e35ef8a158e9a830b", "console": [], "id": "pBAi", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"19-example-queries-for-typical-situations\"\u003E19 Example queries for typical situations\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "0552c7ca971dd4d40a1635edf8c1cae9", "console": [], "id": "WiIL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThis section collects examples of queries to be used in different practical situations\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003E#TODO: don't by shy to add lots  of examples\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "3eb50a29b49eb77a4f9b66496afaa8c3", "console": [], "id": "FRDQ", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"191-simple-journal-ledger-of-expense-transactions\"\u003E19.1 Simple journal ledger of expense transactions\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "5b298b4b70ea9f93e61c2571b46b8e7a", "console": [], "id": "bcHD", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ETo get a simple journal of expense postings within a particular date range, one can execute the following:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "50eb7e1bfecfd32ac3a8e4f64efe3758", "console": [], "id": "HNvH", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='HNvH-0' random-id='27f66a53-9ab0-6190-aa1f-1dded0662986'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;\u0026#92;nSELECT\u0026#92;n    date, flag, description, position, account, other_accounts\u0026#92;nFROM\u0026#92;n    account~\u0026#x27;Expenses:\u0026#x27;\u0026#92;nWHERE\u0026#92;n    date \u0026gt;= 2026-01-01\u0026#92;n    AND date \u0026lt; 2026-04-01\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Expense postings in 2026 up to March 31\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "5b294c4fb8a289d941f93f62c0d99c98", "console": [], "id": "zGpX", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EA couple of things to note:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EThe \u003Ccode\u003Edescription\u003C/code\u003E field conveniently combines the \u003Ccode\u003Epayee\u003C/code\u003E and \u003Ccode\u003Enarration\u003C/code\u003E fields, separated by a space-padded pipe ' | '\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Eother_accounts\u003C/code\u003E gives the accounts from the other postings on the parent transaction, similarly separated by ' | '\u003C/li\u003E\n\u003Cli\u003EIn this particular example, the other accounts would typically be the payment methods used\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "11bfa6159fa2f6b7a6004ef9c3d091c3", "console": [], "id": "zPJp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EHere is an example of the usage of this query on a ledger with a few ordinary expenses:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c439d6425863985349208356681ff4e3", "console": [], "id": "ddwz", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='ddwz-0' random-id='3f1ba963-7840-8029-093e-6d4b712ce203'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2024-01-01 open Liabilities:Some-Card                 USD\u0026#92;n2024-01-01 open Expenses:Car:Repair-and-Maintenance   USD\u0026#92;n2024-01-01 open Liabilities:Some-Other-Card           USD\u0026#92;n2024-01-01 open Expenses:Medical-Expenses             USD\u0026#92;n2024-01-01 open Assets:Checking-Account               USD\u0026#92;n2024-01-01 open Expenses:Clothes-etc                  USD\u0026#92;n\u0026#92;n2026-03-10 * \u0026#92;\u0026quot;Advance Auto Parts\u0026#92;\u0026quot; \u0026#92;\u0026quot;Synthetic oil and brake fluid\u0026#92;\u0026quot;\u0026#92;n    Liabilities:Some-Card                -20.84 USD\u0026#92;n    Expenses:Car:Repair-and-Maintenance   20.84 USD\u0026#92;n\u0026#92;n2026-02-15 * \u0026#92;\u0026quot;CVS\u0026#92;\u0026quot; \u0026#92;\u0026quot;Prescription pickup\u0026#92;\u0026quot;\u0026#92;n    Liabilities:Some-Other-Card   -15.00 USD\u0026#92;n    Expenses:Medical-Expenses      15.00 USD\u0026#92;n\u0026#92;n2026-01-15 * \u0026#92;\u0026quot;Target\u0026#92;\u0026quot; \u0026#92;\u0026quot;Earrings\u0026#92;\u0026quot;\u0026#92;n    Assets:Checking-Account -78 USD  ; debit card\u0026#92;n    Expenses:Clothes-etc\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Simple expense transactions\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "47aa8db46dd61557c20975793ae16364", "console": [], "id": "kFqL", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date     flag                     description                       position                account                       other_accounts      \n----------  ----  --------------------------------------------------  ---------  -----------------------------------  ---------------------------\n2026-01-15  *     Target | Earrings                                   78.00 USD  Expenses:Clothes-etc                 Assets:Checking-Account    \n2026-02-15  *     CVS | Prescription pickup                           15.00 USD  Expenses:Medical-Expenses            Liabilities:Some-Other-Card\n2026-03-10  *     Advance Auto Parts | Synthetic oil and brake fluid  20.84 USD  Expenses:Car:Repair-and-Maintenance  Liabilities:Some-Card      \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "6892067f6d93964065e2610b101320ca", "console": [], "id": "MSYg", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"192-net-worth-and-pl-like-reports-in-multi-commodities-ledger\"\u003E19.2 Net Worth and P\u0026amp;L-like reports in multi-commodities ledger\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c623abd749997a1328fdcc7f9e70673c", "console": [], "id": "tDqy", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EOne of the typical situations is when some (or all) of Income and  Expenses are in one currency, but reporting has to be done in another currency. Throughout the accounting period one currency fluctuates against another currency.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EE.g.: let us look at a situation when Income and Expenses are in one currency (TUG), but reporting has to be done in USD. Throughout the accounting period the value of TUG drops from 1 USD to 0.25 USD.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "65a1e980d49016e172d78a3071c46c86", "console": [], "id": "nmfp", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='nmfp-0' random-id='b7599fe2-12d1-b57b-15ec-c00f0efbe21c'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Assets:Bank-A \u0026#92;n2023-01-01 open Income:Salary\u0026#92;n2023-01-01 open Expenses:Misc\u0026#92;n\u0026#92;n; January\u0026#92;n2023-01-01 price USD 1 TUG\u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Salary January 2023\u0026#92;\u0026quot;\u0026#92;n  Assets:Bank-A  2000 TUG\u0026#92;n  Income:Salary -2000 TUG\u0026#92;n\u0026#92;n2023-01-02 * \u0026#92;\u0026quot;Expenses January 2023\u0026#92;\u0026quot;\u0026#92;n  Assets:Bank-A  -1000 TUG\u0026#92;n  Expenses:Misc   1000 TUG\u0026#92;n\u0026#92;n; June\u0026#92;n2023-06-01 price USD 2 TUG    ; \u0026lt;= big inflation of TUG vs USD\u0026#92;n\u0026#92;n2023-06-01 * \u0026#92;\u0026quot;Salary June 2023\u0026#92;\u0026quot;\u0026#92;n  Assets:Bank-A  2000 TUG\u0026#92;n  Income:Salary -2000 TUG\u0026#92;n\u0026#92;n2023-06-02 * \u0026#92;\u0026quot;Expenses June 2023\u0026#92;\u0026quot;\u0026#92;n  Assets:Bank-A  -1000 TUG\u0026#92;n  Expenses:Misc   1000 TUG\u0026#92;n\u0026#92;n; October\u0026#92;n2023-10-01 price USD 4 TUG    ; \u0026lt;= big inflation of TUG vs USD again\u0026#92;n\u0026#92;n2023-10-01 * \u0026#92;\u0026quot;Salary October 2023\u0026#92;\u0026quot;\u0026#92;n  Assets:Bank-A  2000 TUG\u0026#92;n  Income:Salary -2000 TUG\u0026#92;n\u0026#92;n2023-10-02 * \u0026#92;\u0026quot;Expenses October 2023\u0026#92;\u0026quot;\u0026#92;n  Assets:Bank-A  -1000 TUG\u0026#92;n  Expenses:Misc   1000 TUG\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Multi-commodity ledger\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "e41a15b6c18152493668844d7b2fc446", "console": [], "id": "tFmS", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ENote that, following accepted accounting practices, \u003Cstrong\u003EAssets\u003C/strong\u003E and \u003Cstrong\u003ELiabilities\u003C/strong\u003E are translated into the reporting currency using the exchange rate in effect on the date of the \u003Cstrong\u003ENet Worth report\u003C/strong\u003E. For instance, to determine the current value of your bitcoins, you need to know only your current bitcoin holdings and the current bitcoin price, not the various exchange rates at which you bought them in the past.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ESo, broken down by accounts the Net-Worth-like report for Y2023 could look like this (for illustration purpose let us also add a column in the original currency):\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e2275b2d4862ca57fddf35db8b61fad7", "console": [], "id": "irEq", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='irEq-0' random-id='90aa608b-3ac7-0a40-316b-490e8d4f2113'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT \u0026#92;n      root(account,1) as account_short, convert(sum(position), \u0026#92;\u0026quot;USD\u0026#92;\u0026quot;, 2023-12-13) as value_conv, sum(position) as value_orig\u0026#92;nWHERE \u0026#92;n       date \u0026lt;= 2023-12-31 AND account ~ \u0026#x27;Assets|Liabilities\u0026#x27;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Multi commodity Net Worth query\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "ea3954cd93f74d95aa1b7e419095c528", "console": [], "id": "NzAz", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003Eaccount_short  value_conv  value_orig\n-------------  ----------  ----------\nAssets         750.00 USD  3000 TUG  \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "7c087865c289ce6c26939f74b06e3980", "console": [], "id": "qbXA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EFor P\u0026amp;L-like report, in line with accepted accounting practices  \u003Cstrong\u003EIncome\u003C/strong\u003E, \u003Cstrong\u003EExpenses\u003C/strong\u003E, and \u003Cstrong\u003ELiabilities\u003C/strong\u003E are translated into the reporting currency using the exchange rate in effect on the transaction date (in contrast to the Net Worth report, which uses the exchange rate on the report date).\nThus, for example, if you purchased an item for 60 Turkish lira while on vacation in Turkey when 60 lira equaled 2 USD, it will remain 2 USD in the P\u0026amp;L report, regardless of subsequent exchange rate fluctuations.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ESo, a P\u0026amp;L-like report could look like this (for illustrative purposes let us also add a column in the original currency):\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "8eb9d62b5ec061a93c98c65fb10ededf", "console": [], "id": "Ylsc", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "b6e0a87a11f203477e9df65e03be0993", "console": [], "id": "zTIy", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "5b6ab9ee2b0fd72897627889c17e5358", "console": [], "id": "BSwT", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "9db314460181dfd2718f87d08f88f1c1", "console": [], "id": "LNtu", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='Ylsc-0' random-id='90946314-8fb7-d137-bc7f-5d009820bce2'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT \u0026#92;n      root(account,1) as account_short, \u0026#92;n      sum(convert(position, \u0026#92;\u0026quot;USD\u0026#92;\u0026quot;, date)) as value_conv, \u0026#92;n      sum(position) as value_orig\u0026#92;nWHERE \u0026#92;n       date \u0026lt;= 2023-12-31 \u0026#92;n       AND date \u0026gt;= 2023-01-01 \u0026#92;n       AND account ~ \u0026#x27;Income|Expenses\u0026#x27;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Multi commodity P\u0026amp;amp;L query by account\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003Eaccount_short   value_conv   value_orig\n-------------  ------------  ----------\nIncome         -3500.00 USD  -6000 TUG \nExpenses        1750.00 USD   3000 TUG \n\u003C/pre\u003E\u003C/div\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='zTIy-0' random-id='5d59b983-e22d-c453-d9fa-37719550495b'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT \u0026#92;n       sum(convert(position, \u0026#92;\u0026quot;USD\u0026#92;\u0026quot;, date)) as value_conv, \u0026#92;n       sum(position) as value_orig\u0026#92;nWHERE \u0026#92;n       date \u0026lt;= 2023-12-31 \u0026#92;n       AND date \u0026gt;= 2023-01-01 \u0026#92;n       AND account ~ \u0026#x27;Income|Expenses\u0026#x27;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Multi commodity P\u0026amp;amp;L query total\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E value_conv   value_orig\n------------  ----------\n-1750.00 USD  -3000 TUG \n\u003C/pre\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "ccfebdbb3301d1393577d4151500ff3a", "console": [], "id": "DkCd", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EObserve, that in this case the P\u0026amp;L report (1750 USD) does not explain the change in Net Worth in Y2023 (0 USD =\u0026gt; 750 USD). However the P\u0026amp;L in TUG (3000 TUG) does explain the change in Net Worth (3000 TUG).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis is expected and is happening, because the value of TUG was constantly dropping throughout the year against USD.\nTo be able to do the Net Worth reconciliation in the reporting currency (USD in this case) one has to take into account unrealized gains/losses due to exchange rate changes (e.g. using the \u003Ca href=\"https://github.com/Ev2geny/evbeantools/blob/main/docs/sing_curr_conv.md\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Esing_curr_conv\u003C/a\u003E tool).\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "fc1f5b17a0707726515bf2733a35c238", "console": [], "id": "ANoZ", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"20-appendixes\"\u003E20 Appendixes\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e08ead5346e040fed6fdf5fa78fdba10", "console": [], "id": "JgYu", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"201-appendix-a-shell-variables\"\u003E20.1 Appendix A: Shell variables\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7253eecc2c8753c5daaf77ae3fa0ccbc", "console": [], "id": "PrWN", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe interactive shell has a few \u201cset\u201d variables that you can customize to change some of the behavior of the shell. These are like environment variables. Type the \u003Ccode\u003E.set\u003C/code\u003E command to see the list of available variables and their current values.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe variables are:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003Eboxed (boolean): Whether we should draw a box around the output table.\u003C/li\u003E\n\u003Cli\u003Eexpand (boolean): If true, expand columns that render to lists on multiple rows.\u003C/li\u003E\n\u003Cli\u003Eformat (string): The output format. Supported formats: \u201ctext\u201d, \"csv\".\u003C/li\u003E\n\u003Cli\u003Enarrow (boolean): Whether the column header names are truncated to fit within the display width.\u003C/li\u003E\n\u003Cli\u003Enullvalue: '' ?? what does it do?\u003C/li\u003E\n\u003Cli\u003Enumberify: (boolean): If set to \u003Ccode\u003Etrue\u003C/code\u003E splits columns that contain monetary types (Amount, Position, Inventory) into separate plain-number columns \u2014 one per currency found in that column.\u003C/li\u003E\n\u003Cli\u003Epager (string): The name of the pager program to pipe multi-page output to when the output is larger than the screen. The initial value is copied from the PAGER environment variable.\u003C/li\u003E\n\u003Cli\u003Espaced (boolean): Whether to insert an empty line between every result row. This is only relevant because postings with multiple lots may require multiple lines to be rendered, and inserting an empty line helps delineate those as separate.\u003C/li\u003E\n\u003Cli\u003Eunicode: (boolean): ?? what does it do?\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ETo change a variable from its default value, type \u003Ccode\u003E.set \u0026lt;variable-name\u0026gt; \u0026lt;new-value\u0026gt;\u003C/code\u003E. E.g.:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ccode\u003E.set numberify true\u003C/code\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "0b2917135ba21f37e98108ba5120d196", "console": [], "id": "kAAc", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"202-appendix-b-display-precision\"\u003E20.2 Appendix B: Display precision\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us discuss the subject of a display precision. Beanquery does not assume a fixed number of decimal digits for a currency. Instead, the display precision is \u003Cstrong\u003Einferred from the ledger\u003C/strong\u003E: while parsing, beancount looks at every amount and, for each currency, records how many fractional digits it was written with. The precision then used to display that currency is the \u003Cstrong\u003Emost frequently occurring\u003C/strong\u003E number of fractional digits seen for it (the statistical mode).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis inferred precision is applied uniformly to \u003Cem\u003Eall\u003C/em\u003E amounts of that currency, including values that are computed by a query (for example with \u003Ccode\u003Esum()\u003C/code\u003E), which are rounded to that precision before being shown.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe example below uses an artificial currency \u003Ccode\u003EFOO\u003C/code\u003E to make this easy to observe. In \u003Cstrong\u003ELedger1\u003C/strong\u003E, the \u003Ccode\u003EFOO\u003C/code\u003E amounts are written with 0, 1, 2 and 2 fractional digits, so two digits is the most common case and \u003Ccode\u003EFOO\u003C/code\u003E is displayed with two decimals:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "cdc1df05a6275fd892cdd36d87ae24d2", "console": [], "id": "hryx", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='hryx-0' random-id='29df9f53-adc7-ae81-2278-19bdeb867df6'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Assets:Bank\u0026#92;n2023-01-01 open Expenses:Misc\u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;No decimal digits transaction 1\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    1 FOO\u0026#92;n  Assets:Bank     \u0026#92;n\u0026#92;n2023-01-02 * \u0026#92;\u0026quot;One decimal digit transaction 1\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    10.1 FOO\u0026#92;n  Assets:Bank     \u0026#92;n\u0026#92;n2023-01-03 * \u0026#92;\u0026quot;Two decimal digits transaction 1\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    100.11 FOO\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2023-01-04 * \u0026#92;\u0026quot;Two decimal digits transaction 2\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    200.11 FOO\u0026#92;n  Assets:Bank  \u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger1. Two  decimal digits is the most frequent case\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "6ab5d12f72f89a4e66e094c372310765", "console": [], "id": "FArF", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ELet us check the not aggregate query\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "4f778132a2510d6695bfa0979df09808", "console": [], "id": "iZMp", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='iZMp-0' random-id='32a9878f-d096-b920-d625-b63eed53736d'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date, account, narration, position\u0026#92;nWHERE account = \u0026#x27;Expenses:Misc\u0026#x27;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Not an aggregate query\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "f51750d3053c791440e00519fee51d8c", "console": [], "id": "rRBK", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date        account                narration               position \n----------  -------------  --------------------------------  ----------\n2023-01-01  Expenses:Misc  No decimal digits transaction 1     1.00 FOO\n2023-01-02  Expenses:Misc  One decimal digit transaction 1    10.10 FOO\n2023-01-03  Expenses:Misc  Two decimal digits transaction 1  100.11 FOO\n2023-01-04  Expenses:Misc  Two decimal digits transaction 2  200.11 FOO\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "2b0b8eab374f5daf9589a89c8b15e0f1", "console": [], "id": "pQtJ", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EObserve that amounts are displayed not with the original precision, but with the one inferred from the ledger (2 decimal digits in this case).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELet is now test an aggregate query on the same ledger.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "deffc1e9c40429d16b702dc5764c8faa", "console": [], "id": "YEPL", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='YEPL-0' random-id='adf441e3-a0b3-fbca-5409-99a34a360cb8'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT sum(position) as total_expenses\u0026#92;nWHERE account = \u0026#x27;Expenses:Misc\u0026#x27;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Aggregate query to test precision of amounts\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "e59ec634bc91b42d48af8ce2f95d7db4", "console": [], "id": "JbyY", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003Etotal_expenses\n--------------\n311.32 FOO    \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "41f69d1f5ad34d8a5880045c1996da9d", "console": [], "id": "OOEL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe aggregated total above (\u003Ccode\u003E311.32 FOO\u003C/code\u003E) keeps two decimals, consistent with the inferred precision for \u003Ccode\u003EFOO\u003C/code\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ENow compare this with \u003Cstrong\u003ELedger2\u003C/strong\u003E below. It contains the same four transactions plus two extra \u003Ccode\u003EFOO\u003C/code\u003E amounts written with no decimal digits (\u003Ccode\u003E1000\u003C/code\u003E and \u003Ccode\u003E2000\u003C/code\u003E). This makes \u003Cem\u003Ezero\u003C/em\u003E fractional digits the most common case for \u003Ccode\u003EFOO\u003C/code\u003E, so the inferred precision becomes 0 and the same aggregate query now rounds the total to whole units:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a6f71188060c76ca649b820f9823945f", "console": [], "id": "EiGG", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='EiGG-0' random-id='d7438071-cad5-9ea7-4a00-d3ef43ec1ed3'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Assets:Bank\u0026#92;n2023-01-01 open Expenses:Misc\u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;No decimal digits transaction 1\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    1 FOO\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2023-01-02 * \u0026#92;\u0026quot;One decimal digit transaction 1\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    10.1 FOO\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2023-01-03 * \u0026#92;\u0026quot;Two decimal digits transaction 1\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    100.11 FOO\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2023-01-04 * \u0026#92;\u0026quot;Two decimal digits transaction 2\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    200.11 FOO\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2023-01-05 * \u0026#92;\u0026quot;No decimal digits transaction 2\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    1000 FOO\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2023-01-06 * \u0026#92;\u0026quot;No decimal digits transaction 3\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    2000 FOO\u0026#92;n  Assets:Bank\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger2. No  decimal digits is the most frequent case\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "8334e6e3506d0142db458b0ce98ad509", "console": [], "id": "RhJb", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003Etotal_expenses\n--------------\n3311 FOO      \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "82102681046e56cbfed99b7f38bb9e06", "console": [], "id": "Xfaq", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EIf the inferred precision is not what you want, you can pin it explicitly per currency with the \u003Ccode\u003Edisplay_precision\u003C/code\u003E option in the ledger. For example, adding\u003C/span\u003E\n\u003Cdiv class=\"language-scdoc codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Eoption \u0026quot;display_precision\u0026quot; \u0026quot;FOO:0.01\u0026quot;\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003Eforces \u003Ccode\u003EFOO\u003C/code\u003E to always render with two decimal digits, regardless of how the amounts are written in the ledger.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ELedger3\u003C/strong\u003E below is identical to Ledger2 (zero decimals is the most common case for \u003Ccode\u003EFOO\u003C/code\u003E), but with this option added at the top. Running the same aggregate query now shows the total with two decimals, overriding the inferred precision:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "4d32d4b088e319205ddbff40edf90c1f", "console": [], "id": "hJvO", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='hJvO-0' random-id='1f2bcde6-ae76-f183-0afa-8f8804ac403c'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;option \u0026#92;\u0026quot;display_precision\u0026#92;\u0026quot; \u0026#92;\u0026quot;FOO:0.01\u0026#92;\u0026quot;\u0026#92;n\u0026#92;n2023-01-01 open Assets:Bank\u0026#92;n2023-01-01 open Expenses:Misc\u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;No decimal digits transaction 1\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    1 FOO\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2023-01-02 * \u0026#92;\u0026quot;One decimal digit transaction 1\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    10.1 FOO\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2023-01-03 * \u0026#92;\u0026quot;Two decimal digits transaction 1\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    100.11 FOO\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2023-01-04 * \u0026#92;\u0026quot;Two decimal digits transaction 2\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    200.11 FOO\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2023-01-05 * \u0026#92;\u0026quot;No decimal digits transaction 2\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    1000 FOO\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2023-01-06 * \u0026#92;\u0026quot;No decimal digits transaction 3\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    2000 FOO\u0026#92;n  Assets:Bank\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger3. Like Ledger2, but with display_precision pinned to two digits for FOO\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "123a17e2b5cce397746c5f3ad056f5c3", "console": [], "id": "VTMd", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003Etotal_expenses\n--------------\n3311.32 FOO   \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "282ed32ced660e4176620038ee1c188a", "console": [], "id": "hkqI", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"203-appendix-c-named-queries-the-query-directive-and-run\"\u003E20.3 Appendix C: Named queries (the \u003Ccode\u003Equery\u003C/code\u003E directive and \u003Ccode\u003E.run\u003C/code\u003E)\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "134bb5fd085f37fab997c618e3a19ea9", "console": [], "id": "BqjV", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EQueries that you run regularly do not have to be retyped every time. You can store them \u003Cstrong\u003Einside your Beancount ledger file\u003C/strong\u003E with the \u003Ccode\u003Equery\u003C/code\u003E directive and then execute them by name from the beanquery shell with the \u003Ccode\u003E.run\u003C/code\u003E command. Because the queries live in the ledger, they sit next to the data they describe and are version-controlled together with the rest of the file.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EA \u003Ccode\u003Equery\u003C/code\u003E directive has three parts:\u003C/span\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003EYYYY-MM-DD query \u0026quot;name\u0026quot; \u0026quot;\n  \u0026lt;query string\u0026gt;\n\u0026quot;\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cul\u003E\n\u003Cli\u003Ea \u003Cstrong\u003Edate\u003C/strong\u003E (its role is explained in section 20.3.2 below),\u003C/li\u003E\n\u003Cli\u003Ea \u003Cstrong\u003Ename\u003C/strong\u003E \u2014 a quoted string by which the query is invoked, and\u003C/li\u003E\n\u003Cli\u003Ethe \u003Cstrong\u003Equery string\u003C/strong\u003E itself \u2014 a quoted string, which may span several lines.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EFor example:\u003C/span\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E2024-01-01 query \u0026quot;expenses-2023\u0026quot; \u0026quot;\n  SELECT account, sum(position) AS total\n  FROM year \u0026gt;= 2000\n  WHERE account ~ \u0026#39;Expenses\u0026#39;\n  GROUP BY account\n  ORDER BY account\n\u0026quot;\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "3aa36c1b004b26729145d588cde513d1", "console": [], "id": "rsOL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"2031-running-named-queries-with-run\"\u003E20.3.1 Running named queries with \u003Ccode\u003E.run\u003C/code\u003E\u003C/h4\u003E\n\u003Cspan class=\"paragraph\"\u003EInside the shell, the \u003Ccode\u003E.run\u003C/code\u003E command executes the queries stored in the file:\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003ECommand\u003C/th\u003E\n\u003Cth\u003EEffect\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E.run \u0026lt;name\u0026gt;\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003ERun the named query.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E.run\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EList the names of all available named queries.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E.run *\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003ERun \u003Cstrong\u003Eall\u003C/strong\u003E named queries in turn (each preceded by its name).\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003EThe query name supports \u003Cstrong\u003Etab completion\u003C/strong\u003E, so typing \u003Ccode\u003E.run exp\u003C/code\u003E and pressing \u003Ccode\u003ETab\u003C/code\u003E completes it to \u003Ccode\u003Eexpenses-2023\u003C/code\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EA short shell session with the directive shown above looks like this:\u003C/span\u003E\n\u003Cdiv class=\"language-shell codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Ebeanquery\u0026gt;\u003Cspan class=\"w\"\u003E \u003C/span\u003E.run\nexpenses-2023\n\nbeanquery\u0026gt;\u003Cspan class=\"w\"\u003E \u003C/span\u003E.run\u003Cspan class=\"w\"\u003E \u003C/span\u003Eexpenses-2023\n\u003Cspan class=\"w\"\u003E     \u003C/span\u003Eaccount\u003Cspan class=\"w\"\u003E        \u003C/span\u003Etotal\n------------------\u003Cspan class=\"w\"\u003E  \u003C/span\u003E------\nExpenses:Food\u003Cspan class=\"w\"\u003E       \u003C/span\u003E\u003Cspan class=\"m\"\u003E40\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003EUSD\nExpenses:Transport\u003Cspan class=\"w\"\u003E  \u003C/span\u003E\u003Cspan class=\"m\"\u003E30\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003EUSD\n\nbeanquery\u0026gt;\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "2eb5bf933fd70d04be4d3654aa1db678", "console": [], "id": "HKFj", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"2032-the-directive-date-is-the-default-close-date\"\u003E20.3.2 The directive date is the default CLOSE date\u003C/h4\u003E\n\u003Cspan class=\"paragraph\"\u003EThe date of a \u003Ccode\u003Equery\u003C/code\u003E directive is not just documentation. When the stored query has a \u003Ccode\u003EFROM\u003C/code\u003E clause \u003Cstrong\u003Ebut does not specify its own \u003Ccode\u003ECLOSE\u003C/code\u003E\u003C/strong\u003E (see \u003Ca href=\"#152-closing-a-period-close-on-clause\"\u003Esection 15.2\u003C/a\u003E), running it with \u003Ccode\u003E.run\u003C/code\u003E uses the directive's date as the default \u003Cstrong\u003ECLOSE date\u003C/strong\u003E. This makes the directive date a natural \"as of\" date for the report \u2014 a query dated \u003Ccode\u003E2024-01-01\u003C/code\u003E reports the state of the books at the end of 2023.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETwo details are worth keeping in mind:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EAs everywhere in Beancount, the closing date is \u003Cstrong\u003Eexclusive\u003C/strong\u003E, so the date \u003Ccode\u003E2024-01-01\u003C/code\u003E includes everything up to and including 2023-12-31.\u003C/li\u003E\n\u003Cli\u003EThe default close date is applied \u003Cstrong\u003Eonly when the query contains a \u003Ccode\u003EFROM\u003C/code\u003E clause\u003C/strong\u003E. A query written without \u003Ccode\u003EFROM\u003C/code\u003E (for example \u003Ccode\u003ESELECT \u2026 WHERE \u2026 GROUP BY \u2026\u003C/code\u003E) ignores the directive date and considers the whole ledger.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EThe notebook below cannot reach into the interactive shell, so it cannot run \u003Ccode\u003E.run\u003C/code\u003E directly. Instead it demonstrates the behaviour by spelling out the query that \u003Ccode\u003E.run expenses-2023\u003C/code\u003E executes \u2014 the same \u003Ccode\u003ESELECT\u003C/code\u003E, with \u003Ccode\u003ECLOSE ON 2024-01-01\u003C/code\u003E (the directive's date) added explicitly.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "ce7aa558825d1690bfdf98a585fcd73c", "console": [], "id": "mDlY", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='mDlY-0' random-id='06596262-e1fa-fc87-289d-403474e7a1c1'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Assets:Bank\u0026#92;n2023-01-01 open Expenses:Food\u0026#92;n2023-01-01 open Expenses:Transport\u0026#92;n\u0026#92;n2023-06-15 * \u0026#92;\u0026quot;Groceries\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food       40 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2023-09-20 * \u0026#92;\u0026quot;Bus pass\u0026#92;\u0026quot;\u0026#92;n  Expenses:Transport  30 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-03-10 * \u0026#92;\u0026quot;Groceries\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food       55 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-01-01 query \u0026#92;\u0026quot;expenses-2023\u0026#92;\u0026quot; \u0026#92;\u0026quot;\u0026#92;n  SELECT account, sum(position) AS total\u0026#92;n  FROM year \u0026gt;= 2000\u0026#92;n  WHERE account ~ \u0026#x27;Expenses\u0026#x27;\u0026#92;n  GROUP BY account\u0026#92;n  ORDER BY account\u0026#92;n\u0026#92;\u0026quot;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger with a stored query directive\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "96a13356dde1bb73750779e14c19175d", "console": [], "id": "ppkK", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe query below is exactly what \u003Ccode\u003E.run expenses-2023\u003C/code\u003E executes: the stored \u003Ccode\u003ESELECT\u003C/code\u003E with the directive's date supplied as \u003Ccode\u003ECLOSE ON 2024-01-01\u003C/code\u003E. The 2024 grocery posting is excluded, so \u003Ccode\u003EExpenses:Food\u003C/code\u003E shows only the 40 USD spent in 2023:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "69b6c7e952be4efbc8a890dc66db41e6", "console": [], "id": "qsWP", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "d0e382838247941d762c1d01a38c6622", "console": [], "id": "ogJt", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='qsWP-0' random-id='6d0ca7d0-8ece-e22e-428d-1451fcce7075'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT account, sum(position) AS total\u0026#92;nFROM year \u0026gt;= 2000 CLOSE ON 2024-01-01\u0026#92;nWHERE account ~ \u0026#x27;Expenses\u0026#x27;\u0026#92;nGROUP BY account\u0026#92;nORDER BY account\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;What \u0026#x27;.run expenses-2023\u0026#x27; executes (CLOSE from the directive date)\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E     account        total \n------------------  ------\nExpenses:Food       40 USD\nExpenses:Transport  30 USD\n\u003C/pre\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "55366750b6b6465c73815417bf52816b", "console": [], "id": "YQXP", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EFor contrast, the same \u003Ccode\u003ESELECT\u003C/code\u003E run \u003Cstrong\u003Ewithout\u003C/strong\u003E the implied \u003Ccode\u003ECLOSE\u003C/code\u003E \u2014 for example by typing it directly at the prompt instead of through \u003Ccode\u003E.run\u003C/code\u003E \u2014 considers the whole ledger, so \u003Ccode\u003EExpenses:Food\u003C/code\u003E adds up the 2024 grocery posting as well and reaches 95 USD:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "dd894a4b59adee41ed7e24694154ea72", "console": [], "id": "poLs", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "f72b0616857a1a5382b24111e0ad832a", "console": [], "id": "xnyk", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='poLs-0' random-id='2947ce73-4e6a-6033-00ff-f63551aa420d'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT account, sum(position) AS total\u0026#92;nWHERE year \u0026gt;= 2000 AND account ~ \u0026#x27;Expenses\u0026#x27;\u0026#92;nGROUP BY account\u0026#92;nORDER BY account\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;The same query without the directive\u0026#x27;s CLOSE date\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E     account        total \n------------------  ------\nExpenses:Food       95 USD\nExpenses:Transport  30 USD\n\u003C/pre\u003E\u003C/div\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.23.6", "script_metadata_hash": null}, "version": "1"},
