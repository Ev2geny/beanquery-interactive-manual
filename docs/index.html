      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "63a250319d4538b0b1d8c359921024da", "console": [], "id": "Hbol", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://github.com/Ev2geny/beanquery_interactive_manual\" target=\"_blank\"\u003E\n  \u003Cimg src=\"https://img.shields.io/badge/GitHub-Ev2geny%2Fbeanquery__interactive__manual-blue?logo=github\" alt=\"GitHub repository\"/\u003E\n\u003C/a\u003E\u003C/span\u003E\n\u003Ch1 id=\"interactive-beanquery-manual\"\u003EInteractive beanquery manual\u003C/h1\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "be6806bb86d181fe87d250ba4370a04c", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "a52659a2d1d455c9c565a6d4e88ae930", "console": [], "id": "vblA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EVersion: 0.3.0\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7c56d06bb785d6ac4780f2715ec7ec62", "console": [], "id": "bkHC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "3d7c9241fe95f2c05ae5b65e3daeb81f", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "ce71ba32d5a54119e5e2ba4a9a340f8f", "console": [], "id": "PKri", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "c0ed0bb0664486f2c6170b65f81be59f", "console": [], "id": "Xref", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "6bc419e84de49a98ec69812eda9b60ed", "console": [], "id": "SFPL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"1-introduction-to-this-document\"\u003E1 Introduction to this document\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "316b3470287f34fa2127b8bb6c8fb167", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"11-purpose-and-scope\"\u003E1.1 Purpose and scope\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "dddda6bb5b1fa027a617a6a7dd474c8b", "console": [], "id": "RGSE", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThis is an interactive manual and tutorial for \u003Ca href=\"https://github.com/beancount/beanquery\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Ebeanquery\u003C/a\u003E \u2014 a customizable, extensible, lightweight SQL query tool for \u003Ca href=\"https://github.com/beancount/beancount/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EBeancount\u003C/a\u003E ledger data.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis document is intended as a follow-up to the Beancount v2 \u003Ca href=\"https://docs.google.com/document/d/1s0GOZMcrKKCLlP29MD7kHO4L88evrwWdIO0p4EwRBE0/edit?usp=sharing\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EBeancount Query Language\u003C/a\u003E document.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIt was created with the following goals in mind:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003Eto cover the latest features of beanquery\u003C/li\u003E\n\u003Cli\u003Eto include many real examples using actual ledgers\u003C/li\u003E\n\u003Cli\u003Eto be self-documenting: all query outputs are computed by running beanquery as part of the notebook execution\u003C/li\u003E\n\u003Cli\u003Eto be interactive: when run as a \u003Ca href=\"https://marimo.io/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Emarimo\u003C/a\u003E notebook, readers can experiment by changing the default ledgers and/or queries, with outputs updating automatically\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ENote, that during production of the manual the \u003Cstrong\u003Ebeanquery\u003C/strong\u003E version was used, which was ahead of the latest released version, hence the manual include demonstation of some features, which will may not work on the latest released version. Specifically the following beanquery commit was used: \u003Ca href=\"https://github.com/beancount/beanquery/commit/62b6abba7f560e2d5e1dce231b55571b84fdf31f\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\u003Ccode\u003E62b6abb\u003C/code\u003E\u003C/a\u003E (version 0.3.0.dev0).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ECurrent state\u003C/strong\u003E: work is ongoing, PRs are welcome!\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "aa9b67df3eaf23e95608611c021a1add", "console": [], "id": "Kclp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"12-how-to-use-this-manual\"\u003E1.2 How to use this manual\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "0a7ff2b91971a3aeb48c2ac7dcb24039", "console": [], "id": "emfo", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThis document assumes no prior knowledge of SQL and is structured as much as practically possible as a tutorial, where each chapter builds on the material covered in the previous ones. As a result, the material is more spread throughout the document than it would be if it were written for an SQL-familiar reader. For example, the available tables are introduced in one chapter, and more detailed information about some of them is added in several later chapters.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis document is written as a \u003Ca href=\"https://docs.marimo.io/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Emarimo\u003C/a\u003E notebook. You can read it as a normal HTML document.\nHowever, the cool feature of this notebook is that if you run it as a marimo notebook, you can interact with the document by changing the default text for both the ledger and the query in all examples. As soon as an input widget loses focus, the query is re-executed and the output is updated.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EBoth in HTML format and in the marimo notebook format, a clickable table of contents is available when hovering near the right side of the browser's vertical scroll bar.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "82d6bb86624e271c9d70bbe2b4db40ce", "console": [], "id": "Hstk", "outputs": [{"data": {"text/html": "\u003Cimg src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAz4AAAJoCAYAAACnazSGAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAO3JSURBVHhe7P19lFXHfecL3/+TDC9SHgFSyPPHo9y1RCOvCRFI5j6igSzNIsuzpPAik+tnSZFokAK0PHlMg67HyiiXjBNFylh005IjWbTamdiy7qOBIKD74HajZgRj3BYzsiQuoQU0NIpxjzsGESRoDvyeVW97V/2q9t5nd59z+vTh+1nZK+xdtatq1zkl16d/tev8LwQAAAAAAAAAdc7/wi8AAAAAAAAAQL0B8QEAAAAAAADUPRAfAAAAAAAAQN0D8QEAAAAAAADUPRAfAAAAAAAAQN0D8QEAAAAAAADUPRAfAAAAAAAAQN0D8QEAAAAAAADUPRAfAAAAAAAAwKTixo0bJR02EB8AAAAAAADApEDIzPXr16lYLMrj2rVrqYcNxAcAAAAAAABQ8wjhETLzs5/9jPbu3Ut///d/T3/3d3+XethAfAAAAAAAAAA1jZCef/7nf6a9e/fRgXcO0snBIfrVp5/RxctXUw8biA8AAAAAAACgZhHL20SkR0jPT//7+3ThX654gpN02EB8AAAAAAAAADWLiPaI5W3vvHOQLlz63JObtMMG4gMAAAAAAACoSUS0R2xisG/fPrm8LU+0B+IDAAAAAAAAmBQY8XnjjTdo5OJlT2yyDhuIDwAAAAAAAKAmMe/3fO9736Nf5VzmBvEBAAAAAAAATAogPgAAAAAAAIC6B+IDAAAAAAAAqHsgPgAAAAAAAIC6B+IDAAAAAAAAqHsgPgAAAAAAAIC6J4/4/Hz4V3Tv/Q/SvPv+gIb+6X9CfAAAAAAAAACTgzzi0/8/jtGtd3yBptx2Fx366c/kj53aQHwAAAAAAAAANUke8RHHzj0/ord2/zDKawPxAQAAAAAAANQkecWHHzYQHwAAAAAAAEBNAvEBAAAAAAAA1D0QHwAAAAAAAEDdA/EBAAAAAAAA1D0QHwAAAAAAAEDdY8Tn+9//Po1cvOyJTdZhA/EBAAAAAAAA1CRCfIrFIu3du5dODg7J3+bhcpN22EB8AAAAAAAAADXL9evX6f3336cDfQfpwr/kW+5mA/EBAAAAAAAA1CxCfEZHR2nPnr300//+fq6ojw3EBwAAAAAAAFDTiOVuv/zlL+WStwPv9Mllb7/69DNP BB8AAAAA8x7BBwAAAMC8R/ABAAAAMO8RfAAAAADMe/8fC1WtSzEpU1cAAAAASUVORK5CYII=\" style=\"width: 40%\" /\u003E"}, "type": "data"}]}, {"code_hash": "2c4190d6c289bb198f1c7e715d9ce1d6", "console": [], "id": "nWHF", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThroughout the document, the following conventions were used to indicate special elements:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EUnresolved questions the author had about beanquery functionality are marked with double question marks.\u003Cbr\u003E\n   E.g.: ?? Why do we need this.\u003C/li\u003E\n\u003Cli\u003ESome TODOs, marked with #TODO. E.g.:\u003Cbr\u003E\n\u003Cem\u003E#TODO: we need to investigate this\u003C/em\u003E\u003C/li\u003E\n\u003Cli\u003Ebeanquery issues are marked as \u003Cstrong\u003Ebql_iss_\\\u003Cnumber\u003E\u003C/strong\u003E\u003C/li\u003E\n\u003Cli\u003Ebeanquery Pull Requests are marked as \u003Cstrong\u003Ebql_pr_\\\u003Cnumber\u003E\u003C/strong\u003E\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "ca9995bf2cf89385344899bd95f7408f", "console": [], "id": "iLit", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"2-introduction-to-beanquery\"\u003E2 Introduction to beanquery\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "2a999bbbc0283eeafcc2c4a473df0b0d", "console": [], "id": "ZHCJ", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EBeanquery parses a Beancount ledger and creates an in-memory database represented as several tables. Beanquery then exposes a command-line tool that acts as a client to that in-memory database, where you can type queries in a variant of SQL.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EBeanquery started as an experiment in Beancount v2, but in v3 (when \u003Cstrong\u003Ebean-report\u003C/strong\u003E and \u003Cstrong\u003Ebean-web\u003C/strong\u003E were discontinued) it became practically the only tool for querying information from a Beancount ledger. Thus, one can say that in v3 Beancount has moved toward the \u003Ca href=\"https://www.techtarget.com/searchbusinessanalytics/definition/self-service-business-intelligence-BI\" rel=\"noopener noreferrer\" target=\"_blank\"\u003ESelf-service business intelligence\u003C/a\u003E model, instead of providing off-the-shelf ready-to-use reports.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ESo one might ask: why create another SQL client? Why not output the data to an SQLite database and let the user use any SQL client? Apparently this experiment was conducted by creating \u003Ca href=\"https://github.com/beancount/beancount/blob/v2/beancount/scripts/sql.py\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Ebean-sql\u003C/a\u003E. It turned out that writing queries was painful and carrying out operations on lots held at cost was difficult.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETherefore, beanquery has some extras that are essential for querying a Beancount ledger. These extras include (but are not necessarily limited to) the following:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EThe client supports the semantics of inventory booking implemented in Beancount. It also supports aggregation functions on inventory objects and rendering functions (e.g., COST() to render the cost of an inventory instead of its contents).\u003C/li\u003E\n\u003Cli\u003EThe client supports some functions that run on postings but in the background also access other tables (e.g. the CONVERT() function, which formally operates on amounts, positions, or inventories, but in the background also uses the prices table).\u003C/li\u003E\n\u003Cli\u003EIt allows filtering at two levels simultaneously: you can filter whole transactions, which has the benefit of respecting the accounting equation, and then, usually for presentation purposes, you can also filter at the posting level.\u003C/li\u003E\n\u003Cli\u003EObjects in one table already have references to related objects in another table. For example, records in the postings table have a reference to their related transaction object. So one can say that these tables have already been pre-joined (even though technically this is not entirely correct).\u003C/li\u003E\n\u003Cli\u003ETransactions can be summarized in a manner useful for producing balance sheets and income statements. For example, our SQL variant explicitly supports a \u201cclose\u201d operation with an effect similar to year-end closing, which inserts transactions to clear income statement accounts to equity and removes past history.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "6b1f5f2eb7d2d6bf6b65d1a655a56a47", "console": [], "id": "ROlb", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"3-how-to-install-beanquery\"\u003E3 How to install beanquery\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f8bb4edc18e17d11d682d7b63c08e4dd", "console": [], "id": "qnkX", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Ccode\u003Epip install beanquery\u003C/code\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a472f877de9c9b66476ebd52cd74b3f8", "console": [], "id": "TqIu", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"4-how-to-run-beanquery-cli\"\u003E4 How to run beanquery CLI\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b4baa6bc22d1b2f1ff3191220c593d6f", "console": [], "id": "Vxnm", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ETo run beanquery, type:\u003C/span\u003E\n\u003Cdiv class=\"language-shell codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Ebean-query\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E[\u003C/span\u003EOPTIONS\u003Cspan class=\"o\"\u003E]\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003EFILENAME\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E[\u003C/span\u003EQUERY\u003Cspan class=\"o\"\u003E]\u003C/span\u003E...\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003EThis launches the query tool in interactive mode, where you can enter multiple commands on the dataset loaded in memory. Beanquery parses the input file, prints a few basic statistics about your ledger, and provides a command prompt for you to enter query commands.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003Ee.g.:\u003C/span\u003E\n\u003Cdiv class=\"language-shell codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Ebean-query\u003Cspan class=\"w\"\u003E  \u003C/span\u003Etest.bean\nInput\u003Cspan class=\"w\"\u003E \u003C/span\u003Efile:\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"s2\"\u003E\u0026quot;Beancount\u0026quot;\u003C/span\u003E\nReady\u003Cspan class=\"w\"\u003E \u003C/span\u003Ewith\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"m\"\u003E3\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003Edirectives\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003E\u003Cspan class=\"m\"\u003E2\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003Epostings\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003Ein\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"m\"\u003E1\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003Etransactions,\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"m\"\u003E0\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003Evalidation\u003Cspan class=\"w\"\u003E \u003C/span\u003Eerrors\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\nbeanquery\u0026gt;\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003EIf your ledger contains any errors, they are printed before the prompt.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EE.g.:\u003C/span\u003E\n\u003Cdiv class=\"language-shell codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003EPS\u003Cspan class=\"w\"\u003E \u003C/span\u003EC:\u003Cspan class=\"se\"\u003E\\_\u003C/span\u003Ecode\u003Cspan class=\"se\"\u003E\\b\u003C/span\u003Eean\u0026gt;\u003Cspan class=\"w\"\u003E \u003C/span\u003Ebean-query\u003Cspan class=\"w\"\u003E \u003C/span\u003Etest.bean\nC:\u003Cspan class=\"se\"\u003E\\_\u003C/span\u003Ecode\u003Cspan class=\"se\"\u003E\\b\u003C/span\u003Eean\u003Cspan class=\"se\"\u003E\\t\u003C/span\u003Eest.bean:7:\u003Cspan class=\"w\"\u003E \u003C/span\u003Esyntax\u003Cspan class=\"w\"\u003E \u003C/span\u003Eerror,\u003Cspan class=\"w\"\u003E \u003C/span\u003Eunexpected\u003Cspan class=\"w\"\u003E \u003C/span\u003EACCOUNT\n\nInput\u003Cspan class=\"w\"\u003E \u003C/span\u003Efile:\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"s2\"\u003E\u0026quot;Beancount\u0026quot;\u003C/span\u003E\nReady\u003Cspan class=\"w\"\u003E \u003C/span\u003Ewith\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"m\"\u003E8\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003Edirectives\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003E\u003Cspan class=\"m\"\u003E6\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003Epostings\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003Ein\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"m\"\u003E4\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003Etransactions,\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"m\"\u003E1\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003Evalidation\u003Cspan class=\"w\"\u003E \u003C/span\u003Eerrors\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\nbeanquery\u0026gt;\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003EYou can also start beanquery as a Python module:\u003C/span\u003E\n\u003Cdiv class=\"language-shell codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Epython\u003Cspan class=\"w\"\u003E \u003C/span\u003E-m\u003Cspan class=\"w\"\u003E \u003C/span\u003Ebeanquery\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E[\u003C/span\u003EOPTIONS\u003Cspan class=\"o\"\u003E]\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003EFILENAME\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E[\u003C/span\u003EQUERY\u003Cspan class=\"o\"\u003E]\u003C/span\u003E...\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003EIf you\u2019d like to run queries directly from the command-line, without an interactive prompt, you can provide the query directly following your filename:\u003C/span\u003E\n\u003Cdiv class=\"language-shell codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E$\u003Cspan class=\"w\"\u003E \u003C/span\u003Ebean-query\u003Cspan class=\"w\"\u003E \u003C/span\u003Emyfile.beancount\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"s1\"\u003E\u0026#39;balances from year = 2014\u0026#39;\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E                     \u003C/span\u003Eaccount\u003Cspan class=\"w\"\u003E                       \u003C/span\u003Ebalance\n----------------------------------------------------------------------\n\u2026\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u0026lt;balances\u003Cspan class=\"w\"\u003E \u003C/span\u003Efollow\u0026gt;\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u2026\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003EAll the interactive commands are supported.\n\u003Cbr\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ERunning queries, stored in the \u003Ccode\u003EQUERY\u003C/code\u003E directive\u003C/strong\u003E\u003Cbr\u003E\nIt is also possible to run queries, stored in beancount ledger \u003Ccode\u003EQUERY\u003C/code\u003E directive.  See \u003Ca href=\"#203-appendix-c-named-queries-the-query-directive-and-run\"\u003EAppendix C\u003C/a\u003E for more details.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cbr\u003E\n\u003Cstrong\u003EShell variables\u003C/strong\u003E\n\u003Cbr\u003E\nThe interactive shell has a few \u201cset\u201d variables that you can customize to change some of the behavior of the shell. These are like environment variables. Refer to the \u003Ca href=\"#201-appendix-a-shell-variables\"\u003EAppendix A\u003C/a\u003E for more information.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ENote, that in this document for demonstration purposes the following changes are made to the default environment variables:\u003C/span\u003E\n\u003Cdiv class=\"language-jasmin codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"kr\"\u003E.set\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nv\"\u003Enarrow\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"sx\"\u003Efalse\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d842cbb18034408f54d49649133bfe6b", "console": [], "id": "DnEU", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"5-how-to-get-help\"\u003E5 How to get help\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d519c92e835ee365414c15663735357e", "console": [], "id": "ulZA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ETo get help from the built-in system, type \u003Ccode\u003E.help\u003C/code\u003E when in the beanquery client\u003C/span\u003E\n\u003Cdiv class=\"language-shell codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Ebeanquery\u0026gt;\u003Cspan class=\"w\"\u003E \u003C/span\u003E.help\n\nShell\u003Cspan class=\"w\"\u003E \u003C/span\u003Eutility\u003Cspan class=\"w\"\u003E \u003C/span\u003Ecommands\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003E\u003Cspan class=\"nb\"\u003Etype\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nb\"\u003Ehelp\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u0026lt;topic\u0026gt;\u003Cspan class=\"o\"\u003E)\u003C/span\u003E:\n\u003Cspan class=\"o\"\u003E===========================================\u003C/span\u003E\nEOF\u003Cspan class=\"w\"\u003E    \u003C/span\u003Edescribe\u003Cspan class=\"w\"\u003E  \u003C/span\u003E\u003Cspan class=\"nb\"\u003Eexit\u003C/span\u003E\u003Cspan class=\"w\"\u003E     \u003C/span\u003Eformat\u003Cspan class=\"w\"\u003E  \u003C/span\u003E\u003Cspan class=\"nb\"\u003Ehistory\u003C/span\u003E\u003Cspan class=\"w\"\u003E  \u003C/span\u003Eparse\u003Cspan class=\"w\"\u003E  \u003C/span\u003Ereload\u003Cspan class=\"w\"\u003E  \u003C/span\u003E\u003Cspan class=\"nb\"\u003Eset\u003C/span\u003E\nclear\u003Cspan class=\"w\"\u003E  \u003C/span\u003Eerrors\u003Cspan class=\"w\"\u003E    \u003C/span\u003Eexplain\u003Cspan class=\"w\"\u003E  \u003C/span\u003E\u003Cspan class=\"nb\"\u003Ehelp\u003C/span\u003E\u003Cspan class=\"w\"\u003E    \u003C/span\u003Eoutput\u003Cspan class=\"w\"\u003E   \u003C/span\u003Equit\u003Cspan class=\"w\"\u003E   \u003C/span\u003Erun\u003Cspan class=\"w\"\u003E     \u003C/span\u003Etables\n\nBeancount\u003Cspan class=\"w\"\u003E \u003C/span\u003Equery\u003Cspan class=\"w\"\u003E \u003C/span\u003Ecommands:\n\u003Cspan class=\"o\"\u003E=========================\u003C/span\u003E\nbalances\u003Cspan class=\"w\"\u003E  \u003C/span\u003Efrom\u003Cspan class=\"w\"\u003E  \u003C/span\u003Ejournal\u003Cspan class=\"w\"\u003E  \u003C/span\u003Eprint\u003Cspan class=\"w\"\u003E  \u003C/span\u003E\u003Cspan class=\"k\"\u003Eselect\u003C/span\u003E\u003Cspan class=\"w\"\u003E  \u003C/span\u003Etargets\u003Cspan class=\"w\"\u003E  \u003C/span\u003Ewhere\n\nbeanquery\u0026gt;\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003ETo get help on a specific command type \u003Ccode\u003E.help \u0026lt;command name\u0026gt;\u003C/code\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EE.g.:\u003C/span\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Ebeanquery\u0026gt; .help select\nExtract data from a query on the postings.\n\nThe general form of a SELECT statement loosely follows SQL syntax, with\nsome mild and idiomatic extensions:\n.........\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003ETo get the list of tables available in beanquery, type \u003Ccode\u003E.tables\u003C/code\u003E\u003C/span\u003E\n\u003Cdiv class=\"language-shell codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Ebeanquery\u0026gt;\u003Cspan class=\"w\"\u003E \u003C/span\u003E.tables\naccounts\nbalances\ncommodities\ndocuments\nentries\nevents\nnotes\npostings\nprices\ntransactions\nbeanquery\u0026gt;\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003ETo see the list of columns available in a table, type \u003Ccode\u003E.describe \u0026lt;table name\u0026gt;\u003C/code\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EFor example, to see the columns in the \u003Cstrong\u003Epostings\u003C/strong\u003E table, type\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cdiv class=\"language-shell codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Ebeanquery\u0026gt;\u003Cspan class=\"w\"\u003E \u003C/span\u003E.describe\u003Cspan class=\"w\"\u003E \u003C/span\u003Epostings\ntable\u003Cspan class=\"w\"\u003E \u003C/span\u003Epostings:\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003E\u003Cspan class=\"nb\"\u003Etype\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Estr\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Eid\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Estr\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Edate\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Edate\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Eyear\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Eint\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Emonth\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Eint\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Eday\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Eint\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Efilename\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Estr\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Elineno\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Eint\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Elocation\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Estr\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Eflag\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Estr\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Epayee\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Estr\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Enarration\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Estr\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Edescription\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Estr\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Etags\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003E\u003Cspan class=\"nb\"\u003Eset\u003C/span\u003E\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Elinks\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003E\u003Cspan class=\"nb\"\u003Eset\u003C/span\u003E\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Eposting_flag\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Estr\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Eaccount\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Estr\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Eother_accounts\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003E\u003Cspan class=\"nb\"\u003Eset\u003C/span\u003E\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Enumber\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Edecimal\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Ecurrency\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Estr\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Ecost_number\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Edecimal\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Ecost_currency\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Estr\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Ecost_date\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Edate\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Ecost_label\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Estr\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Eposition\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Eposition\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Eprice\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Eamount\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Eweight\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\ Cspan class=\"w\"\u003E  \u003C/span\u003Epayee\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Estr\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Enarration\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Estr\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Etags\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003E\u003Cspan class=\"nb\"\u003Eset\u003C/span\u003E\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Elinks\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003E\u003Cspan class=\"nb\"\u003Eset\u003C/span\u003E\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Eaccounts\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Eset\u003Cspan class=\"o\"\u003E[\u003C/span\u003Estr\u003Cspan class=\"o\"\u003E])\u003C/span\u003E\nbeanquery\u0026gt;\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "0027d24c08435539a9e5b45818c8929f", "console": [], "id": "ecfG", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"6-available-tables-introduction\"\u003E6 Available tables. Introduction\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "49eda85a191048b479975577883bee66", "console": [], "id": "Pvdt", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe list of tables which beanquery exposes to the user can be derived by issuing the \u003Ccode\u003E.tables\u003C/code\u003E command.\u003C/span\u003E\n\u003Cdiv class=\"language-shell codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Ebeanquery\u0026gt;\u003Cspan class=\"w\"\u003E \u003C/span\u003E.tables\naccounts\nbalances\ncommodities\ndocuments\nentries\nevents\nnotes\npostings\nprices\ntransactions\nbeanquery\u0026gt;\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003EThe list of columns in every table can be obtained using the \u003Ccode\u003E.describe \u0026lt;table_name\u0026gt;\u003C/code\u003E command.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e2c67a5840d523abbe8432ac1115fc2a", "console": [], "id": "ZBYS", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"7-types-of-queries\"\u003E7 Types of queries\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "77181e453eb4d83bdc1f67b11a65a8d4", "console": [], "id": "aLJB", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EBeanquery supports the following types of queries, further discussed in this document:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ca href=\"#8-select-query\"\u003ESELECT\u003C/a\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"#162-selecting-balances-balances-query\"\u003EBALANCES\u003C/a\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"#161-selecting-journals-journal-query\"\u003EJOURNAL\u003C/a\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"#163-print-print-query\"\u003EPRINT\u003C/a\u003E\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b7337688f826a2fbbbedc74057f3cdb1", "console": [], "id": "nHfw", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"8-select-query\"\u003E8 SELECT Query\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "cd87656ce9f12fbf737db5efd1d884dd", "console": [], "id": "xXTn", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe beanquery SELECT query loosely follows standard SQL syntax, with some deviations that will be discussed throughout this manual.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIt should be noted that originally \u003Cstrong\u003Ebeanquery\u003C/strong\u003E was designed to extract information from the postings table only. In this situation the \u003Cstrong\u003EFROM\u003C/strong\u003E part of the SQL query was \"hijacked\" for transaction-level filtering and \u003Cstrong\u003EWHERE\u003C/strong\u003E was used for posting-level filtering, which introduced a so-called two-level filtering syntax:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe SELECT query structure looked like this (written in the informal EBNF language):\u003C/span\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003ESELECT [DISTINCT] [\u0026lt;targets\u0026gt;|*]\n[FROM \u0026lt;entry-filter-logical-expression\u0026gt; [OPEN ON \u0026lt;date\u0026gt;] [CLOSE [ON \u0026lt;date\u0026gt;]] [CLEAR]]\n[WHERE \u0026lt;posting-filter-logical-expression\u0026gt;]\n[GROUP BY \u0026lt;groups\u0026gt; [HAVING \u0026lt;aggregate-filter-expression\u0026gt;]]\n[ORDER BY \u0026lt;groups\u0026gt; [ASC|DESC]]\n[PIVOT BY \u0026lt;column1\u0026gt;, \u0026lt;column2\u0026gt;]\n[LIMIT num]\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us call it the \u003Cstrong\u003Etraditional SELECT query form\u003C/strong\u003E.\u003C/span\u003E\n\u003Cdetails class=\"info\"\u003E\n\u003Csummary\u003E\u003Cstrong\u003ENote about the informal EBNF language\u003C/strong\u003E\u003C/summary\u003E\n\u003Cspan class=\"paragraph\"\u003EIn this manual, queries are described using a simplified notation that shows the structure of a command.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis notation is based on an \u003Cstrong\u003Einformal version of Extended Backus\u2013Naur Form (EBNF)\u003C/strong\u003E, but you do not need to know anything about EBNF to use it. It is designed to be easy to read and understand.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EHere is how to interpret it:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EWords written in \u003Cstrong\u003EUPPERCASE\u003C/strong\u003E are keywords that must be typed exactly as shown\u003C/li\u003E\n\u003Cli\u003EItems in \u003Cstrong\u003Esquare brackets \u003Ccode\u003E[ ... ]\u003C/code\u003E\u003C/strong\u003E are optional\u003C/li\u003E\n\u003Cli\u003EThe symbol \u003Ccode\u003E|\u003C/code\u003E means \u201cor\u201d (choose one of the alternatives)\u003C/li\u003E\n\u003Cli\u003EText inside \u003Cstrong\u003Eangle brackets \u003Ccode\u003E\u0026lt;...\u0026gt;\u003C/code\u003E\u003C/strong\u003E is a placeholder \u2014 you replace it with your own value\u003C/li\u003E\n\u003Cli\u003EItems written next to each other should be written in that order\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EExample:\u003C/strong\u003E\u003C/span\u003E\n\u003Cdiv class=\"language-sql codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"k\"\u003ESELECT\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"k\"\u003EDISTINCT\u003C/span\u003E\u003Cspan class=\"p\"\u003E]\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E\u0026lt;\u003C/span\u003E\u003Cspan class=\"n\"\u003Etargets\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E|\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E*\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E\u0026gt;\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"k\"\u003EFROM\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E\u0026lt;\u003C/span\u003E\u003Cspan class=\"n\"\u003Eexpression\u003C/span\u003E\u003Cspan class=\"o\"\u003E\u0026gt;\u003C/span\u003E\u003Cspan class=\"p\"\u003E]\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003EThis means:\u003C/span\u003E\n\u003Cdiv class=\"language-mysql highlight\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"o\"\u003E*\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003EStart\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003Ewith\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n n-Quoted\"\u003E`SELECT`\u003C/span\u003E\n\n\u003Cspan class=\"o\"\u003E*\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003EOptionally\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003Eadd\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n n-Quoted\"\u003E`DISTINCT`\u003C/span\u003E\n\n\u003Cspan class=\"o\"\u003E*\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003EEither\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Eprovide\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003Eone\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003Eor\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Emore\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Etargets\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"n\"\u003Ewhat\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Eyou\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Ewant\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003Eto\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003Eselect\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003Eor\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Eput\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Easterisks\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"o\"\u003E*\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n\n\u003Cspan class=\"o\"\u003E*\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003EThen\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003Eoptionally\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Eput\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n n-Quoted\"\u003E`FROM`\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Efollowed\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003Eby\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003Esome\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Eexpression\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"n\"\u003Eexpressions\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Eare\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Ediscussed\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Elater\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EIn simple terms:\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThink of this syntax as a \u003Cstrong\u003Etemplate\u003C/strong\u003E for writing queries:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIt shows what parts are required, what parts are optional, and where you need to insert your own values.\u003C/span\u003E\n\u003C/details\u003E\n\u003Cspan class=\"paragraph\"\u003ELater, in Beancount v3, when beanquery was moved to a standalone tool, it was extended to query more tables (see above). In this situation the FROM part was needed again to select a table, so a new form of the SELECT query was introduced:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003ESELECT [DISTINCT] [\u0026lt;targets\u0026gt;|*]\n[FROM (#\u0026lt;table-name\u0026gt; | \u0026quot;\u0026lt;table-name\u0026gt;\u0026quot; | \u0026lt;table-name\u0026gt;) | ( \u0026lt;select-query\u0026gt; )]\n[WHERE \u0026lt;posting-filter-logical-expression\u0026gt;]\n[GROUP BY \u0026lt;groups\u0026gt; [HAVING \u0026lt;aggregate-filter-expression\u0026gt;]]\n[ORDER BY \u0026lt;groups\u0026gt; [ASC|DESC]]\n[PIVOT BY \u0026lt;column1\u0026gt;, \u0026lt;column2\u0026gt;]\n[LIMIT num]\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\nIn this form the \u003Ccode\u003EFROM\u003C/code\u003E clause can include either a table name of a subquery. The subqueries are discussed in the section \u003Ca href=\"#14-subqueries\"\u003Esection 14\u003C/a\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe table name can be presented in 3 different forms:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003Ewith the \u003Ccode\u003E#\u003C/code\u003E symbol in front (E.g. \u003Ccode\u003E#transactions\u003C/code\u003E)\u003C/li\u003E\n\u003Cli\u003Einside the double quotes (E.g. \u003Ccode\u003E\"transactions\"\u003C/code\u003E)\u003C/li\u003E\n\u003Cli\u003Ejust by a table name (E.g. \u003Ccode\u003Etransactions\u003C/code\u003E)\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us call this form the \u003Cstrong\u003E#table\u003C/strong\u003E query form, even though not only #tables are supported (historically #table form was the 1st ones to be introduced, hence the name).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ENote that:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EThe \u003Cstrong\u003E#table\u003C/strong\u003E form is activated either by naming a table in the FROM clause \u2014 as \u003Ccode\u003E#\u0026lt;table-name\u0026gt;\u003C/code\u003E, \u003Ccode\u003E\"\u0026lt;table-name\u0026gt;\"\u003C/code\u003E, or \u003Ccode\u003E\u0026lt;table-name\u0026gt;\u003C/code\u003E \u2014 or by putting a subquery \u003Ccode\u003E( \u0026lt;select-query\u0026gt; )\u003C/code\u003E there (see \u003Ca href=\"#14-subqueries\"\u003Esection 14\u003C/a\u003E)\u003C/li\u003E\n\u003Cli\u003EThe \u003Cstrong\u003E#table\u003C/strong\u003E form allows querying tables other than the postings table as well as querying of sub-queries (which act as a table), but when used to query the postings table (which is possible), it lacks some functionality available in the traditional form, namely the \u003Ccode\u003E[OPEN ON \u0026lt;date\u0026gt;] [CLOSE [ON \u0026lt;date\u0026gt;]] [CLEAR]\u003C/code\u003E part. (This may actually be a \u003Ca href=\"https://github.com/beancount/beanquery/issues/274\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Ebql_iss_274\u003C/a\u003E, rather than a feature.)\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ESo, to summarize:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EIn the traditional BQL, the FROM clause is used to describe the posting-level filter, not to identify the data source\u003C/li\u003E\n\u003Cli\u003EIn the \u003Cstrong\u003E#table\u003C/strong\u003E form, the FROM clause identifies the data source \u2014 either a table (named with \u003Ccode\u003E#\u003C/code\u003E, double quotes, or bare) or a subquery\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EIn addition to a table reference, the FROM clause can also contain a \u003Cstrong\u003Esubquery\u003C/strong\u003E \u2014 a parenthesised \u003Ccode\u003ESELECT\u003C/code\u003E whose result is used as the data source (a \u003Cem\u003Ederived table\u003C/em\u003E). Subqueries may also appear inside \u003Ccode\u003EWHERE\u003C/code\u003E expressions, together with the \u003Ccode\u003EIN\u003C/code\u003E, \u003Ccode\u003EANY\u003C/code\u003E and \u003Ccode\u003EALL\u003C/code\u003E operators. Subqueries are covered separately in \u003Ca href=\"#14-subqueries\"\u003Esection 14\u003C/a\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ECurrently beanquery supports both query types. Let us explore this with a simple ledger.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "fc7efc9e591207b58f660a55b1024144", "console": [], "id": "AjVT", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='AjVT-0' random-id='ab789d56-5c5d-af86-3214-ed9c4060f52e'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Income:Salary\u0026#92;n2023-01-01 open Assets:Cash \u0026#92;n2023-01-01 open Expenses:Food \u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Salary\u0026#92;\u0026quot;\u0026#92;n  Income:Salary   -100 USD\u0026#92;n  Assets:Cash      100 USD\u0026#92;n\u0026#92;n2023-01-02 * \u0026#92;\u0026quot -element\u003E\u003Cpre class='text-xs'\u003E   date     flag  payee  narration   position\n----------  ----  -----  ----------  --------\n2023-01-02  *            Shopping 1  20 USD  \n\u003C/pre\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "bec8212cdbeb02e650748ba8bbe28b40", "console": [], "id": "yCnT", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='TRpd-0' random-id='1b7f6ff2-43c3-43a8-dd2f-c37afc2db6f8'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT *\u0026#92;nFROM \u0026#92;\u0026quot;postings\u0026#92;\u0026quot;\u0026#92;nWHERE account = \u0026#x27;Expenses:Food\u0026#x27;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;The same, but using the quoted table syntax\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E   date     flag  payee  narration   position\n----------  ----  -----  ----------  --------\n2023-01-02  *            Shopping 1  20 USD  \n\u003C/pre\u003E\u003C/div\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='TXez-0' random-id='0871f53b-5fc8-bb9d-8c7c-895a7404d4d5'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT *\u0026#92;nFROM postings\u0026#92;nWHERE account = \u0026#x27;Expenses:Food\u0026#x27;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;The same, but using the bare table syntax\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E   date     flag  payee  narration   position\n----------  ----  -----  ----------  --------\n2023-01-02  *            Shopping 1  20 USD  \n\u003C/pre\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "08c9d7dfbc764f4c7a2e3e3bf35754fc", "console": [], "id": "wlCL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ENote, that later in the manual whenever the #table form is used in examples, it can also be replaced the \"quoted\" table name as well as bare table name forms.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ENote, that here we use the wildcard symbol (*) to list some columns, instead of specifying column names manually.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EDifference to SQL: in BQL using a wildcard as the target list (\u201c*\u201d) selects a good default list of columns, while in traditional SQL the \u003Ccode\u003E*\u003C/code\u003E denotes the complete set of columns available in the table.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "287df92432b9a59fa7e9a8b1837fb036", "console": [], "id": "kqZH", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ELet us now query the \u003Cstrong\u003Eaccounts\u003C/strong\u003E table. Note, that for the \u003Cstrong\u003Eaccounts\u003C/strong\u003E table we have no choice, but to use the \u003Cstrong\u003E#table\u003C/strong\u003E query format.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b7c5e27f23ac00ca1eef39eec34e1474", "console": [], "id": "wAgl", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='wAgl-0' random-id='14c28466-127f-9a0b-833b-2d55dc43ed53'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT account, open.date, close.date\u0026#92;nFROM #accounts\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Querying on accounts (only #table style can be used for the accounts table)\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "ffbefcb10ae8f0abf8c74c3610f13fa7", "console": [], "id": "rEll", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   account     open.date   close.date\n-------------  ----------  ----------\nIncome:Salary  2023-01-01            \nAssets:Cash    2023-01-01            \nExpenses:Food  2023-01-01            \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "6d66454c73bfc005ba87d6f77d81b54b", "console": [], "id": "dGlV", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"9-expressions\"\u003E9 Expressions\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c672af94be01d1a15acf50a3a52461bf", "console": [], "id": "SdmI", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EWhen we talked about the \u003Ca href=\"#8-select-query\"\u003ESELECT\u003C/a\u003E query we mentioned but not define the notion of an expression. Let us correct this.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAn \u003Cstrong\u003Eexpression\u003C/strong\u003E is something, that can be evaluated to a value.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EA \u003Cstrong\u003Elogical expression\u003C/strong\u003E is an expression, that can be evaluated to a  logical value (\u003Ccode\u003ETRUE\u003C/code\u003E or \u003Ccode\u003EFALSE\u003C/code\u003E)\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIn beanquery an expression is constructed by combining \u003Cstrong\u003Etable columns\u003C/strong\u003E, \u003Cstrong\u003Econstants\u003C/strong\u003E, \u003Cstrong\u003Eoperators\u003C/strong\u003E, and \u003Cstrong\u003Efunctions\u003C/strong\u003E. All of these elements are described later in this document.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d0c455722cf87745d374c78c7cd481b0", "console": [], "id": "lgWD", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"91-operators\"\u003E9.1 Operators\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us use the following ledger for the purposes of the demonstration of operators:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "2437e160354bdc06b85f1e08827a9ccf", "console": [], "id": "yOPj", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='yOPj-0' random-id='e0b448e1-57e3-9c7d-a1de-51c209a585da'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Income:Salary\u0026#92;n2023-01-01 open Assets:Cash \u0026#92;n2023-01-01 open Expenses:Food \u0026#92;n2023-01-01 open Expenses:Misc \u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Salary\u0026#92;\u0026quot;\u0026#92;n  Income:Salary   -100 USD\u0026#92;n  Assets:Cash      100 USD\u0026#92;n\u0026#92;n2023-01-02 * \u0026#92;\u0026quot;John\u0026#92;\u0026quot; \u0026#92;\u0026quot;Shopping 1\u0026#92;\u0026quot; #trip-berlin\u0026#92;n  Expenses:Food   20 USD\u0026#92;n  Assets:Cash    -20 USD\u0026#92;n\u0026#92;n2023-02-03 * \u0026#92;\u0026quot;Richard\u0026#92;\u0026quot; \u0026#92;\u0026quot;Shopping 2\u0026#92;\u0026quot; #trip-london\u0026#92;n  Expenses:Misc   20 USD\u0026#92;n  Assets:Cash    -20 USD\u0026#92;n\u0026#92;n2023-02-04 *  \u0026#92;\u0026quot;Shopping 3\u0026#92;\u0026quot; \u0026#92;n  Expenses:Misc   20 USD\u0026#92;n  Assets:Cash    -20 USD\u0026#92;n  \u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger to demonstrate operators\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "e1237936313365f176eda4ba8b6aaaf5", "console": [], "id": "fwwy", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"911-logical-operators\"\u003E9.1.1 Logical operators\u003C/h4\u003E\n\u003Cspan class=\"paragraph\"\u003EOperators requiring or returning logical values:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EAND (logical conjunction)\u003C/li\u003E\n\u003Cli\u003EOR (logical disjunction)\u003C/li\u003E\n\u003Cli\u003ENOT (logical negation)\u003C/li\u003E\n\u003Cli\u003EIS NULL (check if value is NULL), IS NOT NULL\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E(Set membership \u2014 \u003Ccode\u003EIN\u003C/code\u003E / \u003Ccode\u003ENOT IN\u003C/code\u003E \u2014 and the quantified \u003Ccode\u003EANY\u003C/code\u003E / \u003Ccode\u003EALL\u003C/code\u003E operators are covered separately under \u003Ca href=\"#915-set-and-collection-operators\"\u003ESet and collection operators\u003C/a\u003E.)\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "70082e58b9ad6369e53b6353f462f048", "console": [], "id": "LJZf", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "12cd5981bdfffc97ec9dd3539d9f74bf", "console": [], "id": "urSm", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "12c91923a7776d0b7b31841be8b22b5d", "console": [], "id": "jxvo", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "92faa35ff9ad3fcdc68073436869ff1d", "console": [], "id": "mWxS", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "2968a04064b9901900a0fdc9bdcb33bb", "console": [], "id": "CcZR", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='LJZf-0' random-id='bb5e1a74-f7de-885b-4757-85f2de5aec6f'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT \u0026#92;n     date, account, payee+\u0026#x27; || \u0026#x27;+narration as my_description, position\u0026#92;nWHERE \u0026#92;n      \u0026#92;\u0026quot;trip-london\u0026#92;\u0026quot; IN tags\u0026#92;n      AND NOT payee = \u0026#92;\u0026quot;John\u0026#92;\u0026quot;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Operators demo  IN, NOT, =, +\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E   date        account         my_description     position\n----------  -------------  ---------------------  --------\n2023-02-03  Expenses:Misc  Richard || Shopping 2   20 USD \n2023-02-03  Assets:Cash    Richard || Shopping 2  -20 USD \n\u003C/pre\u003E\u003C/div\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='jxvo-0' random-id='79b979f0-ee65-bdb0-87cd-970925b24afe'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT \u0026#92;n     date, account, payee, narration, position\u0026#92;nWHERE \u0026#92;n      account = \u0026#x27;Expenses:Misc\u0026#x27;\u0026#92;n      AND payee IS NULL\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Operators demo =, IS NULL\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E   date        account     payee  narration   position\n----------  -------------  -----  ----------  --------\n2023-02-04  Expenses:Misc         Shopping 3  20 USD  \n\u003C/pre\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "96bee5379fad95a94ebb35ec0658dba8", "console": [], "id": "YWSi", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"912-string-operators\"\u003E9.1.2 String operators\u003C/h4\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cu\u003E\u003Cstrong\u003EString modifications:\u003C/strong\u003E\u003C/u\u003E\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E+ (string concatentation)\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cu\u003E\u003Cstrong\u003EComparing strings:\u003C/strong\u003E\u003C/u\u003E\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E= (equality), != (inequality)\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003E\u0026lt;\u003C/code\u003E , \u003Ccode\u003E\u0026lt;=\u003C/code\u003E, \u003Ccode\u003E\u0026gt;\u003C/code\u003E, \u003Ccode\u003E\u0026gt;=\u003C/code\u003E (\u003Ca href=\"https://www.geeksforgeeks.org/python/string-comparison-in-python]\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Elexical comparisons\u003C/a\u003E)  \u003Cem\u003E?? What would be an example of any practical usage in beanquery\u003C/em\u003E\u003C/li\u003E\n\u003Cli\u003Esubstr IN string  (check for substring)\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EComparing strings to regular expression patterns:\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003Ebeanquery uses Python \u003Ca href=\"https://docs.python.org/3/library/re.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\u003Ccode\u003Ere\u003C/code\u003E\u003C/a\u003E regular expressions, matched as a \u003Cstrong\u003Esubstring search\u003C/strong\u003E \u2014 the pattern may match \u003Cem\u003Eanywhere\u003C/em\u003E in the string (use \u003Ccode\u003E^\u003C/code\u003E and \u003Ccode\u003E$\u003C/code\u003E to anchor). There are three match operators, \u003Ccode\u003E~\u003C/code\u003E, \u003Ccode\u003E!~\u003C/code\u003E and \u003Ccode\u003E?~\u003C/code\u003E, which differ in \u003Cstrong\u003Eargument order\u003C/strong\u003E and \u003Cstrong\u003Edefault case-sensitivity\u003C/strong\u003E:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003Emystring ~ regex\u003C/code\u003E \u2014 pattern on the \u003Cstrong\u003Eright\u003C/strong\u003E, \u003Cstrong\u003Ecase-insensitive\u003C/strong\u003E by default\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Emystring !~ regex\u003C/code\u003E \u2014 negation of \u003Ccode\u003E~\u003C/code\u003E (same as \u003Ccode\u003ENOT (mystring ~ regex)\u003C/code\u003E)\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Eregex ?~ mystring\u003C/code\u003E \u2014 pattern on the \u003Cstrong\u003Eleft\u003C/strong\u003E (inverted argument order !!!), \u003Cstrong\u003Ecase-sensitive\u003C/strong\u003E by default\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EThe default case-sensitivity can be flipped with an inline regex flag inside the pattern: \u003Ccode\u003E(?i)\u003C/code\u003E forces a \u003Cstrong\u003Ecase-insensitive\u003C/strong\u003E match, and the scoped \u003Ccode\u003E(?-i:...)\u003C/code\u003E forces a \u003Cstrong\u003Ecase-sensitive\u003C/strong\u003E one. This yields all four combinations of argument order and case-sensitivity:\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EArgument order\u003C/th\u003E\n\u003Cth\u003ECase-sensitivity\u003C/th\u003E\n\u003Cth\u003EHow to write it\u003C/th\u003E\n\u003Cth\u003ENegation\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Estring \u2192 pattern\u003C/td\u003E\n\u003Ctd\u003Einsensitive (default)\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Emystring ~ 'regex'\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Emystring !~ 'regex'\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Estring \u2192 pattern\u003C/td\u003E\n\u003Ctd\u003Esensitive\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Emystring ~ '(?-i:regex)'\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Emystring !~ '(?-i:regex)'\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Epattern \u2192 string\u003C/td\u003E\n\u003Ctd\u003Esensitive (default)\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E'regex' ?~ mystring\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003ENOT ('regex' ?~ mystring)\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Epattern \u2192 string\u003C/td\u003E\n\u003Ctd\u003Einsensitive\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E'(?i)regex' ?~ mystring\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003ENOT ('(?i)regex' ?~ mystring)\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ENegation:\u003C/strong\u003E only the \u003Ccode\u003Estring \u2192 pattern\u003C/code\u003E order has a dedicated negation operator, \u003Ccode\u003E!~\u003C/code\u003E. There is no negated form of \u003Ccode\u003E?~\u003C/code\u003E (\u003Ccode\u003E!?~\u003C/code\u003E and \u003Ccode\u003E?!~\u003C/code\u003E do not exist), so a \u003Ccode\u003Epattern \u2192 string\u003C/code\u003E match must be negated with \u003Ccode\u003ENOT ( ... )\u003C/code\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us demonstrate some of this\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003Estring -\u0026gt; pattern reqular expressions\u003C/strong\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "3f73b6e7b3295f0adcf804a6b388cd6e", "console": [], "id": "zlud", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "efd356e1373ee1bfbb816fdae42082c3", "console": [], "id": "tZnO", "outputs": [{"data": {"text/plain": ""}, "ty
