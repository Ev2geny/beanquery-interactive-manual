03E\u003C/strong\u003E operator. Example: \u003Ccode\u003Edate - interval('2 month')\u003C/code\u003E.\n(plural s can be appended)\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EInstead of \u003Ccode\u003Emonth\u003C/code\u003E, you can use: \u003Ccode\u003Eday(s)\u003C/code\u003E, \u003Ccode\u003Eyear(s)\u003C/code\u003E, and, once the \u003Ca href=\"https://github.com/beancount/beanquery/pull/280\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Ebql_pr_280\u003C/a\u003E is accepted, also \u003Ccode\u003Eweek(s)\u003C/code\u003E, \u003Ccode\u003Edecade(s)\u003C/code\u003E, \u003Ccode\u003Ecentury/centuries\u003C/code\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis, for instance, can be used to select all expenses for the last 4 months:\u003C/span\u003E\n\u003Cdiv class=\"language-sql codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"k\"\u003ESELECT\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E*\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003EWHERE\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nb\"\u003Edate\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E\u0026gt;=\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Etoday\u003C/span\u003E\u003Cspan class=\"p\"\u003E()\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E-\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nb\"\u003Einterval\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"s1\"\u003E\u0026#39;4 month\u0026#39;\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "9b3e7be6a136a285bd3ea531a0fd40c3", "console": [], "id": "hBDP", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"1227-date_bin-and-date_trunc\"\u003E12.2.7 DATE_BIN() and DATE_TRUNC()\u003C/h4\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c6d7e904550c4b96c635a325f6779022", "console": [], "id": "ieTG", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EBoth functions map a date down to the \u003Cstrong\u003Estart of a period\u003C/strong\u003E and return a \u003Cstrong\u003Edate\u003C/strong\u003E, which makes them ideal as \u003Ccode\u003EGROUP BY\u003C/code\u003E keys for aggregating postings by week, month, quarter, year, or fiscal period. (Contrast this with \u003Ca href=\"#1228-date_part\"\u003E\u003Ccode\u003Edate_part()\u003C/code\u003E\u003C/a\u003E, which returns an \u003Cstrong\u003Einteger\u003C/strong\u003E component of a date rather than a date.)\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThey differ only in how the period boundaries are defined:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u003Ccode\u003Edate_trunc(field, date)\u003C/code\u003E\u003C/strong\u003E snaps to \u003Cstrong\u003Efixed calendar boundaries\u003C/strong\u003E, chosen from a list of named periods (\u003Ccode\u003Eweek\u003C/code\u003E, \u003Ccode\u003Emonth\u003C/code\u003E, \u003Ccode\u003Equarter\u003C/code\u003E, \u003Ccode\u003Eyear\u003C/code\u003E, \u2026). It is the shorter, simpler form.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u003Ccode\u003Edate_bin(stride, source, origin)\u003C/code\u003E\u003C/strong\u003E snaps to a grid of equal-width bins defined by an arbitrary \u003Ccode\u003Estride\u003C/code\u003E and a \u003Cstrong\u003Ecustom \u003Ccode\u003Eorigin\u003C/code\u003E\u003C/strong\u003E. This lets it express things \u003Ccode\u003Edate_trunc()\u003C/code\u003E cannot \u2014 fiscal years starting in April, 3-day buckets, etc.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EFor standard calendar periods the two are equivalent \u2014 e.g. \u003Ccode\u003Edate_trunc('quarter', date)\u003C/code\u003E produces the same result as \u003Ccode\u003Edate_bin('3 months', date, 2000-01-01)\u003C/code\u003E. Reach for \u003Ccode\u003Edate_trunc()\u003C/code\u003E when the calendar boundaries are what you want, and \u003Ccode\u003Edate_bin()\u003C/code\u003E when you need a custom alignment.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe single ledger below is reused for every example in this section.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "ba97cf5807a16b0c001c14cce64ad756", "console": [], "id": "mVhx", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='mVhx-0' random-id='2d042ca3-82a4-ab76-17b9-ca9cf8b0c686'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Assets:Bank\u0026#92;n2023-01-01 open Expenses:Food\u0026#92;n2023-01-01 open Expenses:Travel\u0026#92;n\u0026#92;n2023-01-10 * \u0026#92;\u0026quot;Groceries\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food     120 USD\u0026#92;n  Assets:Bank      -120 USD\u0026#92;n\u0026#92;n2023-02-05 * \u0026#92;\u0026quot;Restaurant\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food      80 USD\u0026#92;n  Assets:Bank       -80 USD\u0026#92;n\u0026#92;n2023-03-20 * \u0026#92;\u0026quot;Train tickets\u0026#92;\u0026quot;\u0026#92;n  Expenses:Travel   300 USD\u0026#92;n  Assets:Bank      -300 USD\u0026#92;n\u0026#92;n2023-05-15 * \u0026#92;\u0026quot;Groceries\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food     150 USD\u0026#92;n  Assets:Bank      -150 USD\u0026#92;n\u0026#92;n2023-08-02 * \u0026#92;\u0026quot;Hotel\u0026#92;\u0026quot;\u0026#92;n  Expenses:Travel   500 USD\u0026#92;n  Assets:Bank      -500 USD\u0026#92;n\u0026#92;n2023-11-25 * \u0026#92;\u0026quot;Groceries\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food     200 USD\u0026#92;n  Assets:Bank      -200 USD\u0026#92;n\u0026#92;n2024-02-14 * \u0026#92;\u0026quot;Restaurant\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food     100 USD\u0026#92;n  Assets:Bank      -100 USD\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for DATE_BIN() / DATE_TRUNC() demos\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "98a3cef75415263fcbb4d1f0410f4260", "console": [], "id": "nnaP", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch5 id=\"date_bin\"\u003EDATE_BIN()\u003C/h5\u003E\n\u003Cspan class=\"paragraph\"\u003EIntroduced in beanquery commit \u003Ca href=\"https://github.com/beancount/beanquery/commit/51ad2619acf787845b149b6330defb99ee33366b\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\u003Ccode\u003E51ad2619\u003C/code\u003E\u003C/a\u003E (Nov 2024).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Edate_bin(stride, source, origin)\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\nIs a function for rounding timestamps down into fixed-width intervals, called the \u003Ccode\u003Estride\u003C/code\u003E, aligned to an \u003Ccode\u003Eorigin\u003C/code\u003E. It is similar to SQL's \u003Ccode\u003Edate_bin()\u003C/code\u003E but extended to accept strides with units of months and years (which have variable length). The function is particularly useful with \u003Ccode\u003EGROUP BY\u003C/code\u003E to aggregate postings by week, month, quarter, fiscal year, or any other custom-aligned period.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003Estride\u003C/code\u003E \u2014 either an \u003Ca href=\"#1226-intervalstr\"\u003E\u003Ccode\u003Einterval\u003C/code\u003E\u003C/a\u003E (e.g. \u003Ccode\u003Einterval('1 month')\u003C/code\u003E) or a string accepted by \u003Ccode\u003Einterval()\u003C/code\u003E (e.g. \u003Ccode\u003E'1 month'\u003C/code\u003E, \u003Ccode\u003E'3 days'\u003C/code\u003E, \u003Ccode\u003E'1 year'\u003C/code\u003E).\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Esource\u003C/code\u003E \u2014 the date to be binned.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Eorigin\u003C/code\u003E \u2014 any date that defines the alignment of the bins. The origin does \u003Cstrong\u003Enot\u003C/strong\u003E have to be earlier than \u003Ccode\u003Esource\u003C/code\u003E; bins extend in both directions.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EQuick reference:\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003ECall\u003C/th\u003E\n\u003Cth\u003EResult\u003C/th\u003E\n\u003Cth\u003EWhy\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Edate_bin('1 year', 2024-11-10, 2024-06-01)\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E2024-06-01\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EYearly bins from Jun 1. Nov 10 falls in the bin \u003Ccode\u003E[2024-06-01, 2025-06-01)\u003C/code\u003E.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Edate_bin('1 year', 2024-11-10, 2025-06-01)\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E2024-06-01\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EOrigin is in the future \u2014 bins still extend backward.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Edate_bin('1 month', 2024-11-10, 2024-06-03)\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E2024-11-03\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EMonthly bins aligned to day 3. Nov 10 \u2192 \u003Ccode\u003E[Nov 3, Dec 3)\u003C/code\u003E.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Edate_bin('3 days', 2024-11-10, 2024-11-02)\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E2024-11-08\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E3-day bins starting Nov 2: Nov 2, 5, 8, 11. Nov 10 \u2192 bin starting Nov 8.\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "627783fed23079bdb414678bb13d018e", "console": [], "id": "UJiw", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EDATE_BIN() Example 1\u003C/strong\u003E \u2014 quarterly aggregation, aligned to the start of each calendar quarter:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "acad16b5d87f1980e6458ad740211851", "console": [], "id": "rEHw", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='rEHw-0' random-id='8a18a268-7c11-02e7-776c-93b47fb6b4c5'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date_bin(\u0026#x27;3 months\u0026#x27;, date, 2023-01-01) AS quarter_start,\u0026#92;n       sum(position)\u0026#92;nWHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;nGROUP BY 1\u0026#92;nORDER BY 1\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;DATE_BIN() \u2014 quarterly bins\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "4221146129f18ba4ba788ad22ec826b7", "console": [], "id": "nRku", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003Equarter_start  sum(position)\n-------------  -------------\n2023-01-01     500 USD      \n2023-04-01     150 USD      \n2023-07-01     500 USD      \n2023-10-01     200 USD      \n2024-01-01     100 USD      \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "84f14508d4060f4f7c1b5334e928314c", "console": [], "id": "zmDD", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EDATE_BIN() Example 2\u003C/strong\u003E \u2014 fiscal-year aggregation, aligned to a custom origin (here, April 1). This is something that the standard \u003Ccode\u003Eyear()\u003C/code\u003E function cannot do, since it always uses the calendar year.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7fe1327e01ba44cee724016baa41bc07", "console": [], "id": "ZpYI", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='ZpYI-0' random-id='9d3556a8-1744-3aa6-088f-4d655479b1c9'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date_bin(\u0026#x27;1 year\u0026#x27;, date, 2023-04-01) AS fiscal_year_start,\u0026#92;n       sum(position)\u0026#92;nWHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;nGROUP BY 1\u0026#92;nORDER BY 1\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;DATE_BIN() \u2014 fiscal-year bins\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "df6f6dff0aa398aa12624fadfd5184cf", "console": [], "id": "oDJM", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003Efiscal_year_start  sum(position)\n-----------------  -------------\n2022-04-01         500 USD      \n2023-04-01         950 USD      \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "c701f86dbaff5ea53716d4be30667f81", "console": [], "id": "cFzV", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch5 id=\"date_trunc\"\u003EDATE_TRUNC()\u003C/h5\u003E\n\u003Cspan class=\"paragraph\"\u003EIntroduced in beanquery commit \u003Ca href=\"https://github.com/beancount/beanquery/commit/6df80214d1c1f8aabdba0af732e5e1a36f631e43\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\u003Ccode\u003E6df80214\u003C/code\u003E\u003C/a\u003E (Mar 2024).\u003C/span\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Edate_trunc(field, date) -\u0026gt; date\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003ETruncates a date down to the start of the period named by \u003Ccode\u003Efield\u003C/code\u003E, and returns that period's start \u003Cstrong\u003Edate\u003C/strong\u003E. The \u003Ccode\u003Efield\u003C/code\u003E argument is a string. Modelled on PostgreSQL's \u003Ccode\u003Edate_trunc()\u003C/code\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ESupported fields:\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003E\u003Ccode\u003Efield\u003C/code\u003E\u003C/th\u003E\n\u003Cth\u003ETruncates to\u003C/th\u003E\n\u003Cth\u003EExample for \u003Ccode\u003E2016-11-20\u003C/code\u003E (a Sunday)\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E'week'\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EMost recent \u003Cstrong\u003EMonday\u003C/strong\u003E on or before the date\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E2016-11-14\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E'month'\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EFirst day of the month\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E2016-11-01\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E'quarter'\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EFirst day of the calendar quarter\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E2016-10-01\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E'year'\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EJanuary 1 of the year\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E2016-01-01\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E'decade'\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EJanuary 1 of the decade (\u003Ccode\u003Eyear \u2212 year % 10\u003C/code\u003E)\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E2010-01-01\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E'century'\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EJanuary 1 of the century (1-based: years 2001\u20132100 \u2192 \u003Ccode\u003E2001\u003C/code\u003E)\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E2001-01-01\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E'millennium'\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EJanuary 1 of the millennium (1-based: years 2001\u20133000 \u2192 \u003Ccode\u003E2001\u003C/code\u003E)\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E2001-01-01\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003EAn unrecognised \u003Ccode\u003Efield\u003C/code\u003E returns \u003Ccode\u003ENULL\u003C/code\u003E. Note the 1-based boundaries for \u003Ccode\u003Ecentury\u003C/code\u003E and \u003Ccode\u003Emillennium\u003C/code\u003E: \u003Ccode\u003Edate_trunc('century', 2000-11-20)\u003C/code\u003E returns \u003Ccode\u003E1901-01-01\u003C/code\u003E, while \u003Ccode\u003Edate_trunc('century', 2001-11-20)\u003C/code\u003E returns \u003Ccode\u003E2001-01-01\u003C/code\u003E.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "747e0c226d73c52f91a8da2fe4ddda91", "console": [], "id": "oPFs", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EDATE_TRUNC() Example 1\u003C/strong\u003E \u2014 show the same posting date truncated to different periods. The \u003Ccode\u003E*_bin\u003C/code\u003E columns reproduce the \u003Ccode\u003Emonth_start\u003C/code\u003E, \u003Ccode\u003Equarter_start\u003C/code\u003E, and \u003Ccode\u003Eyear_start\u003C/code\u003E values with \u003Ccode\u003Edate_bin()\u003C/code\u003E (aligned to the calendar origin \u003Ccode\u003E2000-01-01\u003C/code\u003E), demonstrating that the two functions agree for standard calendar periods:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "5ab0bc241d168b4ff5997f42732b3832", "console": [], "id": "HGJL", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='HGJL-0' random-id='9bd2f04f-aa63-19cc-fbbb-989c1475dfb6'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date,\u0026#92;n       date_trunc(\u0026#x27;week\u0026#x27;, date)              AS week_start,\u0026#92;n       date_trunc(\u0026#x27;month\u0026#x27;, date)             AS month_start,\u0026#92;n       date_bin(\u0026#x27;1 month\u0026#x27;, date, 2000-01-01) AS month_start_bin,\u0026#92;n       date_trunc(\u0026#x27;quarter\u0026#x27;, date)            AS quarter_start,\u0026#92;n       date_bin(\u0026#x27;3 months\u0026#x27;, date, 2000-01-01) AS quarter_start_bin,\u0026#92;n       date_trunc(\u0026#x27;year\u0026#x27;, date)              AS year_start,\u0026#92;n       date_bin(\u0026#x27;1 year\u0026#x27;, date, 2000-01-01)  AS year_start_bin\u0026#92;nWHERE account = \u0026#x27;Expenses:Food\u0026#x27;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;DATE_TRUNC() vs DATE_BIN() \u2014 equivalent period starts\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "298d2d3431eb1c02489ae35a9020f5e8", "console": [], "id": "IRGU", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date     week_start  month_start  month_start_bin  quarter_start  quarter_start_bin  year_start  year_start_bin\n----------  ----------  -----------  ---------------  -------------  -----------------  ----------  --------------\n2023-01-10  2023-01-09  2023-01-01   2023-01-01       2023-01-01     2023-01-01         2023-01-01  2023-01-01    \n2023-02-05  2023-01-30  2023-02-01   2023-02-01       2023-01-01     2023-01-01         2023-01-01  2023-01-01    \n2023-05-15  2023-05-15  2023-05-01   2023-05-01       2023-04-01     2023-04-01         2023-01-01  2023-01-01    \n2023-11-25  2023-11-20  2023-11-01   2023-11-01       2023-10-01     2023-10-01         2023-01-01  2023-01-01    \n2024-02-14  2024-02-12  2024-02-01   2024-02-01       2024-01-01     2024-01-01         2024-01-01  2024-01-01    \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "96dc93485c236bcdfff5e993c63b719f", "console": [], "id": "HqwE", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EDATE_TRUNC() Example 2\u003C/strong\u003E \u2014 practical use case: aggregate expenses by calendar quarter. Because \u003Ccode\u003Edate_trunc('quarter', date)\u003C/code\u003E maps every date in a quarter to the same start date, it works directly as a \u003Ccode\u003EGROUP BY\u003C/code\u003E key \u2014 and gives the same result as \u003Ccode\u003Edate_bin('3 months', date, 2023-01-01)\u003C/code\u003E above:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f68c0408fdc66dee1a7268a028faf7d0", "console": [], "id": "MepM", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='MepM-0' random-id='5e612daa-efdd-e577-65df-3c62fbbad4e0'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date_trunc(\u0026#x27;quarter\u0026#x27;, date) AS quarter_start,\u0026#92;n       sum(position)\u0026#92;nWHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;nGROUP BY 1\u0026#92;nORDER BY 1\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;DATE_TRUNC() \u2014 quarterly totals\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "b24a4db0260ee0a0cde064b8d59ad7b9", "console": [], "id": "jgCY", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003Equarter_start  sum(position)\n-------------  -------------\n2023-01-01     500 USD      \n2023-04-01     150 USD      \n2023-07-01     500 USD      \n2023-10-01     200 USD      \n2024-01-01     100 USD      \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "b7a543987bf34fa8463c3be3626ffdf4", "console": [], "id": "BVRn", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"1228-date_part\"\u003E12.2.8 DATE_PART()\u003C/h4\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "24338d0f5e0fae51b84933d66ed91ed5", "console": [], "id": "QzPM", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EIntroduced in beanquery commit \u003Ca href=\"https://github.com/beancount/beanquery/commit/e39b7d71b7e3ba6482c20eaf3b4cdfc9b8bd096c\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\u003Ccode\u003Ee39b7d71\u003C/code\u003E\u003C/a\u003E (Jun 2024).\u003C/span\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Edate_part(field, date) -\u0026gt; int\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003EExtracts the specified component of a date as an integer. The \u003Ccode\u003Efield\u003C/code\u003E argument is a string naming the component to extract. Modelled on PostgreSQL's \u003Ccode\u003Edate_part()\u003C/code\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ESupported fields:\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003E\u003Ccode\u003Efield\u003C/code\u003E\u003C/th\u003E\n\u003Cth\u003EReturns\u003C/th\u003E\n\u003Cth\u003EExample for \u003Ccode\u003E2024-06-09\u003C/code\u003E (a Sunday)\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E'year'\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003ECalendar year\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E2024\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E'quarter'\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EQuarter of the year (1\u20134)\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E2\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E'month'\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EMonth (1\u201312)\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E6\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E'week'\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EISO week number (1\u201353)\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E23\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E'weekday'\u003C/code\u003E or \u003Ccode\u003E'dow'\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EDay of week, \u003Cstrong\u003EMon=0 \u2026 Sun=6\u003C/strong\u003E (Python convention)\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E6\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E'isoweekday'\u003C/code\u003E or \u003Ccode\u003E'isodow'\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EDay of week, \u003Cstrong\u003EMon=1 \u2026 Sun=7\u003C/strong\u003E (ISO convention)\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E7\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E'isoyear'\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EISO year (may differ from calendar year for dates near January 1)\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E2024\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E'decade'\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Eyear // 10\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E202\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E'century'\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003ECentury (1-based: years 2001\u20132100 \u2192 century \u003Ccode\u003E21\u003C/code\u003E)\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E21\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E'millennium'\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EMillennium (1-based: years 2001\u20133000 \u2192 millennium \u003Ccode\u003E3\u003C/code\u003E)\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E3\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E'epoch'\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003ESeconds since \u003Ccode\u003E1970-01-01\u003C/code\u003E (Unix epoch)\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E1717891200\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003EAn unrecognised \u003Ccode\u003Efield\u003C/code\u003E returns \u003Ccode\u003ENULL\u003C/code\u003E. Note that \u003Ccode\u003Edate_part('weekday', ...)\u003C/code\u003E and \u003Ccode\u003Edate_part('isoweekday', ...)\u003C/code\u003E use \u003Cstrong\u003Edifferent\u003C/strong\u003E numbering conventions \u2014 pick the one that matches the rest of your query.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"#1227-date_bin-and-date_trunc\"\u003E\u003Ccode\u003Edate_trunc()\u003C/code\u003E and \u003Ccode\u003Edate_bin()\u003C/code\u003E\u003C/a\u003E return a \u003Cstrong\u003Edate\u003C/strong\u003E (the start of a period), whereas \u003Ccode\u003Edate_part()\u003C/code\u003E returns the period number as an \u003Cstrong\u003Einteger\u003C/strong\u003E, which is convenient for \u003Ccode\u003EGROUP BY\u003C/code\u003E, \u003Ccode\u003EWHERE\u003C/code\u003E, and arithmetic.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a572f07168b011c4c8822e4261f19d6a", "console": [], "id": "rfYh", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='rfYh-0' random-id='bbd24176-35f5-9033-6955-ece47a6c39fd'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Assets:Bank\u0026#92;n2023-01-01 open Expenses:Food\u0026#92;n\u0026#92;n2024-06-07 * \u0026#92;\u0026quot;Friday groceries\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food     50 USD\u0026#92;n  Assets:Bank      -50 USD\u0026#92;n\u0026#92;n2024-06-08 * \u0026#92;\u0026quot;Saturday brunch\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food     80 USD\u0026#92;n  Assets:Bank      -80 USD\u0026#92;n\u0026#92;n2024-06-09 * \u0026#92;\u0026quot;Sunday dinner\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food    120 USD\u0026#92;n  Assets:Bank     -120 USD\u0026#92;n\u0026#92;n2024-06-10 * \u0026#92;\u0026quot;Monday lunch\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food     30 USD\u0026#92;n  Assets:Bank      -30 USD\u0026#92;n\u0026#92;n2024-06-15 * \u0026#92;\u0026quot;Saturday brunch\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food     90 USD\u0026#92;n  Assets:Bank      -90 USD\u0026#92;n\u0026#92;n2024-06-16 * \u0026#92;\u0026quot;Sunday dinner\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food    100 USD\u0026#92;n  Assets:Bank     -100 USD\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for DATE_PART() demo\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "398dddbe2b6b4a9078c9511f8be1ab20", "console": [], "id": "YSLY", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EExample 1\u003C/strong\u003E \u2014 show the extracted components of the posting date:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "44e793851ca61d2a8de240bc3e56419c", "console": [], "id": "YPtP", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='YPtP-0' random-id='4617068f-d429-12dd-d0f5-dbb285b902f0'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date, account, narration,\u0026#92;n       date_part(\u0026#x27;year\u0026#x27;, date)       AS year,\u0026#92;n       date_part(\u0026#x27;quarter\u0026#x27;, date)    AS quarter,\u0026#92;n       date_part(\u0026#x27;month\u0026#x27;, date)      AS month,\u0026#92;n       date_part(\u0026#x27;week\u0026#x27;, date)       AS iso_week,\u0026#92;n       date_part(\u0026#x27;weekday\u0026#x27;, date)    AS weekday,\u0026#92;n       date_part(\u0026#x27;isoweekday\u0026#x27;, date) AS isoweekday\u0026#92;nWHERE account = \u0026#x27;Expenses:Food\u0026#x27;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;DATE_PART() \u2014 extract date components\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "613a32ed74428bab99ae1d913e093892", "console": [], "id": "aBxI", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date        account        narration      year  quarter  month  iso_week  weekday  isoweekday\n----------  -------------  ----------------  ----  -------  -----  --------  -------  ----------\n2024-06-07  Expenses:Food  Friday groceries  2024        2      6        23        4           5\n2024-06-08  Expenses:Food  Saturday brunch   2024        2      6        23        5           6\n2024-06-09  Expenses:Food  Sunday dinner     2024        2      6        23        6           7\n2024-06-10  Expenses:Food  Monday lunch      2024        2      6        24        0           1\n2024-06-15  Expenses:Food  Saturday brunch   2024        2      6        24        5           6\n2024-06-16  Expenses:Food  Sunday dinner     2024        2      6        24        6           7\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "cf154437db3964a791bc53fe2b2c326b", "console": [], "id": "IEQW", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EExample 2\u003C/strong\u003E \u2014 practical use case: total weekend spending (Saturday and Sunday). Using the Python convention (\u003Ccode\u003EMon=0 \u2026 Sun=6\u003C/code\u003E), weekends are \u003Ccode\u003Eweekday \u0026gt;= 5\u003C/code\u003E.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "17362a5fa53f9d7435d8d93999da7c6a", "console": [], "id": "fmbT", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='fmbT-0' random-id='de7fb9d7-b980-e83a-5041-92bcbd8dda02'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT sum(position) AS weekend_spend\u0026#92;nWHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;n  AND date_part(\u0026#x27;weekday\u0026#x27;, date) \u0026gt;= 5\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;DATE_PART() \u2014 weekend spending\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "6386c9f5d567b43e4a4890abf2ce5612", "console": [], "id": "DVld", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003Eweekend_spend\n-------------\n390 USD      \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "fc1f46b5e2442c9edb35f0dd2b6fd580", "console": [], "id": "QVpv", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"1229-coalesce\"\u003E12.2.9 COALESCE()\u003C/h4\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c819455bf9f7b2d2b69cc6b33d437084", "console": [], "id": "hXpz", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Ecoalesce(expr1, expr2, ...) -\u0026gt; value\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003ENote: at the time of writing this function is not displayed by the \u003Ccode\u003E.help targets\u003C/code\u003E shell command (see \u003Ca href=\"https://github.com/beancount/beanquery/issues/284\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Ebql_iss_284\u003C/a\u003E)\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EReturns the value of the \u003Cstrong\u003Efirst argument that is not \u003Ccode\u003ENULL\u003C/code\u003E\u003C/strong\u003E, evaluating the arguments left to right. If every argument is \u003Ccode\u003ENULL\u003C/code\u003E, the result is \u003Ccode\u003ENULL\u003C/code\u003E. This is the standard SQL \u003Ccode\u003ECOALESCE\u003C/code\u003E, typically used to supply a fallback value when something might be missing. The function name is case-insensitive, so \u003Ccode\u003Ecoalesce(...)\u003C/code\u003E and \u003Ccode\u003ECOALESCE(...)\u003C/code\u003E are equivalent.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EA common use is providing a default for optional metadata, which is \u003Ccode\u003ENULL\u003C/code\u003E whenever the key is absent on a posting.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EImportant \u2014 all arguments must have the same type.\u003C/strong\u003E Beanquery requires the arguments of \u003Ccode\u003Ecoalesce()\u003C/code\u003E to be of a single, uniform type, and the result takes the type of the first argument. This is stricter than \u003Ccode\u003ECOALESCE\u003C/code\u003E in many SQL databases. In particular, \u003Ca href=\"#1016-the-meta-column\"\u003E\u003Ccode\u003Emeta()\u003C/code\u003E\u003C/a\u003E has the generic type \u003Ccode\u003Eobject\u003C/code\u003E, so combining it directly with a string literal fails to compile:\u003C/span\u003E\n\u003Cdiv class=\"language-sql codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"c1\"\u003E-- ERROR: arguments must have uniform type, found: object, str\u003C/span\u003E\n\u003Cspan class=\"k\"\u003ESELECT\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003Ecoalesce\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"n\"\u003Emeta\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"s1\"\u003E\u0026#39;project\u0026#39;\u003C/span\u003E\u003Cspan class=\"p\"\u003E),\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"s1\"\u003E\u0026#39;unassigned\u0026#39;\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003EThe fix is to cast the metadata to a concrete type first, e.g. with \u003Ccode\u003Estr()\u003C/code\u003E, so that all arguments are strings. Conveniently, \u003Ccode\u003Estr()\u003C/code\u003E of a missing value is itself \u003Ccode\u003ENULL\u003C/code\u003E, so the fallback still kicks in:\u003C/span\u003E\n\u003Cdiv class=\"language-sql codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"k\"\u003ESELECT\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003Ecoalesce\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"n\"\u003Estr\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"n\"\u003Emeta\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"s1\"\u003E\u0026#39;project\u0026#39;\u003C/span\u003E\u003Cspan class=\"p\"\u003E)),\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"s1\"\u003E\u0026#39;unassigned\u0026#39;\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7235463006179262d723cf7f804872a7", "console": [], "id": "fUhx", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='fUhx-0' random-id='73b970e6-03b3-d66d-6285-a6e18b5861da'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2024-01-01 open Assets:Bank\u0026#92;n2024-01-01 open Expenses:Food\u0026#92;n2024-01-01 open Expenses:Travel\u0026#92;n\u0026#92;n2024-01-02 * \u0026#92;\u0026quot;Groceries\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food     50 USD\u0026#92;n    project: \u0026#92;\u0026quot;Home\u0026#92;\u0026quot;\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-01-03 * \u0026#92;\u0026quot;Flight\u0026#92;\u0026quot;\u0026#92;n  Expenses:Travel  300 USD\u0026#92;n    project: \u0026#92;\u0026quot;Vacation\u0026#92;\u0026quot;\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-01-04 * \u0026#92;\u0026quot;Snack\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food      5 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for COALESCE() demo\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "cf15352bda26b848b2db1ded32ce5304", "console": [], "id": "IMXv", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EExample 1\u003C/strong\u003E \u2014 fall back to \u003Ccode\u003E'unassigned'\u003C/code\u003E for postings that have no \u003Ccode\u003Eproject\u003C/code\u003E metadata. The \u003Ccode\u003ESnack\u003C/code\u003E posting has no \u003Ccode\u003Eproject\u003C/code\u003E key, so the fallback is used:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "10135a69a0f08cbc12b2a24f6cc5bfbc", "console": [], "id": "Mivf", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='Mivf-0' random-id='38ef02ce-1dac-091a-879f-1081c4c4f053'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date, narration,\u0026#92;n       coalesce(str(meta[\u0026#x27;project\u0026#x27;]), \u0026#x27;unassigned\u0026#x27;) AS project\u0026#92;nWHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;COALESCE() \u2014 metadata fallback\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "5cb02a07f2c3fda3cb6f8d1eacb815d9", "console": [], "id": "zvXb", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date     narration   project  \n----------  ---------  ----------\n2024-01-02  Groceries  Home      \n2024-01-03  Flight     Vacation  \n2024-01-04  Snack      unassigned\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "3c768e095c36e20fa709e41dc35c37af", "console": [], "id": "txXS", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EExample 2\u003C/strong\u003E \u2014 \u003Ccode\u003Ecoalesce()\u003C/code\u003E accepts more than two arguments and tries each in turn. Here it looks for a \u003Ccode\u003Eproject\u003C/code\u003E key first, then a \u003Ccode\u003Ecategory\u003C/code\u003E key, and finally falls back to \u003Ccode\u003E'none'\u003C/code\u003E. Since all arguments are wrapped in \u003Ccode\u003Estr()\u003C/code\u003E, they share the same (\u003Ccode\u003Estr\u003C/code\u003E) type, as required:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "16773e3fdba21e11712b802985719e83", "console": [], "id": "fJCY", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='fJCY-0' random-id='ff50ac22-9a3e-84d1-e7cf-1544fa6341eb'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date, narration,\u0026#92;n       coalesce(str(meta[\u0026#x27;project\u0026#x27;]), str(meta[\u0026#x27;category\u0026#x27;]), \u0026#x27;none\u0026#x27;) AS label\u0026#92;nWHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;COALESCE() \u2014 multiple fallbacks\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "3170537401c0f70f64d8ca3a442a6fab", "console": [], "id": "sujg", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date     narration   label  \n----------  ---------  --------\n2024-01-02  Groceries  Home    \n2024-01-03  Flight     Vacation\n2024-01-04  Snack      none    \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "a133c9862f9175065e3c5050693e8273", "console": [], "id": "SxIH", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"12210-meta-entry_meta-and-any_meta\"\u003E12.2.10 META(), ENTRY_META() and ANY_META()\u003C/h4\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "1e4f41033eddf210aa0a3439d4c38409", "console": [], "id": "FbOm", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Emeta(key)       -\u0026gt; value\nentry_meta(key) -\u0026gt; value\nany_meta(key)   -\u0026gt; value\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003EThese three functions look up a metadata \u003Ccode\u003Ekey\u003C/code\u003E, but differ in \u003Cstrong\u003Ewhere\u003C/strong\u003E they look:\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EFunction\u003C/th\u003E\n\u003Cth\u003ELooks at\u003C/th\u003E\n\u003Cth\u003EReturns \u003Ccode\u003ENULL\u003C/code\u003E when\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Emeta(key)\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ethe \u003Cstrong\u003Eposting\u003C/strong\u003E's own metadata\u003C/td\u003E\n\u003Ctd\u003Ethe posting has no such key\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eentry_meta(key)\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ethe parent \u003Cstrong\u003Etransaction\u003C/strong\u003E's metadata\u003C/td\u003E\n\u003Ctd\u003Ethe transaction has no such key\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eany_meta(key)\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ethe \u003Cstrong\u003Eposting\u003C/strong\u003E first, then falls back to the \u003Cstrong\u003Etransaction\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003Eneither the posting nor the transaction has the key\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003EIn Beancount, metadata can be attached either to the transaction (indented under the date line) or to an individual posting (indented under the posting). \u003Ccode\u003Emeta()\u003C/code\u003E sees only the latter, \u003Ccode\u003Eentry_meta()\u003C/code\u003E only the former, and \u003Ccode\u003Eany_meta()\u003C/code\u003E combines them \u2014 preferring the posting's value when the key exists at both levels.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAll three return the generic type \u003Ccode\u003Eobject\u003C/code\u003E, so the same type caveat as \u003Ca href=\"#1229-coalesce\"\u003E\u003Ccode\u003Ecoalesce()\u003C/code\u003E\u003C/a\u003E applies: wrap them in \u003Ccode\u003Estr()\u003C/code\u003E (or another cast) before combining them with values of a concrete type.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe ledger below carries a \u003Ccode\u003Eproject\u003C/code\u003E key in three different positions so the difference is easy to see: on the posting only, on the transaction only, and on both at once.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b1cbaa3993584b6d99005235d24410ba", "console": [], "id": "gDdN", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='gDdN-0' random-id='954f3827-8c26-b23a-e9de-82b8c9999a63'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2024-01-01 open Assets:Bank\u0026#92;n2024-01-01 open Expenses:Food\u0026#92;n\u0026#92;n2024-01-02 * \u0026#92;\u0026quot;Posting-level only\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   10 USD\u0026#92;n    project: \u0026#92;\u0026quot;Alpha\u0026#92;\u0026quot;\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-01-03 * \u0026#92;\u0026quot;Transaction-level only\u0026#92;\u0026quot;\u0026#92;n  project: \u0026#92;\u0026quot;Beta\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   20 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-01-04 * \u0026#92;\u0026quot;Both levels\u0026#92;\u0026quot;\u0026#92;n  project: \u0026#92;\u0026quot;EntryGamma\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   30 USD\u0026#92;n    project: \u0026#92;\u0026quot;PostingGamma\u0026#92;\u0026quot;\u0026#92;n  Assets:Bank\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for META() / ENTRY_META() / ANY_META() demo\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "dfb97f27c1e68e1e398cda0858134b24", "console": [], "id": "klTr", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe single query below shows all three functions side by side. Notice how, for each row, the value depends on where the \u003Ccode\u003Eproject\u003C/code\u003E key lives: \u003Ccode\u003Eany_meta()\u003C/code\u003E returns the posting value when present and otherwise falls back to the transaction value.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us demonstrate this with the simple query, where for illustrative purposes we will also add \u003Ccode\u003Emeta\u003C/code\u003E and \u003Ccode\u003Eentry.meta\u003C/code\u003E objects themselves.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "03fc11bdc688483173c19a430f0c5a90", "console": [], "id": "hUaS", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='hUaS-0' random-id='e7a55f84-76a9-b55c-22aa-8c28e7308031'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT narration,\u0026#92;n       meta,\u0026#92;n       meta(\u0026#x27;project\u0026#x27;)       AS posting_project,\u0026#92;n       entry.meta,\u0026#92;n       entry_meta(\u0026#x27;project\u0026#x27;) AS entry_project,\u0026#92;n       any_meta(\u0026#x27;project\u0026#x27;)   AS any_project\u0026#92;nWHERE account = \u0026#x27;Expenses:Food\u0026#x27;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;META() / ENTRY_META() / ANY_META() side by side\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "6ddd947657be5a06ca8b37c30a034d27", "console": [], "id": "hgnj", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E      narration                                        meta                                posting_project          entry.meta         entry_project  any_project \n----------------------  -----------------------------------------------------------------  ---------------  -------------------------  -------------  ------------\nPosting-level only      {\u0026#x27;filename\u0026#x27;: \u0026#x27;\u0026lt;string\u0026gt;\u0026#x27;, \u0026#x27;lineno\u0026#x27;: 5, \u0026#x27;project\u0026#x27;: \u0026#x27;Alpha\u0026#x27;}          Alpha            {}                                        Alpha       \nTransaction-level only  {\u0026#x27;filename\u0026#x27;: \u0026#x27;\u0026lt;string\u0026gt;\u0026#x27;, \u0026#x27;lineno\u0026#x27;: 11}                                              {\u0026#x27;project\u0026#x27;: \u0026#x27;Beta\u0026#x27;}        Beta           Beta        \nBoth levels             {\u0026#x27;filename\u0026#x27;: \u0026#x27;\u0026lt;string\u0026gt;\u0026#x27;, \u0026#x27;lineno\u0026#x27;: 16, \u0026#x27;project\u0026#x27;: \u0026#x27;PostingGamma\u0026#x27;}  PostingGamma     {\u0026#x27;project\u0026#x27;: \u0026#x27;EntryGamma\u0026#x27;}  EntryGamma     PostingGamma\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "0004abc7f758bfcff872fe2ccb50d1c7", "console": [], "id": "IbaP", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"13-controlling-query-results\"\u003E13 Controlling query results\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "57a4791bfd1055a0fc11a250a4b068df", "console": [], "id": "mqjc", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"131-distinct\"\u003E13.1 DISTINCT\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "17a2c1396df88eaeded29847d1fa0339", "console": [], "id": "MBMy", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThere is a post-filtering phase that supports uniquifying result rows. You can trigger this unique filter with the DISTINCT flag after SELECT, as is common in SQL, e.g.\u003C/span\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003ESELECT DISTINCT account\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003EDISTINCT removes duplicate rows from the result, keeping only the first occurrence of each. Two rows are considered duplicates only when \u003Cstrong\u003Eall\u003C/strong\u003E selected columns are equal, so the more columns you select, the fewer rows are collapsed. The original order of the remaining rows is preserved.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis is handy because the \u003Ccode\u003Epostings\u003C/code\u003E table holds one row per posting, so the same value (an account, a payee, a currency, \u2026) typically appears many times. DISTINCT lets you turn that into a list of the distinct values actually used.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us demonstrate this with the ledger below, which posts to the same accounts and payees across several transactions.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "6888535e6bbc7f7cd4344ba67c99ec9c", "console": [], "id": "OAfA", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='OAfA-0' random-id='20bdd6bd-df0c-4bfd-3d5e-b1943f1cf681'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2024-01-01 open Assets:Bank\u0026#92;n2024-01-01 open Expenses:Food\u0026#92;n2024-01-01 open Expenses:Transport\u0026#92;n\u0026#92;n2024-01-02 * \u0026#92;\u0026quot;Cafe Rosa\u0026#92;\u0026quot; \u0026#92;\u0026quot;Lunch\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   12 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-01-05 * \u0026#92;\u0026quot;Cafe Rosa\u0026#92;\u0026quot; \u0026#92;\u0026quot;Dinner\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   30 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-01-07 * \u0026#92;\u0026quot;Metro\u0026#92;\u0026quot; \u0026#92;\u0026quot;Bus ticket\u0026#92;\u0026quot;\u0026#92;n  Expenses:Transport  3 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for DISTINCT demo\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "999df800cdeb2055e42a57cf1f7d0c00", "console": [], "id": "XcOT", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EWithout \u003Ccode\u003EDISTINCT\u003C/code\u003E\u003C/strong\u003E, selecting just the account produces one row per posting, so accounts repeat (\u003Ccode\u003EAssets:Bank\u003C/code\u003E appears in every transaction):\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "613f659118d813b7bc55418178cd8b6d", "console": [], "id": "BxYd", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='BxYd-0' random-id='efbbb65d-0fc7-641e-1c2b-5e8fe9212de4'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT account\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Without DISTINCT\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "1e515c769ed1510b7786cd36ab3d544c", "console": [], "id": "yuJz", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E     account      \n------------------\nExpenses:Food     \nAssets:Bank       \nExpenses:Food     \nAssets:Bank       \nExpenses:Transport\nAssets:Bank       \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "13548e376cd49988786947dee4719364", "console": [], "id": "VdeF", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EWith \u003Ccode\u003EDISTINCT\u003C/code\u003E\u003C/strong\u003E, each account is listed once \u2014 a quick way to get the set of accounts actually used by the postings:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "26ccd2f751cddf1a4fedc6eb69283a96", "console": [], "id": "doGC", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='doGC-0' random-id='f359cd89-d0f2-d0c8-898d-89b8fbce9b4e'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT DISTINCT account\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;With DISTINCT\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "59ec37158b49e87cc425c9128b272dc4", "console": [], "id": "qZBx", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E     account      \n------------------\nExpenses:Food     \nAssets:Bank       \nExpenses:Transport\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "7c150087e17c4df3619c81128b1ebea6", "console": [], "id": "FfKS", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EBecause rows are deduplicated only when \u003Cstrong\u003Eall\u003C/strong\u003E selected columns match, adding a second column keeps more rows. Selecting the distinct \u003Ccode\u003E(account, payee)\u003C/code\u003E pairs below shows that \u003Ccode\u003EAssets:Bank\u003C/code\u003E now appears twice \u2014 once for each payee it was used with:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "937e5551a6a368bce12e6e1a34c08d80", "console": [], "id": "HNLl", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='HNLl-0' random-id='b7e1372b-29e0-031a-1a86-437bee678e40'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT DISTINCT account, payee\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;DISTINCT on multiple columns\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "60caaa8137a1748d1e2b58beca31f648", "console": [], "id": "xlrx", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E     account          payee  \n------------------  ---------\nExpenses:Food       Cafe Rosa\nAssets:Bank         Cafe Rosa\nExpenses:Transport  Metro    \nAssets:Bank         Metro    \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "7f92b38bed25b0d74d0fe37f4b9cb2c2", "console": [], "id": "vewI", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"132-order-by\"\u003E13.2 ORDER BY\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "8dd6903b3c97fc2f81367475af8daa60", "console": [], "id": "thVd", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EAnalogous to the GROUP BY clause is an ORDER BY clause that controls the final ordering of the result rows:\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003ESELECT \u2026\nGROUP BY account, payee\nORDER BY payee, date;\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\nThe clause is optional. If you do not specify it, the default order of iteration of selected postings is used to output the results (that is, the order of transactions-sorted by date- and then their postings).\nAs in SQL, you may reverse the order of sorting by a DESC suffix (the default is the same as specifying ASC):\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003ESELECT \u2026\nGROUP BY account, payee\nORDER BY payee, date DESC;\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us demonstrate this with the ledger below, which contains a handful of expense postings with various dates and amounts.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "8734d7f310568e6efe7ed1a8f8b0e7e5", "console": [], "id": "RefM", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='RefM-0' random-id='642ac39d-7da8-c783-e460-7271a7eb86ed'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2024-01-01 open Assets:Bank\u0026#92;n2024-01-01 open Expenses:Food\u0026#92;n2024-01-01 open Expenses:Transport\u0026#92;n\u0026#92;n2024-01-10 * \u0026#92;\u0026quot;Cafe Rosa\u0026#92;\u0026quot; \u0026#92;\u0026quot;Lunch\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   12 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-01-03 * \u0026#92;\u0026quot;Metro\u0026#92;\u0026quot; \u0026#92;\u0026quot;Monthly pass\u0026#92;\u0026quot;\u0026#92;n  Expenses:Transport  60 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-01-20 * \u0026#92;\u0026quot;Cafe Rosa\u0026#92;\u0026quot; \u0026#92;\u0026quot;Dinner\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   45 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-01-05 * \u0026#92;\u0026quot;Taxi Co\u0026#92;\u0026quot; \u0026#92;\u0026quot;Airport ride\u0026#92;\u0026quot;\u0026#92;n  Expenses:Transport  30 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for ORDER BY demo\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "5d6ffc4f675505c4620411497e5552f3", "console": [], "id": "QCED", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EExample 1\u003C/strong\u003E \u2014 sort the expenses from largest to smallest amount with \u003Ccode\u003EORDER BY number DESC\u003C/code\u003E. Without the clause the rows would come out in their default (date) order; here the biggest expense is listed first:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "658d11f09d5abfef418a0e1751459c09", "console": [], "id": "rgsI", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='rgsI-0' random-id='d117b699-bd24-c6dc-0051-c597b75c45ac'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date, payee, narration, number\u0026#92;nWHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;nORDER BY number DESC\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;ORDER BY number DESC\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "4cb446de571b085bf00c3f2b891d423e", "console": [], "id": "NTLY", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date       payee     narration    number\n----------  ---------  ------------  ------\n2024-01-03  Metro      Monthly pass  60    \n2024-01-20  Cafe Rosa  Dinner        45    \n2024-01-05  Taxi Co    Airport ride  30    \n2024-01-10  Cafe Rosa  Lunch         12    \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "c87a08912849e4ed9d2496be78c30a27", "console": [], "id": "FsEl", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EExample 2\u003C/strong\u003E \u2014 you can order by several columns. The rows are sorted by the first column, ties broken by the next, and so on. Here the result is grouped by \u003Ccode\u003Eaccount\u003C/code\u003E and, within each account, by \u003Ccode\u003Edate\u003C/code\u003E:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "99a1a39f698d9631fbab0068283fb3a5", "console": [], "id": "IlfR", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='IlfR-0' random-id='20d0f9ea-196e-b158-631f-3b5ef7599391'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date, account, payee, number\u0026#92;nWHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;nORDER BY account, date\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;ORDER BY on multiple columns\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "ac986beb56d8cae60df76b94f323de06", "console": [], "id": "tNDP", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date          account          payee    number\n----------  ------------------  ---------  ------\n2024-01-10  Expenses:Food       Cafe Rosa  12    \n2024-01-20  Expenses:Food       Cafe Rosa  45    \n2024-01-03  Expenses:Transport  Metro      60    \n2024-01-05  Expenses:Transport  Taxi Co    30    \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "559d928d7b306858778e186a47a11509", "console": [], "id": "RYQF", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"133-limit\"\u003E13.3 LIMIT\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "70e58e023adb2df9d5645a0f461b1723", "console": [], "id": "HbWR", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe beanquery also supports a LIMIT clause to interrupt output row generation:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ccode\u003ESELECT \u2026 LIMIT 100;\u003C/code\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis would output the first 100 result rows and then stop. While this is a common clause present in the SQL language, in the context of double-entry bookkeeping it is not very useful: we always have relatively small datasets to work from. Nevertheless, it is provided for completeness.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ccode\u003ELIMIT\u003C/code\u003E becomes more useful when combined with \u003Ca href=\"#132-order-by\"\u003E\u003Ccode\u003EORDER BY\u003C/code\u003E\u003C/a\u003E to produce a \"top N\" report. The example below reuses the ORDER BY demo ledger and lists the \u003Cstrong\u003Etwo largest\u003C/strong\u003E expenses by sorting on the amount descending and then keeping only the first two rows:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "12297ee729c5e44ca5c514c9b25af2ee", "console": [], "id": "njKq", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='njKq-0' random-id='b57d5785-d457-3236-9f66-f4f34f12d2e2'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date, payee, narration, number\u0026#92;nWHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;nORDER BY number DESC\u0026#92;nLIMIT 2\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;ORDER BY ... LIMIT \u2014 top 2 expenses\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "0654051c406d2824b26bbd6ed6b50bcd", "console": [], "id": "raTD", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date       payee     narration    number\n----------  ---------  ------------  ------\n2024-01-03  Metro      Monthly pass  60    \n2024-01-20  Cafe Rosa  Dinner        45    \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "aba9a5738481262e155d373e5443820c", "console": [], "id": "uhGb", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"134-having\"\u003E13.4 HAVING\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "74a47acdeba74905da30459058f5ed04", "console": [], "id": "Mlvr", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe HAVING clause filters the \u003Cstrong\u003Egroups\u003C/strong\u003E of an \u003Ca href=\"#121-aggregate-functions-and-aggregate-queries\"\u003Eaggregate query\u003C/a\u003E after the aggregation has been computed. It is the aggregate counterpart of the \u003Ccode\u003EWHERE\u003C/code\u003E clause:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003EWHERE\u003C/code\u003E filters individual postings \u003Cstrong\u003Ebefore\u003C/strong\u003E they are grouped.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EHAVING\u003C/code\u003E filters the resulting groups \u003Cstrong\u003Eafter\u003C/strong\u003E the aggregates are calculated.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EHAVING is written as part of the GROUP BY clause:\u003C/span\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003ESELECT account, sum(number) AS total\nGROUP BY account\nHAVING sum(number) \u0026gt; 100\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003ETwo rules are worth remembering:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EHAVING only makes sense together with \u003Ccode\u003EGROUP BY\u003C/code\u003E \u2014 it filters groups, so there must be groups.\u003C/li\u003E\n\u003Cli\u003EThe HAVING condition \u003Cstrong\u003Emust be an aggregate expression\u003C/strong\u003E (for example \u003Ccode\u003Esum(...)\u003C/code\u003E, \u003Ccode\u003Ecount(...)\u003C/code\u003E). A plain non-aggregate condition such as \u003Ccode\u003EHAVING account ~ 'Food'\u003C/code\u003E is rejected with the error \u003Cem\u003E\"the HAVING clause must be an aggregate expression\"\u003C/em\u003E \u2014 such conditions belong in \u003Ccode\u003EWHERE\u003C/code\u003E instead.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us demonstrate this with the ledger below. It has three expense accounts with different totals and a different number of postings each.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b4098eb886875dfd68c9c894df334f56", "console": [], "id": "tLOD", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='tLOD-0' random-id='bd7629e7-c415-12a9-b84b-0062ced4ddcf'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2024-01-01 open Assets:Bank\u0026#92;n2024-01-01 open Expenses:Food\u0026#92;n2024-01-01 open Expenses:Transport\u0026#92;n2024-01-01 open Expenses:Books\u0026#92;n\u0026#92;n2024-01-02 * \u0026#92;\u0026quot;Groceries\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   40 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-01-09 * \u0026#92;\u0026quot;Restaurant\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   60 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-01-05 * \u0026#92;\u0026quot;Bus ticket\u0026#92;\u0026quot;\u0026#92;n  Expenses:Transport  15 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-01-20 * \u0026#92;\u0026quot;Novel\u0026#92;\u0026quot;\u0026#92;n  Expenses:Books  25 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for HAVING demo\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "88247c8eb34ae973b3f26861b9176f39", "console": [], "id": "eciG", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EFirst, the totals \u003Cstrong\u003Ewithout\u003C/strong\u003E HAVING \u2014 all three groups are returned, with their summed amount and the number of postings in each:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e42a9722fe99fcd4bde5341ae4217778", "console": [], "id": "JoIz", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='JoIz-0' random-id='27de9307-7449-e9f1-3a16-4a9dce55e3cd'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT account, sum(number) AS total, count(number) AS postings\u0026#92;nWHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;nGROUP BY account\u0026#92;nORDER BY account\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;GROUP BY without HAVING\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_ha
