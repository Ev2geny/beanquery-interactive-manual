nt object-id='UmEG-0' random-id='e13c4099-8afa-41e0-7226-626ede6a1015'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT \u0026#92;n     date, account, narration\u0026#92;nWHERE \u0026#92;n      \u0026#x27;(?i)expenses\u0026#x27; ?~ account\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;pattern -\u0026amp;gt; string regex case-insensitive\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E   date        account     narration \n----------  -------------  ----------\n2023-01-02  Expenses:Food  Shopping 1\n2023-02-03  Expenses:Misc  Shopping 2\n2023-02-04  Expenses:Misc  Shopping 3\n\u003C/pre\u003E\u003C/div\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='kLmu-0' random-id='32a975e9-b15b-5885-3b17-2f607e592a15'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT \u0026#92;n     date, account, narration\u0026#92;nWHERE \u0026#92;n      \u0026#x27;Expenses\u0026#x27; ?~ account\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;pattern -\u0026amp;gt; string regex case-sensitive\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E   date        account     narration \n----------  -------------  ----------\n2023-01-02  Expenses:Food  Shopping 1\n2023-02-03  Expenses:Misc  Shopping 2\n2023-02-04  Expenses:Misc  Shopping 3\n\u003C/pre\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "811d2977059b4766404ace927987296f", "console": [], "id": "dlnW", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"913-numeric-operators\"\u003E9.1.3 Numeric operators\u003C/h4\u003E\n\u003Cul\u003E\n\u003Cli\u003E= (equality), != (inequality)\u003C/li\u003E\n\u003Cli\u003E\u0026lt; (less than), \u0026lt;= (less than or equal)\u003C/li\u003E\n\u003Cli\u003E\u0026gt; (greater than), \u0026gt;= (greater than or equal)\u003C/li\u003E\n\u003Cli\u003E... BETWEEN ... AND ... (check numeric range)\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "ad67a0f940e9860e467d48ef63562043", "console": [], "id": "TTti", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"914-date-operators\"\u003E9.1.4 Date operators\u003C/h4\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003E=\u003C/code\u003E, \u003Ccode\u003E!=\u003C/code\u003E, \u003Ccode\u003E\u0026lt;\u003C/code\u003E, \u003Ccode\u003E\u0026lt;=\u003C/code\u003E, \u003Ccode\u003E\u0026gt;\u003C/code\u003E, \u003Ccode\u003E\u0026gt;=\u003C/code\u003E  (comparisons)\u003C/li\u003E\n\u003Cli\u003Edate BETWEEN start AND end (check date range, inclusive date range)\u003C/li\u003E\n\u003Cli\u003Edate +/- \u003Ca href=\"#1226-intervalstr\"\u003Einterval(str)\u003C/a\u003E\u003C/li\u003E\n\u003Cli\u003Edate +/- int  (the same as \u003Ccode\u003Edate +/- interval('\u0026lt;int\u0026gt; days')\u003C/code\u003E)\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "0ad3b5b2e12fff0decbc30688a72ee27", "console": [], "id": "RKFZ", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"915-in-any-all\"\u003E9.1.5 IN, ANY, ALL\u003C/h4\u003E\n\u003Cspan class=\"paragraph\"\u003EThe operators in this group test a value against a \u003Cstrong\u003Ecollection\u003C/strong\u003E of values rather than against a single value. The collection on the right-hand side is a list- or set-valued expression \u2014 most often a set-valued column (such as \u003Ccode\u003Eaccounts\u003C/code\u003E, \u003Ccode\u003Etags\u003C/code\u003E, \u003Ccode\u003Elinks\u003C/code\u003E; see section 10.2) or a \u003Ca href=\"#14-subqueries\"\u003Esubquery\u003C/a\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E\u003Ccode\u003EIN\u003C/code\u003E and \u003Ccode\u003ENOT IN\u003C/code\u003E \u2014 set membership\u003C/strong\u003E\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003Evalue IN collection\u003C/code\u003E \u2014 true when \u003Ccode\u003Evalue\u003C/code\u003E equals one of the elements of the collection.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Evalue NOT IN collection\u003C/code\u003E \u2014 true when it equals none of them.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EWhen the collection is a column no brackets are needed (\u003Ccode\u003E'Assets:Cash' IN accounts\u003C/code\u003E); brackets are used only to write an explicit list (\u003Ccode\u003Eaccount IN ('Assets:Cash', 'Assets:Bank')\u003C/code\u003E) or to wrap a subquery. The \u003Ccode\u003EIN\u003C/code\u003E keyword is also used for substring testing on plain strings (\u003Ccode\u003Esubstr IN string\u003C/code\u003E) \u2014 see \u003Ca href=\"#912-string-operators\"\u003EString operators\u003C/a\u003E.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "54e61dbd7f59e1d72d6f3350945fa1f6", "console": [], "id": "IaQp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E\u003Ccode\u003EANY\u003C/code\u003E and \u003Ccode\u003EALL\u003C/code\u003E \u2014 comparison against any / every element\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EEvery comparison shown so far compares one value against \u003Cstrong\u003Eone\u003C/strong\u003E other value (\u003Ccode\u003Enumber \u0026gt; 100\u003C/code\u003E, \u003Ccode\u003Eaccount ~ 'Food'\u003C/code\u003E). The \u003Ccode\u003EANY\u003C/code\u003E and \u003Ccode\u003EALL\u003C/code\u003E operators generalise this: they compare one value against a \u003Cstrong\u003Ewhole collection\u003C/strong\u003E of values at once, and reduce the result to a single true/false:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003Evalue \u0026lt;op\u0026gt; ANY ( \u0026lt;collection\u0026gt; )\u003C/code\u003E \u2014 true when the comparison \u003Ccode\u003E\u0026lt;op\u0026gt;\u003C/code\u003E holds for \u003Cstrong\u003Eat least one\u003C/strong\u003E element of the collection.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Evalue \u0026lt;op\u0026gt; ALL ( \u0026lt;collection\u0026gt; )\u003C/code\u003E \u2014 true when the comparison \u003Ccode\u003E\u0026lt;op\u0026gt;\u003C/code\u003E holds for \u003Cstrong\u003Eevery\u003C/strong\u003E element of the collection (and, vacuously, true when the collection is empty).\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ccode\u003E\u0026lt;op\u0026gt;\u003C/code\u003E is an ordinary comparison operator \u2014 \u003Ccode\u003E=\u003C/code\u003E, \u003Ccode\u003E!=\u003C/code\u003E, \u003Ccode\u003E\u0026lt;\u003C/code\u003E, \u003Ccode\u003E\u0026gt;\u003C/code\u003E \u2014 or one of the \u003Ca href=\"#912-string-operators\"\u003Eregular-expression match operators\u003C/a\u003E (\u003Ccode\u003E~\u003C/code\u003E, \u003Ccode\u003E?~\u003C/code\u003E, \u003Ccode\u003E!~\u003C/code\u003E).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETo picture the meaning, suppose the collection were the numbers \u003Ccode\u003E{1, 4, 9}\u003C/code\u003E:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003E5 \u0026gt; ANY (...)\u003C/code\u003E is \u003Cstrong\u003Etrue\u003C/strong\u003E \u2014 5 is greater than at least one element (1 and 4);\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003E5 \u0026gt; ALL (...)\u003C/code\u003E is \u003Cstrong\u003Efalse\u003C/strong\u003E \u2014 5 is not greater than every element (it is not greater than 9);\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003E0 \u0026lt; ALL (...)\u003C/code\u003E is \u003Cstrong\u003Etrue\u003C/strong\u003E \u2014 0 is smaller than every element.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ENote, that usage of \u003Ccode\u003Evalue = ANY (...)\u003C/code\u003E is equivalent to  \u003Ccode\u003Evalue IN (...)\u003C/code\u003E. It is the other operators (\u003Ccode\u003E\u0026lt;\u003C/code\u003E, \u003Ccode\u003E\u0026gt;\u003C/code\u003E, \u003Ccode\u003E~\u003C/code\u003E, \u003Ccode\u003E?~\u003C/code\u003E, \u2026) where \u003Ccode\u003EANY\u003C/code\u003E / \u003Ccode\u003EALL\u003C/code\u003E do something that plain \u003Ccode\u003EIN\u003C/code\u003E cannot.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a2d196847dae2892d5593606ef8f726b", "console": [], "id": "IWgg", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EThe brackets are compulsory \u2014 and they are \u003Cem\u003Enot\u003C/em\u003E a function call.\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ccode\u003EANY\u003C/code\u003E and \u003Ccode\u003EALL\u003C/code\u003E are \u003Cstrong\u003Eoperators\u003C/strong\u003E, not functions, even though \u003Ccode\u003EANY(accounts)\u003C/code\u003E looks like a function call. The parentheses are a mandatory part of the operator's syntax \u2014 they delimit the right-hand operand (the collection). The shape is fixed:\u003C/span\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Evalue \u0026lt;op\u0026gt; ANY ( collection )\nvalue \u0026lt;op\u0026gt; ALL ( collection )\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003EOmitting the brackets is a syntax error (\u003Ccode\u003E... ?~ ANY accounts\u003C/code\u003E does not parse). A space before the bracket is allowed, so \u003Ccode\u003EANY (accounts)\u003C/code\u003E and \u003Ccode\u003EANY(accounts)\u003C/code\u003E are equivalent \u2014 and that permitted space is itself a hint that this is an operator keyword followed by a parenthesised operand, not a function being called. (By contrast, \u003Ccode\u003EIN\u003C/code\u003E does \u003Cem\u003Enot\u003C/em\u003E require brackets around a column.)\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c7dafae19b005aabf7c56250a83fc7f7", "console": [], "id": "fCoF", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EWhat can go inside the brackets.\u003C/strong\u003E The collection must be a \u003Cstrong\u003Elist- or set-valued expression\u003C/strong\u003E. There are two common sources:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EA \u003Cstrong\u003Eset-valued column\u003C/strong\u003E. E.g.  \u003Ccode\u003Eaccounts\u003C/code\u003E, \u003Ccode\u003Eother_accounts\u003C/code\u003E (the latter after the fix of \u003Ca href=\"https://github.com/beancount/beanquery/issues/288\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Ebql_iss_288\u003C/a\u003E)\u003C/li\u003E\n\u003Cli\u003EA \u003Cstrong\u003Esubquery\u003C/strong\u003E returning a single column (covered separately in \u003Ca href=\"#14-subqueries\"\u003Esection 14\u003C/a\u003E).\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EThe examples below use the \u003Ccode\u003Eother_accounts\u003C/code\u003E column.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "77b0acba585655a149b6966cce08ea3c", "console": [], "id": "LkGn", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='LkGn-0' random-id='25b3f6e2-5ce8-cf2f-0593-73921c56aae1'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2024-01-01 open Assets:Bank\u0026#92;n2024-01-01 open Assets:Cash\u0026#92;n2024-01-01 open Expenses:Food:Meat \u0026#92;n2024-01-01 open Expenses:Food:Groceries\u0026#92;n2024-01-01 open Expenses:Food:Bakery\u0026#92;n2024-01-01 open Expenses:Transport\u0026#92;n2024-01-01 open Expenses:Misc\u0026#92;n\u0026#92;n2024-01-02 * \u0026#92;\u0026quot;Buying meat with bank card\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food:Meat   40 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-01-05 * \u0026#92;\u0026quot;Bus ticket with cash\u0026#92;\u0026quot;\u0026#92;n  Expenses:Transport  15 USD\u0026#92;n  Assets:Cash\u0026#92;n\u0026#92;n2024-01-06 * \u0026#92;\u0026quot;Supermarket with cash\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food:Groceries   40 USD\u0026#92;n  Expenses:Misc   20 USD\u0026#92;n  Assets:Cash\u0026#92;n\u0026#92;n2024-01-09 * \u0026#92;\u0026quot;Bakery with cash\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food:Bakery  60 USD\u0026#92;n  Assets:Cash\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for ANY/ALL over columns\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "ba83471cfc9dd3d05eea6082f8ef67ea", "console": [], "id": "zVRe", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='zVRe-0' random-id='18903ea5-65be-8729-0359-0637f32033ed'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date, narration, position\u0026#92;nWHERE account = \u0026#x27;Assets:Cash\u0026#x27; AND \u0026#x27;Expenses:Food\u0026#x27; ?~ ANY(other_accounts)\u0026#92;nORDER BY date\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;All cash payments, which were used to pay for food (but not necessarily only for food) (ANY)\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "b1827100b20c9bc27be7f1f0a7861bc7", "console": [], "id": "woaO", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date           narration        position\n----------  ---------------------  --------\n2024-01-06  Supermarket with cash  -60 USD \n2024-01-09  Bakery with cash       -60 USD \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "4a3da83fc073005587d5d201e8191ecf", "console": [], "id": "HnMC", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='HnMC-0' random-id='a9bff729-dd09-f678-2dc2-f280963c6ee0'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date, narration, position\u0026#92;nWHERE account = \u0026#x27;Assets:Cash\u0026#x27; AND \u0026#x27;Expenses:Food\u0026#x27; ?~ ALL(other_accounts)\u0026#92;nORDER BY date\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;All cash payments, which were used to pay for food and food only (ALL)\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "7628acb5dcfaa2c5cb656251891b2b3e", "console": [], "id": "wadT", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date        narration      position\n----------  ----------------  --------\n2024-01-09  Bakery with cash  -60 USD \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "daca32083980c7b950354ba01e47aa8b", "console": [], "id": "VCRE", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"92-constants\"\u003E9.2 Constants\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a820948954524f22c0a2df3612e47b45", "console": [], "id": "hgqU", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe following types of constants can be entered in a beanquery expression\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EString: \u003Ccode\u003E'I am a string'\u003C/code\u003E\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cdetails\u003E\n\u003Csummary\u003E\u003Cstrong\u003EAvoid double quotes for strings\u003C/strong\u003E\u003C/summary\u003E\n\u003Cspan class=\"paragraph\"\u003EAvoid the use of double quotes (\"abc\") for strings. Double quotes are meant to escape column names with\nunorthodox names (like spaces) and are treated as literal strings only if no column of that name exists.\nUsing double quotes can lead to unexpected results in cases like \u003Ccode\u003Edate_trunc(\"month\", date)\u003C/code\u003E. That call\nis a syntax error, as \u003Ccode\u003E\"month\"\u003C/code\u003E is converted to the month column (int) before the function is called and\nis not forwarded to \u003Ccode\u003Edate_trunc\u003C/code\u003E as a string parameter.\u003C/span\u003E\n\u003C/details\u003E\n\u003Cul\u003E\n\u003Cli\u003EDate:  Dates are entered in \u003Ccode\u003EYYYY-MM-DD format without any quotes: SELECT * WHERE date \u0026lt; 2024-05-20..\u003C/code\u003E\u003C/li\u003E\n\u003Cli\u003EInteger: \u003Ccode\u003E1\u003C/code\u003E\u003C/li\u003E\n\u003Cli\u003EBoolean: \u003Ccode\u003ETRUE, FALSE\u003C/code\u003E\u003C/li\u003E\n\u003Cli\u003ENumber:  \u003Ccode\u003E1.2\u003C/code\u003E\u003C/li\u003E\n\u003Cli\u003ENull object: \u003Ccode\u003ENULL\u003C/code\u003E       ?? How can we use this NULL in practice?\u003C/li\u003E\n\u003Cli\u003E?? can we enter a set of strings constant in an expression?\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "9952dfbdeec9b8ba95b7df04946d5c83", "console": [], "id": "PSUk", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='PSUk-0' random-id='9350f267-30b5-a7b5-0f89-dd692cd56094'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Income:Salary\u0026#92;n2023-01-01 open Assets:Cash \u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Salary\u0026#92;\u0026quot;\u0026#92;n  Income:Salary   -100 USD\u0026#92;n  Assets:Cash      100 USD\u0026#92;n  \u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Simple ledger for constants\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "8bf1571239238a8e22878e58d8701f3f", "console": [], "id": "mfOT", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='mfOT-0' random-id='0e3fee78-374d-6847-abc8-8c28273f29c1'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT \u0026#92;n   \u0026#x27;I am a string\u0026#x27; as string_const, \u0026#92;n    2026-10-10 as date_const, \u0026#92;n    10 as int_const,  \u0026#92;n    NULL as null_const, \u0026#92;n    3.14 as number_const, \u0026#92;n    TRUE as bool_const\u0026#92;nFROM #transactions\u0026#92;n\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Query has no practical sense, but it demonstrates how to enter constants in beanquery\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "3e93b569f7ef662965927a9f268ecd4c", "console": [], "id": "vGiW", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E string_const  date_const  int_const  null_const  number_const  bool_const\n-------------  ----------  ---------  ----------  ------------  ----------\nI am a string  2026-10-10         10              3.14          TRUE      \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "e4fe43b463a7eeb7f5a4cb9a6c92fd29", "console": [], "id": "SYQT", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"93-columns-and-functions-in-expressions\"\u003E9.3 Columns and Functions in expressions\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "652500e34d27d36d5d865b8978847e34", "console": [], "id": "bMrW", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EA full list of columns and functions available to construct expressions is available via the \u003Ccode\u003E.help XXX\u003C/code\u003E command:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003ETo get a help for the \u003Ccode\u003ESELECT\u003C/code\u003E clause expressions type \u003Ccode\u003E.help targets\u003C/code\u003E\u003C/li\u003E\n\u003Cli\u003ETo get a help for the \u003Ccode\u003EFROM\u003C/code\u003E clause expressions type \u003Ccode\u003E.help FROM\u003C/code\u003E\u003C/li\u003E\n\u003Cli\u003ETo get a help for the \u003Ccode\u003EWHERE\u003C/code\u003E clause expressions type \u003Ccode\u003E.help WHERE\u003C/code\u003E\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ESo, let us reiterate: the previously discussed \u003Ccode\u003E.describe \u0026lt;table name\u0026gt;\u003C/code\u003E provides the columns available in a given table. This command can be used for every table. The \u003Ccode\u003E.help [targets | FROM | where]\u003C/code\u003E on the other hand returns both columns as  well as functions, but only for transactions and postings.\nExample (reduced):\u003C/span\u003E\n\u003Cdiv class=\"language-carbon codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"nx\"\u003Ebeanquery\u003C/span\u003E\u003Cspan class=\"p\"\u003E\u0026gt;\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"p\"\u003E.\u003C/span\u003E\u003Cspan class=\"nx\"\u003Ehelp\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Efrom\u003C/span\u003E\n\n\u003Cspan class=\"nx\"\u003EA\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Elogical\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Eexpression\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Ethat\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Econsist\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Eof\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Ecolumns\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Eon\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Edirectives\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"nx\"\u003Emostly\u003C/span\u003E\n\u003Cspan class=\"nx\"\u003Etransactions\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"k\"\u003Eand\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Esimple\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Efunctions\u003C/span\u003E\u003Cspan class=\"p\"\u003E.\u003C/span\u003E\n\n\u003Cspan class=\"nx\"\u003EColumns\u003C/span\u003E\n\u003Cspan class=\"o\"\u003E-------\u003C/span\u003E\n\n\u003Cspan class=\"nx\"\u003Eid\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Estr\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003E\u003Cspan class=\"nx\"\u003EUnique\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Eid\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Eof\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Ea\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Edirective\u003C/span\u003E\u003Cspan class=\"p\"\u003E.\u003C/span\u003E\n\n\u003Cspan class=\"o\"\u003E...\u003C/span\u003E\n\n\u003Cspan class=\"nx\"\u003Edate\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Edate\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003E\u003Cspan class=\"nx\"\u003EThe\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Edate\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Eof\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Ethe\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Edirective\u003C/span\u003E\u003Cspan class=\"p\"\u003E.\u003C/span\u003E\n\n\u003Cspan class=\"o\"\u003E...\u003C/span\u003E\n\n\u003Cspan class=\"nx\"\u003EFunctions\u003C/span\u003E\n\u003Cspan class=\"o\"\u003E---------\u003C/span\u003E\n\n\u003Cspan class=\"nx\"\u003Eabs\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"nx\"\u003Edecimal\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n\n\u003Cspan class=\"nx\"\u003Econvert\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"nx\"\u003Eamount\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Estr\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"nx\"\u003Econvert\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"nx\"\u003Eamount\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Estr\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Edate\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"nx\"\u003Econvert\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"nx\"\u003Eposition\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Estr\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"nx\"\u003Econvert\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"nx\"\u003Eposition\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Estr\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Edate\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003E\u003Cspan class=\"nx\"\u003ECoerce\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Ean\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Eamount\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Eto\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Ea\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Eparticular\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Ecurrency\u003C/span\u003E\u003Cspan class=\"p\"\u003E.\u003C/span\u003E\n\n\u003Cspan class=\"nx\"\u003Econvert\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"nx\"\u003Einventory\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Estr\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"nx\"\u003Econvert\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"nx\"\u003Einventory\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Estr\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Edate\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003E\u003Cspan class=\"nx\"\u003ECoerce\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Ean\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Einventory\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Eto\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Ea\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Eparticular\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nx\"\u003Ecurrency\u003C/span\u003E\u003Cspan class=\"p\"\u003E.\u003C/span\u003E\n\n\u003Cspan class=\"o\"\u003E...\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003ETo make things even more confusing, note that when it comes to the transactions table, then probably due to the \u003Ca href=\"https://github.com/beancount/beanquery/issues/277\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Ebql_iss_277\u003C/a\u003E the \u003Ccode\u003E.help FROM\u003C/code\u003E command lists a few more columns for the transactions table, than are available via the \u003Ca href=\"#6-available-tables-introduction\"\u003E\u003Ccode\u003E.describe transactions\u003C/code\u003E\u003C/a\u003E command, e.g. the \u003Ca href=\"#1021-the-id-column\"\u003Eid\u003C/a\u003E column, which is not available via the \u003Ccode\u003E.describe transactions\u003C/code\u003E\u003C/span\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Ebeanquery\u0026gt; .describe transactions\ntable transactions:\n  meta (metadata)\n  date (date)\n  flag (str)\n  payee (str)\n  narration (str)\n  tags (set)\n  links (set)\n  accounts (set[str])\nbeanquery\u0026gt;\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "bb43d2c3b2f4501d0eb8107f3d6439a6", "console": [], "id": "PSQn", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"10-more-on-tables\"\u003E10 More on tables\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "21e106a0d1d20230d67ad4f32ef5722a", "console": [], "id": "OfTS", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThis section contains some additional information on some of the tables, available in beanquery.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f6bb3916000eb389193ffc116bb0b49d", "console": [], "id": "lQxp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"101-the-postings-table\"\u003E10.1 The postings table\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d108f6b5bdd476b717e590514ba34e9d", "console": [], "id": "Plbk", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EAs was already mentioned, beanquery was originally created to work with the postings table only, therefore the postings table h prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe content of a ledger is parsed into a list of directives, most of which are \u201cTransaction\u201d objects which contain two or more \u201cPosting\u201d objects. Postings are always linked only to a single transaction (they are never shared between transactions). Each posting refers to its parent transaction but has a unique account name, amount and associated lot (possibly with a cost), a price and some other attributes. The parent transaction itself contains a few useful attributes as well, such as a date, the name of a payee, a narration string, a flag, links, tags, etc.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ESo, one might think that attributes such as \u003Cstrong\u003Edate\u003C/strong\u003E or \u003Cstrong\u003Enarration\u003C/strong\u003E belong to the transaction object, while attributes like \u003Cstrong\u003Eaccount\u003C/strong\u003E belong to the posting object. However (probably for simplicity) all of the transaction-level fields are also made available in the posting objects (the only exception being the transaction meta, which is not available from the posting). One can check this by comparing the outputs of the \u003Cstrong\u003E\u003Ccode\u003E.describe postings\u003C/code\u003E\u003C/strong\u003E and \u003Cstrong\u003E\u003Ccode\u003E.describe transactions\u003C/code\u003E\u003C/strong\u003E commands.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ESo, from the beanquery data model the diagram looks more like this\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "6e4466384e8742c012fb8cb6966ba742", "console": [], "id": "LqFA", "outputs": [{"data": {"text/html": "\u003Cimg src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuIAAACPCAYAAAC/Fr6SAAA5vElEQVR4Xu2dB5gVRbq/SyRIECQJKAgGVFRMGDGhGDEh5qwoKqIgZkVFERUzBgyYURExYM4K5hx2Tburq+i6Oee99/7/t2+91dShT9WZPmdmziHM/N7n+T0zXV0dTndV19dVX31tjBBCCCGEEEIIIYQQQgghhBCiHrRs2foH+yeRpErVvUev/xghhB 2209ac06d", "console": [], "id": "WJUG", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "53e41c49f753ce309ad39e702f7158de", "console": [], "id": "pCao", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='IrqS-0' random-id='68edcf0c-f13e-0b3b-4922-c66ee3cb42ae'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT *\u0026#92;nFROM date = 2023-01-01\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Using transaction-level filtering\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E   date     flag  payee  narration   position\n----------  ----  -----  ----------  --------\n2023-01-01  *            Shopping 1   10 USD \n2023-01-01  *            Shopping 1  -10 USD \n\u003C/pre\u003E\u003C/div\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='upgv-0' random-id='5edc2513-7e28-39e4-366a-1dbbce210eb5'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT *\u0026#92;nWHERE date = 2023-01-01\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Using posting level filtering\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E   date     flag  payee  narration   position\n----------  ----  -----  ----------  --------\n2023-01-01  *            Shopping 1   10 USD \n2023-01-01  *            Shopping 1  -10 USD \n\u003C/pre\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "509cfea2b8fc2716e00b9983e790c2bc", "console": [], "id": "wEIy", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EWe can see that the field \u003Ccode\u003Edate\u003C/code\u003E can be used both within the FROM clause (transaction-level filter) and the WHERE clause (postings-level filter). This is despite the fact that, logically speaking, the \u003Ccode\u003Edate\u003C/code\u003E column should be a transaction-level field only.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EConclusion:\u003C/strong\u003E at the moment in a SELECT query there seems to be \u003Ca href=\"https://groups.google.com/g/beancount/c/HVK3_6p1FjM\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Elittle reason\u003C/a\u003E to use transaction-level filtering, provided by the \u003Ccode\u003EFROM\u003C/code\u003E clause , since everything can be done in the \u003Ccode\u003EWHERE\u003C/code\u003E clause.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "dc8128c83b4b5a13f3510fe9da9674f2", "console": [], "id": "wlyU", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"1012-the-entry-column\"\u003E10.1.2 The \u003Ccode\u003Eentry\u003C/code\u003E column\u003C/h4\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "0cf8ab42fa77ebf01fdc7684856d56b3", "console": [], "id": "PieA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ESuppose we would need to join postings with related transactions (e.g. to access posting meta field)\nIn a traditional SQL environment we would probably have to do something like this.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cdiv class=\"language-sql codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"k\"\u003ESELECT\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E    \u003C/span\u003E\u003Cspan class=\"n\"\u003Epostings\u003C/span\u003E\u003Cspan class=\"p\"\u003E.\u003C/span\u003E\u003Cspan class=\"o\"\u003E*\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E    \u003C/span\u003E\u003Cspan class=\"n\"\u003Etransactions\u003C/span\u003E\u003Cspan class=\"p\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Emeta\u003C/span\u003E\n\u003Cspan class=\"k\"\u003EFROM\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Epostings\u003C/span\u003E\n\u003Cspan class=\"k\"\u003EJOIN\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Etransactions\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E    \u003C/span\u003E\u003Cspan class=\"k\"\u003EON\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Epostings\u003C/span\u003E\u003Cspan class=\"p\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Etransaction_id\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E=\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Etransactions\u003C/span\u003E\u003Cspan class=\"p\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eid\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\nBeanquery however does not support \u003Ca href=\"https://groups.google.com/g/beancount/c/O0x0eZEp-Lk/m/WFnOS_flEQAJ\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Eyet\u003C/a\u003E table joining. On the other hand, the postings table returns records that include a reference to the transaction that contains them, so they are kind of pre-joined already (in addition to the fact that transaction columns are also available in the postings table).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EOne can check this by issuing the \u003Ccode\u003E.describe postings\u003C/code\u003E command:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cdiv class=\"language-shell codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Ebeanquery\u0026gt;\u003Cspan class=\"w\"\u003E \u003C/span\u003E.describe\u003Cspan class=\"w\"\u003E \u003C/span\u003Epostings\ntable\u003Cspan class=\"w\"\u003E \u003C/span\u003Epostings:\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003E....\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Eentry\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Etransaction\u003Cspan class=\"o\"\u003E)\u003C/span\u003E\u003Cspan class=\"w\"\u003E    \u003C/span\u003E\u0026lt;\u003Cspan class=\"o\"\u003E==\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003Ethis\u003Cspan class=\"w\"\u003E \u003C/span\u003Eis\u003Cspan class=\"w\"\u003E \u003C/span\u003Ea\u003Cspan class=\"w\"\u003E \u003C/span\u003Ereference\u003Cspan class=\"w\"\u003E \u003C/span\u003Eto\u003Cspan class=\"w\"\u003E \u003C/span\u003Ethe\u003Cspan class=\"w\"\u003E \u003C/span\u003Etransaction\u003Cspan class=\"w\"\u003E \u003C/span\u003Efrom\u003Cspan class=\"w\"\u003E \u003C/span\u003Ethe\u003Cspan class=\"w\"\u003E \u003C/span\u003Eposting\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003Eaccounts\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E(\u003C/span\u003Eset\u003Cspan class=\"o\"\u003E[\u003C/span\u003Estr\u003Cspan class=\"o\"\u003E])\u003C/span\u003E\nbeanquery\u0026gt;\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\nLet us see how we can do this by pulling both transaction meta and posting meta:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "8feb8b2cb009b579ef4242386793df6d", "console": [], "id": "GrQN", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='GrQN-0' random-id='a66f4794-84f8-f843-5b81-6ca5506f7187'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Assets:Cash USD\u0026#92;n2023-01-01 open Expenses:Food USD\u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Shopping 1\u0026#92;\u0026quot;\u0026#92;n  my_meta: \u0026#92;\u0026quot;tr1_meta\u0026#92;\u0026quot;     ; \u0026lt;= transaction-level meta\u0026#92;n  Expenses:Food   10 USD\u0026#92;n  my_meta: \u0026#92;\u0026quot;tr1_posting1\u0026#92;\u0026quot; ; \u0026lt;= posting-level meta\u0026#92;n  Assets:Cash    -10 USD\u0026#92;n  my_meta: \u0026#92;\u0026quot;tr1_posting2\u0026#92;\u0026quot; ; \u0026lt;= posting-level meta again\u0026#92;n\u0026#92;n2023-01-02 * \u0026#92;\u0026quot;Shopping 2\u0026#92;\u0026quot;\u0026#92;n  my_meta: \u0026#92;\u0026quot;tr2_meta\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   20 USD\u0026#92;n  my_meta: \u0026#92;\u0026quot;tr2_posting1\u0026#92;\u0026quot;\u0026#92;n  Assets:Cash    -20 USD\u0026#92;n  my_meta: \u0026#92;\u0026quot;tr2_posting1\u0026#92;\u0026quot;\u0026#92;n  \u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger:\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "9ee927d14d1d2c0bc97fe174f54bdcea", "console": [], "id": "Ilkb", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='Ilkb-0' random-id='c7b8a30d-88a8-d743-d6c2-cdb3a13e4613'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT \u0026#92;n  date, narration, account, \u0026#92;n  meta[\u0026#x27;my_meta\u0026#x27;] as posting_meta, \u0026#92;n  entry.meta[\u0026#x27;my_meta\u0026#x27;] as trans_meta\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Pulling both transaction-level and posting-level meta together\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "b2ac01a197a566e5b9a78756cda5eb88", "console": [], "id": "mySd", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date     narration      account     posting_meta  trans_meta\n----------  ----------  -------------  ------------  ----------\n2023-01-01  Shopping 1  Expenses:Food  tr1_posting1  tr1_meta  \n2023-01-01  Shopping 1  Assets:Cash    tr1_posting2  tr1_meta  \n2023-01-02  Shopping 2  Expenses:Food  tr2_posting1  tr2_meta  \n2023-01-02  Shopping 2  Assets:Cash    tr2_posting1  tr2_meta  \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "7b27c0ed3ee70e9bbbaa3a388c3d4d84", "console": [], "id": "vGkK", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ENote, that both posting and transaction metadata can also be accessed using the \u003Ca href=\"#12210-meta-entry_meta-and-any_meta\"\u003Emeta(), entry_meta(), and any_meta()\u003C/a\u003E functions.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e5c66497b7e8fc58cd65dc2f0da2dc20", "console": [], "id": "zmIa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"1013-the-other_accounts-column\"\u003E10.1.3 The \u003Ccode\u003Eother_accounts\u003C/code\u003E column\u003C/h4\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "43fb7cab2922e278960dd369ce866265", "console": [], "id": "NOfw", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe \u003Ccode\u003Eother_accounts\u003C/code\u003E column is another notable column in the postings table. It contains a set of accounts from other postings in the same transaction.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EExample:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "74fb5c32bd81b77ebe6769caeb39d19f", "console": [], "id": "jXAc", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='jXAc-0' random-id='9ecc795f-47fb-cd4d-2be8-8d467c035e6e'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Income:Salary\u0026#92;n2023-01-01 open Assets:Cash \u0026#92;n2023-01-01 open Liabilities:CreditCard\u0026#92;n2023-01-01 open Expenses:Food \u0026#92;n2023-01-01 open Expenses:Misc \u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Salary\u0026#92;\u0026quot;\u0026#92;n  Income:Salary   -100 USD\u0026#92;n  Assets:Cash      100 USD\u0026#92;n\u0026#92;n2023-01-02 * \u0026#92;\u0026quot;Shopping with cash\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   10 USD\u0026#92;n  Expenses:Misc   10 USD\u0026#92;n  Assets:Cash    -20 USD\u0026#92;n\u0026#92;n2023-01-02 * \u0026#92;\u0026quot;Shopping with credit card\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food             30 USD\u0026#92;n  Liabilities:CreditCard   -30 USD\u0026#92;n  \u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;The \u0026lt;code\u0026gt;other_accounts\u0026lt;/code\u0026gt; ledger:\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "096ddcb0322b9ad2e70eb3141d589eec", "console": [], "id": "mSxP", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='mSxP-0' random-id='9452305d-289e-33e7-3453-e640672b78dc'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT  date, account, narration, position, other_accounts\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Let us see, what the other_accounts column contains\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "191b312d16bb6449feb29d174e4b15f8", "console": [], "id": "IZEX", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date            account                  narration          position         other_accounts       \n----------  ----------------------  -------------------------  --------  ----------------------------\n2023-01-01  Income:Salary           Salary                     -100 USD  Assets:Cash                 \n2023-01-01  Assets:Cash             Salary                      100 USD  Income:Salary               \n2023-01-02  Expenses:Food           Shopping with cash           10 USD  Assets:Cash  Expenses:Misc  \n2023-01-02  Expenses:Misc           Shopping with cash           10 USD  Assets:Cash  Expenses:Food  \n2023-01-02  Assets:Cash             Shopping with cash          -20 USD  Expenses:Food  Expenses:Misc\n2023-01-02  Expenses:Food           Shopping with credit card    30 USD  Liabilities:CreditCard      \n2023-01-02  Liabilities:CreditCard  Shopping with credit card   -30 USD  Expenses:Food               \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "2b6f3efbcfee26253cb56e1396bf6dbf", "console": [], "id": "UFLA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ELet us now use the \u003Ccode\u003Eother_accounts\u003C/code\u003E column to select all expenses that were paid with cash rather than with a credit card.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c747129ae55689439054ea6e15613dd9", "console": [], "id": "RCUM", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='RCUM-0' random-id='0eca79fe-291d-c79f-c981-7492e3ae9fdf'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT  date, account, narration, position\u0026#92;nWHERE  account ~ \u0026#x27;^Expenses\u0026#x27; AND\u0026#x27;Assets:Cash\u0026#x27; IN other_accounts\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Expenses, paid with cash\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "def700a3ed5ab76660d2c89ab76924dc", "console": [], "id": "ynmH", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date        account         narration       position\n----------  -------------  ------------------  --------\n2023-01-02  Expenses:Food  Shopping with cash  10 USD  \n2023-01-02  Expenses:Misc  Shopping with cash  10 USD  \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "2f2018d55464afaa1ad85145abde8177", "console": [], "id": "NBGo", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"1014-the-balance-column\"\u003E10.1.4 The \u003Ccode\u003Ebalance\u003C/code\u003E column\u003C/h4\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e98bc06e6c60ab4515cfcdb82a961b47", "console": [], "id": "eooq", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EOne common desired output is a journal of entries over time (also called a \u201cregister\u201d in Ledger).\nFor this type of report, it is convenient to also render a column of the cumulative balance of the selected postings rows. Access to the previous row is not a standard SQL feature, so we get a little creative and provide a special column called \u201cbalance\u201d which is automatically calculated based on the previous selected rows. This provides the ability to render typical account statements such as those mailed to you by a bank. Output might look like this:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d25fbd1e29d78896e495181af55a39d2", "console": [], "id": "ChmK", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='ChmK-0' random-id='25c7e9d3-5837-698b-7b36-facb4f8fcafd'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Income:Salary\u0026#92;n2023-01-01 open Assets:Bank-A\u0026#92;n2023-01-01 open Assets:Bank-B\u0026#92;n2023-01-01 open Expenses:Misc \u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Salary\u0026#92;\u0026quot;\u0026#92;n  Income:Salary   -1000 USD\u0026#92;n  Assets:Bank-A    750 USD\u0026#92;n  Assets:Bank-B    250 USD\u0026#92;n\u0026#92;n2023-01-02 * \u0026#92;\u0026quot;Shopping using Bank-A\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    100 USD\u0026#92;n  Assets:Bank-A   -100 USD\u0026#92;n\u0026#92;n2023-01-03 * \u0026#92;\u0026quot;Shopping using Bank-B\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    110 USD\u0026#92;n  Assets:Bank-B   -110 USD\u0026#92;n\u0026#92;n2023-01-04 * \u0026#92;\u0026quot;Shopping using Bank-A again\u0026#92;\u0026quot;\u0026#92;n  Expenses:Misc    120 USD\u0026#92;n  Assets:Bank-A   -120 USD\u0026#92;n  \u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;The \u0026lt;code\u0026gt;balance\u0026lt;/code\u0026gt; ledger:\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "961a0829b8a2888d56e13b87adc4147a", "console": [], "id": "KdvC", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='KdvC-0' random-id='98a2e8c8-5a6e-0b5a-fa2e-3c089c30ea8f'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT  date, account, narration, position, balance\u0026#92;nWHERE account = \u0026#92;\u0026quot;Assets:Bank-A\u0026#92;\u0026quot;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Bank-A balance over time\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "b4658fb30c9384a8eff289c5f8947039", "console": [], "id": "vkvV", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date        account              narration           position  balance\n----------  -------------  ---------------------------  --------  -------\n2023-01-01  Assets:Bank-A  Salary                        750 USD  750 USD\n2023-01-02  Assets:Bank-A  Shopping using Bank-A        -100 USD  650 USD\n2023-01-04  Assets:Bank-A  Shopping using Bank-A again  -120 USD  530 USD\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "b81f56f37dd03514187cd2659a4421bd", "console": [], "id": "EKSN", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ENote, that beanquery starts counting the balance from 0 and takes into account all postings, that pass through the filter. Therefore if the goal is to have bank-equivalent balance information, then one shall not put any filter that would filter out any postings to the bank account. E.g. if we put a filter to start later, then the result would be different.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAlso selecting more than one bank account would create a result different from what you get from your bank statement:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a0b99c3df44c17d246d68f9e1ec9688c", "console": [], "id": "tasN", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "2147e6f303ee8cbb5b342f02abf185ef", "console": [], "id": "SXvM", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "0bd1be882cfedabed8002734e18993f4", "console": [], "id": "CFll", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='tasN-0' random-id='dc1552b8-8e7b-dd8b-8ff7-62327936ceac'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT  date, account, narration, position, balance\u0026#92;nWHERE account = \u0026#92;\u0026quot;Assets:Bank-A\u0026#92;\u0026quot; AND date \u0026gt; 2023-01-01\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Bank-A balance, starting later\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E   date        account              narration           position  balance \n----------  -------------  ---------------------------  --------  --------\n2023-01-02  Assets:Bank-A  Shopping using Bank-A        -100 USD  -100 USD\n2023-01-04  Assets:Bank-A  Shopping using Bank-A again  -120 USD  -220 USD\n\u003C/pre\u003E\u003C/div\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='SXvM-0' random-id='96464665-df61-1d52-cdcc-700850ae26cf'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT  date, account, narration, position, balance\u0026#92;nWHERE account = \u0026#92;\u0026quot;Assets:Bank-A\u0026#92;\u0026quot; OR account = \u0026#92;\u0026quot;Assets:Bank-B\u0026#92;\u0026quot;\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Bank-A, Bank-B balance over time\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E   date        account              narration           position  balance \n----------  -------------  ---------------------------  --------  --------\n2023-01-01  Assets:Bank-A  Salary                        750 USD   750 USD\n2023-01-01  Assets:Bank-B  Salary                        250 USD  1000 USD\n2023-01-02  Assets:Bank-A  Shopping using Bank-A        -100 USD   900 USD\n2023-01-03  Assets:Bank-B  Shopping using Bank-B        -110 USD   790 USD\n2023-01-04  Assets:Bank-A  Shopping using Bank-A again  -120 USD   670 USD\n\u003C/pre\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "5b56eff702ff9eb20b0e3d9e7fcfc6b9", "console": [], "id": "wbrJ", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"1015-the-weight-column\"\u003E10.1.5 The \u003Ccode\u003Eweight\u003C/code\u003E column\u003C/h4\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "986c03ba2ec19cae79210ae41649e82f", "console": [], "id": "viyg", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe column shows the \u201cweight\u201d of postings, which Beancount internally uses to balance the transaction. Refer to the \u003Ca href=\"https://docs.google.com/document/d/1wAMVrKIA2qtRGmoVDSUBJGmYZSygUaR0uOMW1GV3YE0\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EBeancount - Language Syntax\u003C/a\u003E document for more information.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "2331c6481834c1126be401fc0f838949", "console": [], "id": "GbuD", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='GbuD-0' random-id='3553cafc-d512-533d-0ee6-10f5d3ad109e'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Assets:Bank \u0026#92;n2023-01-01 open Assets:Investment \u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Investment 1. Price only. Price used for weight\u0026#92;\u0026quot;\u0026#92;n  Assets:Bank          -100 USD\u0026#92;n  Assets:Investment    10 IVV @@ 100 USD\u0026#92;n\u0026#92;n2023-01-02 * \u0026#92;\u0026quot;Investment 2. Cost cost only. Cost used for weight\u0026#92;\u0026quot;\u0026#92;n  Assets:Bank          -200 USD\u0026#92;n  Assets:Investment    20 IVV {10 USD}\u0026#92;n\u0026#92;n2023-01-03 * \u0026#92;\u0026quot;Investment 3. Cost and price. Cost used for weight\u0026#92;\u0026quot;\u0026#92;n  Assets:Bank          -200 USD\u0026#92;n  Assets:Investment    20 IVV {10 USD} @@ 300 USD\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger to demonstrate the weight column\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "df021bf056c56d7bf1a709aba527c4b9", "console": [], "id": "bHhy", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='bHhy-0' random-id='1ae5216b-b70f-438e-db04-973a05fb46e7'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date, account, narration, position,  weight\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Query to demonstrate the weight column\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "5b3291a0bb039e9d3feef2c924d2edd6", "console": [], "id": "ctlq", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date          account                           narration                            position       weight \n----------  -----------------  --------------------------------------------------  -----------------  --------\n2023-01-01  Assets:Bank        Investment 1. Price only. Price used for weight     -100 USD           -100 USD\n2023-01-01  Assets:Investment  Investment 1. Price only. Price used for weight       10 IVV            100 USD\n2023-01-02  Assets:Bank        Investment 2. Cost cost only. Cost used for weight  -200 USD           -200 USD\n2023-01-02  Assets:Investment  Investment 2. Cost cost only. Cost used for weight    20 IVV {10 USD}   200 USD\n2023-01-03  Assets:Bank        Investment 3. Cost and price. Cost used for weight  -200 USD           -200 USD\n2023-01-03  Assets:Investment  Investment 3. Cost and price. Cost used for weight    20 IVV {10 USD}   200 USD\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "6c4af8d9a6486643e161cc64f82a3be4", "console": [], "id": "NtNR", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"1016-the-meta-column\"\u003E10.1.6 The \u003Ccode\u003Emeta\u003C/code\u003E column\u003C/h4\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "8288c694eedf11b349eb2fb029da57a7", "console": [], "id": "nebC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe meta field returns a dictionary with postings-level metadata. This includes:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003Euser-provided meta, parsed from the beancount file\u003C/li\u003E\n\u003Cli\u003Eseveral beancount - generated meta fields\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003Efilename\u003C/code\u003E: the filename of the file where the posting was parsed from\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Elineno\u003C/code\u003E: the line number in that file\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003E__automatic__\u003C/code\u003E: (optional) a flag to show whether the posting was auto-inserted to complete the transaction\u003C/li\u003E\n\u003Cli\u003E??  any other auto-inserted meta?\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003ETo access the meta field treat it as a dictionary using the \u003Ccode\u003Emeta['meta-field-name']\u003C/code\u003E notation.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EExample:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "5f06a61de915d4c452ca409b7ec3cbb2", "console": [], "id": "ZsHO", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='ZsHO-0' random-id='0e8bcd5c-75e4-c537-7e77-3cca818d8c03'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;\u0026#92;n2023-01-01 open Assets:BankA\u0026#92;n2023-01-01 open Assets:BankB\u0026#92;n2023-01-01 open Expenses:Food\u0026#92;n\u0026#92;n2023-01-01 * \u0026#92;\u0026quot;Shopping 1\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   10 USD\u0026#92;n  shop: \u0026#92;\u0026quot;shopping 1 shop\u0026#92;\u0026quot; ; \u0026lt;= posting-level user-provided meta\u0026#92;n  Assets:BankA    -10 USD\u0026#92;n\u0026#92;n2023-01-02 * \u0026#92;\u0026quot;Shopping 2\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   20 USD\u0026#92;n  Assets:BankA    \u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger to test posting meta\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "b342a60542016fc698997114bd97c4a2", "console": [], "id": "HNXk", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='HNXk-0' random-id='e80f74f7-f306-3509-e3b0-d0995334a2d0'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT date, account, narration, meta, meta[\u0026#x27;shop\u0026#x27;] as shop_meta\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Querying the meta column\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "3bb2be74dbfad37ea7d9c917bde628ca", "console": [], "id": "bhgI", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date        account     narration                                 meta                                   shop_meta   \n----------  -------------  ----------  ----------------------------------------------------------------  ---------------\n2023-01-01  Expenses:Food  Shopping 1  {\u0026#x27;filename\u0026#x27;: \u0026#x27;\u0026lt;string\u0026gt;\u0026#x27;, \u0026#x27;lineno\u0026#x27;: 7, \u0026#x27;shop\u0026#x27;: \u0026#x27;shopping 1 shop\u0026#x27;}  shopping 1 shop\n2023-01-01  Assets:BankA   Shopping 1  {\u0026#x27;filename\u0026#x27;: \u0026#x27;\u0026lt;string\u0026gt;\u0026#x27;, \u0026#x27;lineno\u0026#x27;: 9}                                            \n2023-01-02  Expenses:Food  Shopping 2  {\u0026#x27;filename\u0026#x27;: \u0026#x27;\u0026lt;string\u0026gt;\u0026#x27;, \u0026#x27;lineno\u0026#x27;: 12}                                           \n2023-01-02  Assets:BankA   Shopping 2  {\u0026#x27;filename\u0026#x27;: \u0026#x27;\u0026lt;string\u0026gt;\u0026#x27;, \u0026#x27;lineno\u0026#x27;: 13, \u0026#x27;__automatic__\u0026#x27;: True}                    \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "d37699fc18290d0eaaab7c089a681257", "console": [], "id": "DlKN", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"102-transactions-table\"\u003E10.2 Transactions table\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "da5aa2005a24eda2d523492e542b9d98", "console": [], "id": "iFMf", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"1021-the-id-column\"\u003E10.2.1 The \u003Ccode\u003Eid\u003C/code\u003E column\u003C/h4\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f2c0183ea869b86fbab9d2db4a15e261", "console": [], "id": "QYfb", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EA special column exists that identifies each transaction uniquely: \u201cid\u201d. It is a unique hash automatically computed from the transaction and should be stable between runs.\nThis hash is derived from the contents of the transaction object itself (if you change something about the transaction, e.g. you edit the narration, the id will change).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ENote: even though the \u003Ccode\u003Eid\u003C/code\u003E field logically belongs to the transaction, it is not available in the \u003Ccode\u003Etransactions\u003C/code\u003E table via the \u003Ccode\u003E.describe transactions\u003C/code\u003E command (a \u003Ca href=\"https://github.com/beancount/beanquery/issues/277\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Ebql_iss_277\u003C/a\u003E has been raised about this). The only way to find it is to look in the postings using a traditional query.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d4532df68671691654e85f0963b4c183", "console": [], "id": "qJXu", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='qJXu-0' random-id='c03315cf-5c06-75d0-c5fc-8aa056b3d4c3'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Assets:Cash \u0026#92;n2023-01-01 open Expenses:Food \u0026#92;n\u0026#92;n2023-01-02 * \u0026#92;\u0026quot;Hamburger Place\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   10 USD\u0026#92;n  Assets:Cash\u0026#92;n\u0026#92;n2023-01-02 * \u0026#92;\u0026quot;Italian Place\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   20 USD\u0026#92;n  Assets:Cash\u0026#92;n\u0026#92;n2023-01-05 * \u0026#92;\u0026quot;Fancy Anniversary Dinner\u0026#92;\u0026quot; \u0026#92;\u0026quot;paid for entire extended family for parent\u0026#x27;s 50th wedding anniversary\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food 2,000 USD\u0026#92;n  Assets:Cash\u0026#92;n  \u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Simple ledger to test id column\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "f18dee945e6316822c8af94f57969d49", "console": [], "id": "LdJG", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='LdJG-0' random-id='bad07a12-7319-0920-c736-96f4b7809ca1'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT  date, account, narration, position, id\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Show some columns including the id column\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "03a0c2084f6527f553470ff61fdd082e", "console": [], "id": "fOSF", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   date        account                                   narration                                 position                 id               \n----------  -------------  ---------------------------------------------------------------------  ---------  --------------------------------\n2023-01-02  Expenses:Food  Hamburger Place                                                           10 USD  4a35fe25ac9d636b69307dc47323f615\n2023-01-02  Assets:Cash    Hamburger Place                                                          -10 USD  4a35fe25ac9d636b69307dc47323f615\n2023-01-02  Expenses:Food  Italian Place                                                             20 USD  35254ce188615c0fb09ecd4c782a4b13\n2023-01-02  Assets:Cash    Italian Place                                                            -20 USD  35254ce188615c0fb09ecd4c782a4b13\n2023-01-05  Expenses:Food  paid for entire extended family for parent\u0026#x27;s 50th wedding anniversary   2000 USD  6b634369dafa012b83e63be8be0c18bb\n2023-01-05  Assets:Cash    paid for entire extended family for parent\u0026#x27;s 50th wedding anniversary  -2000 USD  6b634369dafa012b83e63be8be0c18bb\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "cfd8763f0b3fe871c188ba03d35716fa", "console": [], "id": "gZOs", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EOnce the \u003Ccode\u003Eid\u003C/code\u003E field is known, one can use it also for transaction-level filtering.  E.g. one can use the \u003Ca href=\"#163-print-print-query\"\u003E\u003Ccode\u003EPRINT\u003C/code\u003E query\u003C/a\u003E (discussed later) to print a specific entry. This can be useful during debugging.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "0cca92c98dc4e9fae39dbc37b4f5d05d", "console": [], "id": "wtAr", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='wtAr-0' random-id='43f9b7c8-d5ca-26d9-751c-53c2d8ff1196'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;PRINT from id =
