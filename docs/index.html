sh": "7992f7cd92013973ae42069f719ea5a0", "console": [], "id": "woNf", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E     account        total  postings\n------------------  -----  --------\nExpenses:Books       25           1\nExpenses:Food       100           2\nExpenses:Transport   15           1\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "e5d693d634a05442e148323267f453ad", "console": [], "id": "woJz", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EExample 1\u003C/strong\u003E \u2014 keep only the accounts whose total spending exceeds 20. This drops \u003Ccode\u003EExpenses:Transport\u003C/code\u003E (total 15), leaving the larger groups:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "77e954e7c10184fcb34b0315238bb43e", "console": [], "id": "IcuF", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='IcuF-0' random-id='f56476d6-4296-e7f5-5741-1d6854ca117f'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT account, sum(number) AS total\u0026#92;nWHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;nGROUP BY account\u0026#92;nHAVING sum(number) \u0026gt; 20\u0026#92;nORDER BY account\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;HAVING on sum()\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "34b39962a4c298cfa13b36f2565890f0", "console": [], "id": "apkh", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   account      total\n--------------  -----\nExpenses:Books   25  \nExpenses:Food   100  \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "d00ef0d6648bd550c215daaebcc712df", "console": [], "id": "nraM", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EExample 2\u003C/strong\u003E \u2014 the HAVING condition can use any aggregate, not just the one shown in the result. Here we keep only the accounts that have \u003Cstrong\u003Emore than one\u003C/strong\u003E posting, which selects \u003Ccode\u003EExpenses:Food\u003C/code\u003E alone:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "82adae7a8de1847c5a6108f4ae8d6d73", "console": [], "id": "jtKA", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='jtKA-0' random-id='4d2d1d86-efee-4283-c1fe-ba850939491a'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT account, count(number) AS postings, sum(number) AS total\u0026#92;nWHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;nGROUP BY account\u0026#92;nHAVING count(number) \u0026gt; 1\u0026#92;nORDER BY account\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;HAVING on count()\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "0b7b8b53e9400740e28579db2a122c15", "console": [], "id": "RPdS", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   account     postings  total\n-------------  --------  -----\nExpenses:Food         2  100  \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "96c17396e54091146ebfe6c5cdc4f4d5", "console": [], "id": "caVS", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"135-pivot-by\"\u003E13.5 PIVOT BY\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "48324a964d2b14b8b0ff9d044c2707ef", "console": [], "id": "DDKv", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe result of an \u003Ca href=\"#121-aggregate-functions-and-aggregate-queries\"\u003Eaggregate query\u003C/a\u003E grouped by two columns is a one-dimensional list of rows, where each row corresponds to one combination of the two grouping values. The \u003Ccode\u003EPIVOT BY\u003C/code\u003E clause rotates such a result into a \u003Cstrong\u003Etwo-dimensional table\u003C/strong\u003E: the values of one column become the rows, the values of the other column become the columns, and the remaining target columns fill the cells.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe syntax is:\u003C/span\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003EPIVOT BY \u0026lt;column1\u0026gt;, \u0026lt;column2\u0026gt;\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003Ewhere the values of \u003Ccode\u003E\u0026lt;column1\u0026gt;\u003C/code\u003E become the \u003Cstrong\u003Erows\u003C/strong\u003E and the values of \u003Ccode\u003E\u0026lt;column2\u0026gt;\u003C/code\u003E become the \u003Cstrong\u003Ecolumns\u003C/strong\u003E of the pivoted table. The columns can be referenced either by name or by their 1-based position in the targets list (e.g. \u003Ccode\u003EPIVOT BY 1, 2\u003C/code\u003E).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe following rules apply:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EBoth columns must be present in the \u003Ccode\u003ESELECT\u003C/code\u003E targets list.\u003C/li\u003E\n\u003Cli\u003EThe two columns must be different.\u003C/li\u003E\n\u003Cli\u003EThe second column must be a \u003Ccode\u003EGROUP BY\u003C/code\u003E column (this guarantees that its values are unique within each row).\u003C/li\u003E\n\u003Cli\u003EThe header of the first output column is named \u003Ccode\u003E\u0026lt;column1\u0026gt;/\u0026lt;column2\u0026gt;\u003C/code\u003E as a reminder of what the rows and the columns represent.\u003C/li\u003E\n\u003Cli\u003ECombinations for which there is no data are filled with \u003Ccode\u003ENULL\u003C/code\u003E (rendered as empty cells).\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us demonstrate this with the ledger below, which has postings to three expense accounts spread over two years (note that \u003Ccode\u003EExpenses:Books\u003C/code\u003E has postings only in 2024):\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c3f2b76c924c887a021cdd017628cfc5", "console": [], "id": "fbqP", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='fbqP-0' random-id='a2d06308-2a6c-17fa-be28-57a0ced8c5cc'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2023-01-01 open Assets:Bank\u0026#92;n2023-01-01 open Expenses:Food\u0026#92;n2023-01-01 open Expenses:Transport\u0026#92;n2023-01-01 open Expenses:Books\u0026#92;n\u0026#92;n2023-02-05 * \u0026#92;\u0026quot;Groceries\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   40 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2023-07-10 * \u0026#92;\u0026quot;Restaurant\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   60 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2023-03-15 * \u0026#92;\u0026quot;Bus pass\u0026#92;\u0026quot;\u0026#92;n  Expenses:Transport  30 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-01-20 * \u0026#92;\u0026quot;Groceries\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   50 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-04-02 * \u0026#92;\u0026quot;Taxi\u0026#92;\u0026quot;\u0026#92;n  Expenses:Transport  25 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-08-09 * \u0026#92;\u0026quot;Train ticket\u0026#92;\u0026quot;\u0026#92;n  Expenses:Transport  45 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-11-11 * \u0026#92;\u0026quot;Novel\u0026#92;\u0026quot;\u0026#92;n  Expenses:Books  25 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for PIVOT BY demo\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "09dab51d21e617c20c65cf19abb1d0a0", "console": [], "id": "GRVe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EFirst, the aggregate query \u003Cstrong\u003Ewithout\u003C/strong\u003E \u003Ccode\u003EPIVOT BY\u003C/code\u003E \u2014 one row per (account, year) combination:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "9d946d8bbdd43b577817fce5617bceb4", "console": [], "id": "RmEB", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='RmEB-0' random-id='ef4e457a-3352-e451-ed01-2d3f3a34a59a'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT account, year, sum(position) AS balance\u0026#92;nWHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;nGROUP BY account, year\u0026#92;nORDER BY account, year\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Aggregate query without PIVOT BY\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "6e1c8288015df66e7e9b21cbc0e8ef45", "console": [], "id": "uqrr", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E     account        year  balance\n------------------  ----  -------\nExpenses:Books      2024   25 USD\nExpenses:Food       2023  100 USD\nExpenses:Food       2024   50 USD\nExpenses:Transport  2023   30 USD\nExpenses:Transport  2024   70 USD\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "f3358343ab06be7badda8ed0544acd76", "console": [], "id": "iAfA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EExample 1\u003C/strong\u003E \u2014 adding \u003Ccode\u003EPIVOT BY account, year\u003C/code\u003E turns the same result into a table with one row per account and one column per year. Note the \u003Ccode\u003Eaccount/year\u003C/code\u003E header of the first column and the empty (NULL) cell for \u003Ccode\u003EExpenses:Books\u003C/code\u003E in 2023:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "4bf48248ba9d97e787a991ded5e41367", "console": [], "id": "VsLQ", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='VsLQ-0' random-id='f4bc59eb-780d-48c5-f952-ab5abd4ee84d'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT account, year, sum(position) AS balance\u0026#92;nWHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;nGROUP BY account, year\u0026#92;nPIVOT BY account, year\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;PIVOT BY account, year\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "c08b79c1cc781d9308469e248508b005", "console": [], "id": "Qmhk", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   account/year       2023    2024 \n------------------  -------  ------\nExpenses:Books               25 USD\nExpenses:Food       100 USD  50 USD\nExpenses:Transport   30 USD  70 USD\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "93f7c73b763007971c250708dfff6e01", "console": [], "id": "FNIj", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe same query can be written with column positions instead of names: \u003Ccode\u003EPIVOT BY 1, 2\u003C/code\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EExample 2\u003C/strong\u003E \u2014 swapping the two columns (\u003Ccode\u003EPIVOT BY year, account\u003C/code\u003E) transposes the table: years become the rows and accounts become the columns:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "650f6f7de210b7e78b5552b77c937517", "console": [], "id": "OzNN", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='OzNN-0' random-id='04bb9c75-c04e-b18e-cfc0-2c2ea47532a7'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT account, year, sum(position) AS balance\u0026#92;nWHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;nGROUP BY account, year\u0026#92;nPIVOT BY year, account\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;PIVOT BY year, account\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "8c41a992af81cd05b19f15a7c635028e", "console": [], "id": "xWDH", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003Eyear/account  Expenses:Books  Expenses:Food  Expenses:Transport\n------------  --------------  -------------  ------------------\n        2023                  100 USD        30 USD            \n        2024  25 USD           50 USD        70 USD            \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "bc8de35ec4378deaa2519ee04cc0da1a", "console": [], "id": "GSGh", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EExample 3\u003C/strong\u003E \u2014 if the targets list contains \u003Cstrong\u003Emore than one\u003C/strong\u003E remaining column besides the two pivot columns, each pivoted column is expanded into a group of columns, one per remaining target. The headers are then named \u003Ccode\u003E\u0026lt;value\u0026gt;/\u0026lt;target-name\u0026gt;\u003C/code\u003E:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "12a21e77364d16bf54ff7becb3d99d96", "console": [], "id": "dwpo", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='dwpo-0' random-id='d7b7982a-c0ec-8e1c-2e8f-643240fb4888'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT account, year, sum(position) AS balance, count(*) AS postings\u0026#92;nWHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;nGROUP BY account, year\u0026#92;nPIVOT BY account, year\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;PIVOT BY with two value columns\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "c942095027578781af7dbd356ad9094e", "console": [], "id": "cAqx", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   account/year     2023/balance  2023/postings  2024/balance  2024/postings\n------------------  ------------  -------------  ------------  -------------\nExpenses:Books                                   25 USD                    1\nExpenses:Food       100 USD                   2  50 USD                    1\nExpenses:Transport   30 USD                   1  70 USD                    2\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "e00745f959b8dad37f66a93211ec9476", "console": [], "id": "cRdS", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"14-subqueries\"\u003E14 Subqueries\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "fd7b41d4f763984db9e1383ef3eda292", "console": [], "id": "SFAy", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EA \u003Cstrong\u003Esubquery\u003C/strong\u003E is a \u003Ccode\u003ESELECT\u003C/code\u003E statement nested, in parentheses, inside another query. beanquery supports subqueries in two distinct places:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EIn the \u003Cstrong\u003EFROM clause\u003C/strong\u003E, where a subquery acts as a \u003Cem\u003Ederived table\u003C/em\u003E \u2014 the outer query reads from the result of the inner query instead of from a real table (see \u003Ca href=\"#141-subqueries-in-the-from-clause-derived-tables\"\u003Esection 14.1\u003C/a\u003E).\u003C/li\u003E\n\u003Cli\u003EInside a \u003Cstrong\u003EWHERE expression\u003C/strong\u003E, together with the \u003Ccode\u003EIN\u003C/code\u003E, \u003Ccode\u003EANY\u003C/code\u003E and \u003Ccode\u003EALL\u003C/code\u003E operators, where a subquery supplies a list of values to test against (see \u003Ca href=\"#142-subqueries-in-where-in-any-and-all\"\u003Esection 14.2\u003C/a\u003E).\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ETwo limitations are worth stating up front:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003ECorrelated subqueries are not supported.\u003C/strong\u003E A subquery cannot reference columns of the current row of the outer query; it is evaluated once, independently of the outer query.\u003C/li\u003E\n\u003Cli\u003EA subquery used with \u003Ccode\u003EIN\u003C/code\u003E / \u003Ccode\u003EANY\u003C/code\u003E / \u003Ccode\u003EALL\u003C/code\u003E \u003Cstrong\u003Emust return exactly one column\u003C/strong\u003E, otherwise beanquery raises \u003Cem\u003E\"subquery has too many columns\"\u003C/em\u003E.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "13a7badb54a4914cd8a27d23fe81a695", "console": [], "id": "CPUx", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"141-subqueries-in-the-from-clause-derived-tables\"\u003E14.1 Subqueries in the FROM clause (derived tables)\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "2b9855ba66f3469c0d1add0589fa27f8", "console": [], "id": "QHqy", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EA subquery written in parentheses in the \u003Ccode\u003EFROM\u003C/code\u003E clause becomes a temporary table that the outer query selects from. The columns of this derived table are the named targets of the inner query, so remember to give the inner expressions names with \u003Ccode\u003EAS\u003C/code\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ENote, that such subquery can be used only in the #table form of the \u003Ccode\u003ESELECT\u003C/code\u003E query.\u003C/span\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003ESELECT a + 2 AS b FROM (SELECT 3 AS a FROM #)\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003EDerived tables shine in two situations where the \u003Ca href=\"#134-having\"\u003EHAVING clause\u003C/a\u003E cannot help:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Cstrong\u003EAggregating over the result of an aggregation\u003C/strong\u003E \u2014 an \u003Cem\u003Eaggregate of an aggregate\u003C/em\u003E. beanquery does not allow nesting aggregate functions directly (\u003Ccode\u003Emax(sum(number))\u003C/code\u003E is rejected), and \u003Ccode\u003EHAVING\u003C/code\u003E can only \u003Cem\u003Efilter\u003C/em\u003E groups, not aggregate them a second time.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EFiltering or sorting on a computed value by its alias\u003C/strong\u003E \u2014 the outer query refers to the inner query's named columns with ordinary (non-aggregate) expressions, instead of repeating the aggregate functions.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us use the ledger below \u2014 three expense categories: \u003Ccode\u003EFood\u003C/code\u003E = 100 (2 postings), \u003Ccode\u003ETransport\u003C/code\u003E = 15 (1 posting), \u003Ccode\u003EBooks\u003C/code\u003E = 30 (2 postings).\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "afe18ad3a96913a60960e1ce002addaa", "console": [], "id": "hdfU", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='hdfU-0' random-id='5f2dc003-1f30-988a-e0cb-c86600185fa2'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2024-01-01 open Assets:Bank\u0026#92;n2024-01-01 open Expenses:Food\u0026#92;n2024-01-01 open Expenses:Transport\u0026#92;n2024-01-01 open Expenses:Books\u0026#92;n\u0026#92;n2024-01-02 * \u0026#92;\u0026quot;Groceries\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   40 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-01-03 * \u0026#92;\u0026quot;Groceries\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   5 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-01-05 * \u0026#92;\u0026quot;Restaurant\u0026#92;\u0026quot;\u0026#92;n  Expenses:Food   60 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-01-09 * \u0026#92;\u0026quot;Bus ticket\u0026#92;\u0026quot;\u0026#92;n  Expenses:Transport  15 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-01-20 * \u0026#92;\u0026quot;Novel\u0026#92;\u0026quot;\u0026#92;n  Expenses:Books  25 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026#92;n2024-01-22 * \u0026#92;\u0026quot;Comic\u0026#92;\u0026quot;\u0026#92;n  Expenses:Books  10 USD\u0026#92;n  Assets:Bank\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for subquery demos\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "0d1e19065196400ca437702974aaf617", "console": [], "id": "rLAi", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EUse case 1 \u2014 aggregate of an aggregate.\u003C/strong\u003E Suppose we want summary statistics \u003Cem\u003Eacross\u003C/em\u003E the expense categories: how many categories there are, the largest category total, and the average spend per category. Each of these aggregates over the per-category totals, so the inner query computes one total per category and the outer query aggregates those rows. (beanquery has no \u003Ccode\u003Eavg()\u003C/code\u003E function, so the average is computed as \u003Ccode\u003Esum(total) / count(account)\u003C/code\u003E.)\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "65ade0ddecd02736110b1fb1823bfa72", "console": [], "id": "mwwB", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='mwwB-0' random-id='cbe91caf-7805-b8b2-4586-c0cc26a76730'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT\u0026#92;n  count(account) AS qnt_categories,\u0026#92;n  min(total) AS smallest_category,\u0026#92;n  max(total) AS largest_category,\u0026#92;n  sum(total) / count(account) AS avg_per_category\u0026#92;nFROM (\u0026#92;n  SELECT account, sum(number) AS total\u0026#92;n  WHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;n  GROUP BY account\u0026#92;n)\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Aggregate of an aggregate\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "80e8c4e992d765973f6f71171f784633", "console": [], "id": "itov", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003Eqnt_categories  smallest_category  largest_category         avg_per_category      \n--------------  -----------------  ----------------  -----------------------------\n             3  15                 105               51.66666666666666666666666667\n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "af165099d2c8dcc562ba12dde71a4c27", "console": [], "id": "rFPH", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThere is no way to express this with \u003Ccode\u003EHAVING\u003C/code\u003E (which only filters) or with a single \u003Ccode\u003EGROUP BY\u003C/code\u003E query (which cannot nest aggregates).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EUse case 2 \u2014 filtering on a computed alias.\u003C/strong\u003E Here the inner query computes a total and a posting count per category, and the outer query keeps only the categories with a total above 20 \u003Cstrong\u003Eand\u003C/strong\u003E more than one posting, referring to the computed columns by their names \u003Ccode\u003Etotal\u003C/code\u003E and \u003Ccode\u003En\u003C/code\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EUnlike use case 1, this \u003Cem\u003Ecan\u003C/em\u003E be done with \u003Ccode\u003EHAVING\u003C/code\u003E \u2014 but \u003Ccode\u003EHAVING\u003C/code\u003E cannot reference the output aliases \u003Ccode\u003Etotal\u003C/code\u003E and \u003Ccode\u003En\u003C/code\u003E, so the aggregate expressions have to be repeated in the condition.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us show 2 versions of query for this situation (with subquery and with \u003Ccode\u003EHAVING\u003C/code\u003E)\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "91c75fcf09337e67d4c4b6d4a07cdc55", "console": [], "id": "deJo", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "2ba9a8fb1035c387f9a47d98a54a59e1", "console": [], "id": "LIVT", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "becc091e3d9ee8a9d96a0acc353f86f0", "console": [], "id": "rEhs", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='deJo-0' random-id='244ad635-79f8-455c-57e2-a985dd102be6'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT account, total, n\u0026#92;nFROM (\u0026#92;n  SELECT account, sum(number) AS total, count(number) AS n\u0026#92;n  WHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;n  GROUP BY account\u0026#92;n)\u0026#92;nWHERE total \u0026gt; 20 AND n \u0026gt; 1\u0026#92;nORDER BY total\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Filtering on a computed alias (subquery)\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E   account      total  n\n--------------  -----  -\nExpenses:Books   35    2\nExpenses:Food   105    3\n\u003C/pre\u003E\u003C/div\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='LIVT-0' random-id='d5124a84-f55a-e5a5-472c-88659325bdfa'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT account, sum(number) AS total, count(number) AS n\u0026#92;nWHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;nGROUP BY account\u0026#92;nHAVING sum(number) \u0026gt; 20 AND count(number) \u0026gt; 1\u0026#92;nORDER BY sum(number)\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Equivalent query using HAVING\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E   account      total  n\n--------------  -----  -\nExpenses:Books   35    2\nExpenses:Food   105    3\n\u003C/pre\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "b230a0cbbf52ea474a4f6064159b37c6", "console": [], "id": "YKuE", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"142-subqueries-in-where-in-any-and-all\"\u003E14.2 Subqueries in WHERE: IN, ANY and ALL\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "ce7768fc4c2ffecf5045ddd203281383", "console": [], "id": "WqtP", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EA single-column subquery can be used on the right-hand side of the \u003Ccode\u003EIN\u003C/code\u003E, \u003Ccode\u003EANY\u003C/code\u003E and \u003Ccode\u003EALL\u003C/code\u003E operators to test a value against the list of values it returns:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003Ex IN (SELECT ...)\u003C/code\u003E \u2014 true when \u003Ccode\u003Ex\u003C/code\u003E equals one of the returned values.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Ex \u0026lt;op\u0026gt; ANY (SELECT ...)\u003C/code\u003E \u2014 true when the comparison \u003Ccode\u003E\u0026lt;op\u0026gt;\u003C/code\u003E holds for \u003Cstrong\u003Eat least one\u003C/strong\u003E returned value.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Ex \u0026lt;op\u0026gt; ALL (SELECT ...)\u003C/code\u003E \u2014 true when the comparison \u003Ccode\u003E\u0026lt;op\u0026gt;\u003C/code\u003E holds for \u003Cstrong\u003Eevery\u003C/strong\u003E returned value.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EHere \u003Ccode\u003E\u0026lt;op\u0026gt;\u003C/code\u003E is a comparison operator. With \u003Ccode\u003E=\u003C/code\u003E, the \u003Ccode\u003EANY\u003C/code\u003E form is just a more verbose \u003Ccode\u003EIN\u003C/code\u003E (\u003Ccode\u003Ex = ANY (...)\u003C/code\u003E is the same as \u003Ccode\u003Ex IN (...)\u003C/code\u003E), so \u003Ccode\u003EANY\u003C/code\u003E and \u003Ccode\u003EALL\u003C/code\u003E are mainly useful together with \u003Ccode\u003E\u0026lt;\u003C/code\u003E and \u003Ccode\u003E\u0026gt;\u003C/code\u003E:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003Ex \u0026gt; ALL (SELECT ...)\u003C/code\u003E means \u003Cem\u003Ex is greater than the largest\u003C/em\u003E returned value.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Ex \u0026gt; ANY (SELECT ...)\u003C/code\u003E means \u003Cem\u003Ex is greater than the smallest\u003C/em\u003E returned value \u2014 note that, despite how it reads in English, \u003Ccode\u003E\u0026gt; ANY\u003C/code\u003E does \u003Cstrong\u003Enot\u003C/strong\u003E mean \"greater than all of them\".\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EThese subqueries are part of the \u003Ccode\u003EWHERE\u003C/code\u003E expression, so they work in \u003Cstrong\u003Eboth\u003C/strong\u003E SELECT query types \u2014 the \u003Ca href=\"#8-select-query\"\u003Etraditional form\u003C/a\u003E and the \u003Ca href=\"#8-select-query\"\u003E#table form\u003C/a\u003E \u2014 and the examples below use the traditional form (no \u003Ccode\u003EFROM #postings\u003C/code\u003E).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EA common pattern is a two-step selection: an inner aggregate query identifies the accounts of interest, and the outer query then returns the individual postings of those accounts. Here the inner query finds expense accounts whose total reaches 40, and the outer query lists every posting belonging to them:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "ad741eb245aafc157272cb8cb7d3dc14", "console": [], "id": "QIRM", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='QIRM-0' random-id='ccaf20d0-d867-433c-18b2-c1a4d7ba2caa'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT account, date, number\u0026#92;nWHERE account IN (\u0026#92;n  SELECT account\u0026#92;n  WHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;n  GROUP BY account\u0026#92;n  HAVING sum(number) \u0026gt;= 40\u0026#92;n)\u0026#92;nORDER BY account, date\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;All postings of accounts, where total of that account \u0026amp;gt; 40\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "0a592a5372bf2518f28aa207f54cb194", "console": [], "id": "JBHw", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   account        date     number\n-------------  ----------  ------\nExpenses:Food  2024-01-02  40    \nExpenses:Food  2024-01-03   5    \nExpenses:Food  2024-01-05  60    \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "5ab2b9b5059789d3fc0d41eaa849e07b", "console": [], "id": "ssjl", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe next example uses \u003Ccode\u003E\u0026gt; ALL\u003C/code\u003E to compare each posting against a set of values computed by a subquery. This is the main reason to reach for \u003Ccode\u003EANY\u003C/code\u003E / \u003Ccode\u003EALL\u003C/code\u003E: beanquery has no scalar subqueries (\u003Ccode\u003Enumber \u0026gt; (SELECT max(number) ...)\u003C/code\u003E is rejected), so a quantified comparison is the way to test a value against a subquery result.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe query lists the single expense postings that are larger than \u003Cstrong\u003Eevery\u003C/strong\u003E \u003Ccode\u003EExpenses:Books\u003C/code\u003E purchase.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "cccb2d85dcef7f89e770d6fae78dbd5e", "console": [], "id": "Xzlh", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='Xzlh-0' random-id='dc1aa6cb-3636-76d4-8bbe-3eac7009034b'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT account, date, number\u0026#92;nWHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;nAND number \u0026gt; ALL (SELECT number WHERE account ~ \u0026#x27;Expenses:Books\u0026#x27;)\u0026#92;nORDER BY number\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Expenses larger than the most expensive book\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "897498ebb58f22d77f77b43b8177b8fc", "console": [], "id": "eRfO", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E   account        date     number\n-------------  ----------  ------\nExpenses:Food  2024-01-02  40    \nExpenses:Food  2024-01-05  60    \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "a487ad4f9574414393ed9544f40793f5", "console": [], "id": "RTbr", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ESwapping \u003Ccode\u003EALL\u003C/code\u003E for \u003Ccode\u003EANY\u003C/code\u003E changes the meaning from \"every\" to \"at least one\". The query below lists the expense postings that are smaller than \u003Cstrong\u003EANY\u003C/strong\u003E \u003Ccode\u003EExpenses:Books\u003C/code\u003E purchase \u2014 that is, smaller than the \u003Cem\u003Elargest\u003C/em\u003E book amount.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "74ee7e1a2db7e835bc40e24e637fae8e", "console": [], "id": "Ngti", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='Ngti-0' random-id='b8b1249d-3864-b839-36a1-d65be7ebec71'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT account, date, number\u0026#92;nWHERE account ~ \u0026#x27;^Expenses\u0026#x27;\u0026#92;nAND number \u0026lt; ANY (SELECT number WHERE account ~ \u0026#x27;Expenses:Books\u0026#x27;)\u0026#92;nORDER BY number\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Expenses smaller than the most expensive book\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "12385279c1b03c6b1fe659013a0d13a0", "console": [], "id": "ROQi", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E     account           date     number\n------------------  ----------  ------\nExpenses:Food       2024-01-03   5    \nExpenses:Books      2024-01-22  10    \nExpenses:Transport  2024-01-09  15    \n\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "7bbe5d13c77978beaa07ea030c53828e", "console": [], "id": "wvJm", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"15-statement-operators-open-on-close-on-clear\"\u003E15 Statement operators (OPEN ON, CLOSE ON, CLEAR)\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "fff7db3827b221f9f4254f626a022c81", "console": [], "id": "xoMx", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe shell provides a few operators designed to facilitate the generation of balance sheets and income statements. The particular methodology used to define these operations should be described in detail in the \u003Ca href=\"https://docs.google.com/document/d/100tGcA4blh6KSXPRGCZpUlyxaRUwFHEvnz_k9DyZFn4/edit?usp=sharing\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\u201cintroduction to double-entry bookkeeping\u201d\u003C/a\u003E document that accompanies Beancount and is mostly located in the source code in the \u003Ca href=\"https://github.com/beancount/beancount/blob/master/beancount/ops/summarize.py\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Esummarize\u003C/a\u003E module.\nThese special operators are provided on the FROM clause that is made available on the various forms of query commands in the shell. These further transform the set of entries selected by the FROM expression at the transaction level (not postings).\nPlease note that these are not from standard SQL; these are extensions provided by this shell language only.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EFor demonstrations let us use the following ledger (borrowed with some changes from the \u003Ca href=\"https://github.com/beancount/beancount/blob/master/beancount/ops/summarize_test.py\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Esummarize_test\u003C/a\u003E)\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c352c8da2d2339d810509bd51294d047", "console": [], "id": "BqQy", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='BqQy-0' random-id='2d3a764e-7410-053f-3b94-1e86e4e6876c'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2011-01-01 open Income:Salary\u0026#92;n2011-01-01 open Expenses:Taxes\u0026#92;n2011-01-01 open Expenses:Shopping\u0026#92;n2011-01-01 open Liabilities:CreditCard\u0026#92;n2011-01-01 open Assets:US:Checking\u0026#92;n2011-01-01 open Assets:CA:Checking\u0026#92;n\u0026#92;n2011-03-01 * \u0026#92;\u0026quot;Some income and expense to be summarized\u0026#92;\u0026quot;\u0026#92;n    Income:Salary       -10000 USD\u0026#92;n    Expenses:Taxes        3600 USD\u0026#92;n    Assets:US:Checking    6400 USD\u0026#92;n\u0026#92;n2012-03-02 * \u0026#92;\u0026quot;Some expenses and liabilities to be summarized\u0026#92;\u0026quot;\u0026#92;n    Liabilities:CreditCard -200 USD\u0026#92;n    Expenses:Shopping       200 USD\u0026#92;n\u0026#92;n2012-03-03 * \u0026#92;\u0026quot;Some conversion to be summarized\u0026#92;\u0026quot;\u0026#92;n    Assets:US:Checking   -5000 USD @ 1.2 CAD\u0026#92;n    Assets:CA:Checking    6000 CAD\u0026#92;n\u0026#92;n;; 2012-06-01  BEGIN --------------------------------\u0026#92;n\u0026#92;n2012-08-01 * \u0026#92;\u0026quot;Some income and expense to show\u0026#92;\u0026quot;\u0026#92;n    Income:Salary       -11000 USD\u0026#92;n    Expenses:Taxes        3200 USD\u0026#92;n    Assets:US:Checking    7800 USD\u0026#92;n\u0026#92;n2012-08-02 * \u0026#92;\u0026quot;Some other conversion to be summarized\u0026#92;\u0026quot;\u0026#92;n    Assets:US:Checking   -3000 USD @ 1.25 CAD\u0026#92;n    Assets:CA:Checking    3750 CAD\u0026#92;n\u0026#92;n;; 2013-01-01  END   --------------------------------\u0026#92;n\u0026#92;n2013-02-01 * \u0026#92;\u0026quot;Some income and expense to be truncated\u0026#92;\u0026quot;\u0026#92;n    Income:Salary       -10000 USD\u0026#92;n    Expenses:Taxes        3600 USD\u0026#92;n    Assets:US:Checking    6400 USD\u0026#92;n  \u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for Statement Operators demo:\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "afc3c5599ab0049d85962437f3e15415", "console": [], "id": "RtXZ", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"151-opening-a-period-open-on-clause\"\u003E15.1 Opening a Period (OPEN ON clause)\u003C/h4\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "81b00190fb4e3e709235327fc14bd680", "console": [], "id": "yotB", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EOpening an exercise period at a particular date replaces all entries before that date with summarization entries that book the expected balance against an Equity \u201copening balances\u201d account and implicitly clears the income and expenses to zero by transferring their balances to an Equity \u201cprevious earnings\u201d account (see beancount.ops.summarize.open() for implementation details)\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "546657158cab5b13e3b34fc2304d9a92", "console": [], "id": "YQPh", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "2011319e3cedbd5a9733b3827c7ed32b", "console": [], "id": "nHTC", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='YQPh-0' random-id='3b345697-744d-4596-e97a-c772ba794469'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;PRINT FROM OPEN ON 2012-08-01\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Let us use PRINT statement to demonstrate how OPEN ON converts the ledger\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EOn the left side you see the original ledger for reference and on the right side the ledger transformed by the OPEN ON statement\u003C/span\u003E\u003C/span\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='BqQy-0' random-id='2d3a764e-7410-053f-3b94-1e86e4e6876c'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2011-01-01 open Income:Salary\u0026#92;n2011-01-01 open Expenses:Taxes\u0026#92;n2011-01-01 open Expenses:Shopping\u0026#92;n2011-01-01 open Liabilities:CreditCard\u0026#92;n2011-01-01 open Assets:US:Checking\u0026#92;n2011-01-01 open Assets:CA:Checking\u0026#92;n\u0026#92;n2011-03-01 * \u0026#92;\u0026quot;Some income and expense to be summarized\u0026#92;\u0026quot;\u0026#92;n    Income:Salary       -10000 USD\u0026#92;n    Expenses:Taxes        3600 USD\u0026#92;n    Assets:US:Checking    6400 USD\u0026#92;n\u0026#92;n2012-03-02 * \u0026#92;\u0026quot;Some expenses and liabilities to be summarized\u0026#92;\u0026quot;\u0026#92;n    Liabilities:CreditCard -200 USD\u0026#92;n    Expenses:Shopping       200 USD\u0026#92;n\u0026#92;n2012-03-03 * \u0026#92;\u0026quot;Some conversion to be summarized\u0026#92;\u0026quot;\u0026#92;n    Assets:US:Checking   -5000 USD @ 1.2 CAD\u0026#92;n    Assets:CA:Checking    6000 CAD\u0026#92;n\u0026#92;n;; 2012-06-01  BEGIN --------------------------------\u0026#92;n\u0026#92;n2012-08-01 * \u0026#92;\u0026quot;Some income and expense to show\u0026#92;\u0026quot;\u0026#92;n    Income:Salary       -11000 USD\u0026#92;n    Expenses:Taxes        3200 USD\u0026#92;n    Assets:US:Checking    7800 USD\u0026#92;n\u0026#92;n2012-08-02 * \u0026#92;\u0026quot;Some other conversion to be summarized\u0026#92;\u0026quot;\u0026#92;n    Assets:US:Checking   -3000 USD @ 1.25 CAD\u0026#92;n    Assets:CA:Checking    3750 CAD\u0026#92;n\u0026#92;n;; 2013-01-01  END   --------------------------------\u0026#92;n\u0026#92;n2013-02-01 * \u0026#92;\u0026quot;Some income and expense to be truncated\u0026#92;\u0026quot;\u0026#92;n    Income:Salary       -10000 USD\u0026#92;n    Expenses:Taxes        3600 USD\u0026#92;n    Assets:US:Checking    6400 USD\u0026#92;n  \u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for Statement Operators demo:\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E2011-01-01 open Income:Salary\n2011-01-01 open Expenses:Taxes\n2011-01-01 open Expenses:Shopping\n2011-01-01 open Liabilities:CreditCard\n2011-01-01 open Assets:US:Checking\n2011-01-01 open Assets:CA:Checking\n\n2012-07-31 S \u0026quot;Opening balance for \u0026#x27;Assets:CA:Checking\u0026#x27; (Summarization)\u0026quot;\n  Assets:CA:Checking        6000 CAD\n  Equity:Opening-Balances  -6000 CAD\n\n2012-07-31 S \u0026quot;Opening balance for \u0026#x27;Assets:US:Checking\u0026#x27; (Summarization)\u0026quot;\n  Assets:US:Checking        1400 USD\n  Equity:Opening-Balances  -1400 USD\n\n2012-07-31 S \u0026quot;Opening balance for \u0026#x27;Equity:Conversions:Previous\u0026#x27; (Summarization)\u0026quot;\n  Equity:Conversions:Previous   5000 USD\n  Equity:Opening-Balances      -5000 USD\n  Equity:Conversions:Previous  -6000 CAD\n  Equity:Opening-Balances       6000 CAD\n\n2012-07-31 S \u0026quot;Opening balance for \u0026#x27;Equity:Earnings:Previous\u0026#x27; (Summarization)\u0026quot;\n  Equity:Earnings:Previous  -6200 USD\n  Equity:Opening-Balances    6200 USD\n\n2012-07-31 S \u0026quot;Opening balance for \u0026#x27;Liabilities:CreditCard\u0026#x27; (Summarization)\u0026quot;\n  Liabilities:CreditCard   -200 USD\n  Equity:Opening-Balances   200 USD\n\n2012-08-01 * \u0026quot;Some income and expense to show\u0026quot;\n  Income:Salary       -11000 USD\n  Expenses:Taxes        3200 USD\n  Assets:US:Checking    7800 USD\n\n2012-08-02 * \u0026quot;Some other conversion to be summarized\u0026quot;\n  Assets:US:Checking  -3000 USD @ 1.25 CAD\n  Assets:CA:Checking   3750 CAD\n\n2013-02-01 * \u0026quot;Some income and expense to be truncated\u0026quot;\n  Income:Salary       -10000 USD\n  Expenses:Taxes        3600 USD\n  Assets:US:Checking    6400 USD\n\u003C/pre\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "c22aa905dc4cc991f279178b6b5b4f0a", "console": [], "id": "fRSo", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ETo make it more demonstrative, let's compare balances of accounts on the date before 2012-08-01  without and with the  \u003Ccode\u003EOPEN ON 2012-08-01\u003C/code\u003E clause\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "25c2ec94688850a32a4df00108141a91", "console": [], "id": "NoVh", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "1de01b3a001e93854fabc1365151e9b5", "console": [], "id": "wXlx", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "fdb70b22a5ba5f6032d11efe9c76393a", "console": [], "id": "sbcA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "ea16be637fb83ed6129236da81abedcf", "console": [], "id": "mZtb", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "344c066f0596dd958caa1e6917be38ee", "console": [], "id": "WRHP", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='NoVh-0' random-id='4d415ac7-6a09-0790-6c67-58560eb2df5a'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT \u0026#92;n  account, sum(position) as acc_balance\u0026#92;n\u0026#92;nWHERE \u0026#92;n   date \u0026lt; 2012-08-01\u0026#92;nGROUP BY account\u0026#92;nORDER BY account\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Without OPEN ON\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E       account              acc_balance     \n----------------------  --------------------\nAssets:CA:Checking      6000 CAD            \nAssets:US:Checking                  1400 USD\nExpenses:Shopping                    200 USD\nExpenses:Taxes                      3600 USD\nIncome:Salary                     -10000 USD\nLiabilities:CreditCard              -200 USD\n\u003C/pre\u003E\u003C/div\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='sbcA-0' random-id='bff954ec-a51f-70f8-30f7-9ecfcfa449c0'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;SELECT \u0026#92;n  account, sum(position) as acc_balance\u0026#92;nFROM OPEN ON 2012-08-01\u0026#92;nWHERE \u0026#92;n   date \u0026lt; 2012-08-01\u0026#92;nGROUP BY account\u0026#92;nORDER BY account\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-inv come after the given date and ensuring that currency conversions are correctly corrected for (see beancount.ops.summarize.close() for implementation details).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ENote that the closing date should be one day after the last transaction you would like to include (this is in line with the convention we use everywhere in Beancount whereby starting dates are inclusive and ending dates exclusive).\nThe closing date is optional. If the date is not specified, the date one day beyond the date of the last entry is used.\nClosing a period leaves the Income and Expenses accounts as they are, that is, their balances are not cleared to zero to Equity. This is because closing is also used to produce final balances for income statements. \u201cClearing\u201d, as described in the next section, is only needed for balance sheets.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c57ca7fa331d2e276b8248f335e64dd0", "console": [], "id": "LBfo", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "86a97061e997c681fc68481569c9501a", "console": [], "id": "pcvP", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='LBfo-0' random-id='cd57871a-721c-e795-9347-d42a9689102c'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;PRINT FROM CLOSE ON 2013-01-01\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Let us use PRINT statement to demonstrate how CLOSE ON converts the ledger\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-h ized\u0026quot;\n  Assets:US:Checking  -3000 USD @ 1.25 CAD\n  Assets:CA:Checking   3750 CAD\n\n2012-12-31 C \u0026quot;Conversion for (-8000 USD, 9750 CAD)\u0026quot;\n  Equity:Conversions:Current   8000 USD @ 0 NOTHING\n  Equity:Conversions:Current  -9750 CAD @ 0 NOTHING\n\u003C/pre\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "907a30e971f6fc96961cc88f599fcccb", "console": [], "id": "xfVF", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E??\u003C/strong\u003E What is this   @ 0 NOTHING. Why is this needed?\nWhy is it not possible to put this like this\u003C/span\u003E\n\u003Cdiv class=\"language-cbmbas codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"mf\"\u003E2012\u003C/span\u003E\u003Cspan class=\"o\"\u003E-\u003C/span\u003E\u003Cspan class=\"mf\"\u003E12\u003C/span\u003E\u003Cspan class=\"o\"\u003E-\u003C/span\u003E\u003Cspan class=\"mf\"\u003E31\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003EC\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"s\"\u003E\u0026quot;Conversion for (-8000 USD, 9750 CAD)\u0026quot;\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E  \u003C/span\u003E\u003Cspan class=\"n\"\u003EEquity\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E\u003Cspan class=\"n\"\u003EConversions\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E\u003Cspan class=\"n\"\u003ECurrent\u003C/span\u003E\u003Cspan class=\"w\"\u003E   \u003C/span\u003E\u003Cspan class=\"mf\"\u003E8000\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003EUSD\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"err\"\u003E@@\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"mf\"\u003E9750\u003C/span\u003E\ ": [], "id": "BAZC", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='IeYd-0' random-id='117ba009-ac4d-e7ef-ec1b-112c9f000091'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;PRINT FROM CLEAR\u0026#92;n\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Let us use the PRINT statement to demonstrate how CLEAR converts the ledger\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;sql\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-min-height='1' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EOn the left side you see the original ledger for reference and on the right side the ledger transformed by the CLEAR statement\u003C/span\u003E\u003C/span\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='BqQy-0' random-id='2d3a764e-7410-053f-3b94-1e86e4e6876c'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;2011-01-01 open Income:Salary\u0026#92;n2011-01-01 open Expenses:Taxes\u0026#92;n2011-01-01 open Expenses:Shopping\u0026#92;n2011-01-01 open Liabilities:CreditCard\u0026#92;n2011-01-01 open Assets:US:Checking\u0026#92;n2011-01-01 open Assets:CA:Checking\u0026#92;n\u0026#92;n2011-03-01 * \u0026#92;\u0026quot;Some income and expense to be summarized\u0026#92;\u0026quot;\u0026#92;n    Income:Salary       -10000 USD\u0026#92;n    Expenses:Taxes        3600 USD\u0026#92;n    Assets:US:Checking    6400 USD\u0026#92;n\u0026#92;n2012-03-02 * \u0026#92;\u0026quot;Some expenses and liabilities to be summarized\u0026#92;\u0026quot;\u0026#92;n    Liabilities:CreditCard -200 USD\u0026#92;n    Expenses:Shopping       200 USD\u0026#92;n\u0026#92;n2012-03-03 * \u0026#92;\u0026quot;Some conversion to be summarized\u0026#92;\u0026quot;\u0026#92;n    Assets:US:Checking   -5000 USD @ 1.2 CAD\u0026#92;n    Assets:CA:Checking    6000 CAD\u0026#92;n\u0026#92;n;; 2012-06-01  BEGIN --------------------------------\u0026#92;n\u0026#92;n2012-08-01 * \u0026#92;\u0026quot;Some income and expense to show\u0026#92;\u0026quot;\u0026#92;n    Income:Salary       -11000 USD\u0026#92;n    Expenses:Taxes        3200 USD\u0026#92;n    Assets:US:Checking    7800 USD\u0026#92;n\u0026#92;n2012-08-02 * \u0026#92;\u0026quot;Some other conversion to be summarized\u0026#92;\u0026quot;\u0026#92;n    Assets:US:Checking   -3000 USD @ 1.25 CAD\u0026#92;n    Assets:CA:Checking    3750 CAD\u0026#92;n\u0026#92;n;; 2013-01-01  END   --------------------------------\u0026#92;n\u0026#92;n2013-02-01 * \u0026#92;\u0026quot;Some income and expense to be truncated\u0026#92;\u0026quot;\u0026#92;n    Income:Salary       -10000 USD\u0026#92;n    Expenses:Taxes        3600 USD\u0026#92;n    Assets:US:Checking    6400 USD\u0026#92;n  \u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Ledger for Statement Operators demo:\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-language='\u0026quot;python\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-disabled='false' data-show-copy-button='true' data-debounce='true'\u003E\u003C/marimo-code-editor\u003E\u003C/marimo-ui-element\u003E\u003Cpre class='text-xs'\u003E2011-01-01 open Income:Salary\n2011-01-01 open Expenses:Taxes\n2011-01-01 open Expenses:Shopping\n2011-01-01 open Liabilities:CreditCard\n2011-01-01 open Assets:US:Checking\n2011-01-01 open Assets:CA:Checking\n\n2011-03-01 * \u0026quot;Some income and expense to be summarized\u0026quot;\n  Income:Salary       -10000 USD\n  Expenses:Taxes        3600 USD\n  Assets:US:Checking    6400 USD\n\n2012-03-02 * \u0026quot;Some expenses and liabilities to be summarized\u0026quot;\n  Liabilities:CreditCard  -200 USD\n  Expenses:Shopping        200 USD\n\n2012-03-03 * \u0026quot;Some conversion to be summarized\u0026quot;\n  Assets:US:Checking  -5000 USD @ 1.2 CAD\n  Assets:CA:Checking   6000 CAD\n\n2012-08-01 * \u0026quot;Some income and expense to show\u0026quot;\n  Income:Salary       -11000 USD\n  Expenses:Taxes        3200 USD\n  Assets:US:Checking    7800 USD\n\n2012-08-02 * \u0026quot;Some other conversion to be summarized\u0026quot;\n  Assets:US:Checking  -3000 USD @ 1.25 CAD\n  Assets:CA:Checking   3750 CAD\n\n2013-02-01 * \u0026quot;Some income and expense to be truncated\u0026quot;\n  Income:Salary       -10000 USD\n  Expenses:Taxes        3600 USD\n  Assets:US:Checking    6400 USD\n\n2013-02-01 T \u0026quot;Transfer balance for \u0026#x27;Expenses:Shopping\u0026#x27; (Transfer balance)\u0026quot;\n  Expenses:Shopping        -200 USD\n  Equity:Earnings:Current   200 USD\n\n2013-02-01 T \u0026quot;Transfer balance for \u0026#x27;Expenses:Taxes\u0026#x27; (Transfer balance)\u0026quot;\n  Expenses:Taxes           -10400 USD\n  Equity:Earnings:Current   10400 USD\n\n2013-02-01 T \u0026quot;Transfer balance for \u0026#x27;Income:Salary\u0026#x27; (Transfer balance)\u0026quot;\n  Income:Salary             31000 USD\n  Equity:Earnings:Current  -31000 USD\n\u003C/pre\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "58cc6d2993ab3087384c440d33bb821d", "console": [], "id": "uyHZ", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u0
